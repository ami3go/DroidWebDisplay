name: Apply desktop manager header layout

on:
  push:
    branches: [feat/desktop-manager-header-layout]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/desktop-manager-header-layout
          fetch-depth: 0

      - name: Apply source and regression changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          gui_path = Path("droid_web_display/desktop/gui.py")
          gui = gui_path.read_text(encoding="utf-8")

          gui = replace_once(
              gui,
              "import os\nfrom pathlib import Path\n",
              "from html import escape\nimport os\nfrom pathlib import Path\n",
              "html import",
          )
          gui = replace_once(
              gui,
              "from PySide6.QtCore import QObject, QRunnable, QSettings, QThreadPool, QTimer, Qt, QUrl, Signal\n",
              "from PySide6.QtCore import QObject, QRunnable, QSettings, QSize, QThreadPool, QTimer, Qt, QUrl, Signal\n",
              "QSize import",
          )

          gui = replace_once(
              gui,
              '''def _set_button_variant(button: QPushButton, variant: str | None) -> None:\n    button.setProperty("variant", variant)\n    _refresh_widget_style(button)\n\n\n''',
              '''def _set_button_variant(button: QPushButton, variant: str | None) -> None:\n    button.setProperty("variant", variant)\n    _refresh_widget_style(button)\n\n\ndef _make_header_icon_button(\n    icon: QIcon,\n    tooltip: str,\n    accessible_name: str,\n    *,\n    danger: bool = False,\n) -> QPushButton:\n    button = QPushButton()\n    button.setObjectName("headerIconButton")\n    button.setIcon(icon)\n    button.setIconSize(QSize(20, 20))\n    button.setFixedSize(38, 38)\n    button.setToolTip(tooltip)\n    button.setAccessibleName(accessible_name)\n    if danger:\n        button.setProperty("headerDanger", True)\n    return button\n\n\n''',
              "header icon helper",
          )

          old_header = '''        brand_title = QLabel("DroidWebDisplay")\n        brand_title.setObjectName("brandTitle")\n        brand_subtitle = QLabel("Desktop server manager")\n        brand_subtitle.setObjectName("brandSubtitle")\n        brand_layout = QVBoxLayout()\n        brand_layout.setContentsMargins(0, 0, 0, 0)\n        brand_layout.setSpacing(1)\n        brand_layout.addWidget(brand_title)\n        brand_layout.addWidget(brand_subtitle)\n\n        header_layout = QHBoxLayout()\n        header_layout.setContentsMargins(2, 0, 2, 0)\n        header_layout.setSpacing(12)\n        header_layout.addLayout(brand_layout, 1)\n        header_layout.addWidget(self._status_value, 0, Qt.AlignRight | Qt.AlignVCenter)\n'''
          new_header = '''        brand_icon = QLabel()\n        brand_icon.setObjectName("brandIcon")\n        brand_icon.setPixmap(icon.pixmap(QSize(34, 34)))\n        brand_icon.setFixedSize(40, 40)\n        brand_icon.setAlignment(Qt.AlignCenter)\n        brand_icon.setToolTip("DroidWebDisplay")\n\n        brand_title = QLabel("DroidWebDisplay")\n        brand_title.setObjectName("brandTitle")\n\n        self._header_open_button = _make_header_icon_button(\n            self.style().standardIcon(QStyle.StandardPixmap.SP_DesktopIcon),\n            "Open DroidWebDisplay",\n            "Open DroidWebDisplay",\n        )\n        self._header_open_button.setEnabled(False)\n        self._header_open_button.clicked.connect(self.controller.open_browser)\n\n        self._header_exit_button = _make_header_icon_button(\n            self.style().standardIcon(QStyle.StandardPixmap.SP_TitleBarCloseButton),\n            "Exit DroidWebDisplay",\n            "Exit DroidWebDisplay",\n            danger=True,\n        )\n        self._header_exit_button.clicked.connect(self.request_exit)\n\n        header_layout = QHBoxLayout()\n        header_layout.setContentsMargins(2, 0, 2, 0)\n        header_layout.setSpacing(10)\n        header_layout.addWidget(brand_icon, 0, Qt.AlignVCenter)\n        header_layout.addWidget(brand_title, 0, Qt.AlignVCenter)\n        header_layout.addStretch(1)\n        header_layout.addWidget(self._status_value, 0, Qt.AlignVCenter)\n        header_layout.addWidget(self._header_open_button, 0, Qt.AlignVCenter)\n        header_layout.addWidget(self._header_exit_button, 0, Qt.AlignVCenter)\n'''
          gui = replace_once(gui, old_header, new_header, "desktop header")

          old_footer_actions = '''        footer_open = QPushButton("Open DroidWebDisplay")\n        footer_open.clicked.connect(self.controller.open_browser)\n        _set_button_variant(footer_open, "primary")\n\n        footer_exit = QPushButton("Exit")\n        footer_exit.clicked.connect(self.request_exit)\n        _set_button_variant(footer_exit, "danger")\n\n        footer = QFrame()\n        footer.setObjectName("footer")\n        footer_layout = QHBoxLayout(footer)\n        footer_layout.setContentsMargins(0, 9, 0, 0)\n        footer_layout.setSpacing(8)\n        footer_layout.addWidget(self._footer_device, 1)\n        footer_layout.addWidget(footer_open)\n        footer_layout.addWidget(footer_exit)\n'''
          new_footer_actions = '''        footer = QFrame()\n        footer.setObjectName("footer")\n        footer_layout = QHBoxLayout(footer)\n        footer_layout.setContentsMargins(0, 9, 0, 0)\n        footer_layout.setSpacing(8)\n        footer_layout.addWidget(self._footer_device, 1)\n'''
          gui = replace_once(gui, old_footer_actions, new_footer_actions, "footer actions")

          old_summary = '''        summary, summary_layout = _make_card("Summary")\n        self._url_value = _field_value(selectable=True)\n        self._network_value = _field_value()\n        self._device_value = _field_value()\n        self._uptime_value = _field_value()\n        self._error_value = _field_value("None")\n        self._error_value.setWordWrap(True)\n        self._error_value.setProperty("errorValue", True)\n\n        form = QFormLayout()\n        form.setContentsMargins(0, 0, 0, 0)\n        form.setHorizontalSpacing(18)\n        form.setVerticalSpacing(9)\n        form.setFieldGrowthPolicy(QFormLayout.FieldGrowthPolicy.ExpandingFieldsGrow)\n        for name, value in (\n            ("URL", self._url_value),\n            ("Network", self._network_value),\n            ("Android", self._device_value),\n            ("Uptime", self._uptime_value),\n            ("Last error", self._error_value),\n        ):\n            form.addRow(_field_label(name), value)\n        summary_layout.addLayout(form)\n'''
          new_summary = '''        summary, summary_layout = _make_card("Summary")\n        summary_layout.setAlignment(Qt.AlignTop)\n        summary_layout.setSpacing(8)\n\n        self._url_value = _field_value()\n        self._url_value.setObjectName("summaryUrl")\n        self._url_value.setTextFormat(Qt.RichText)\n        self._url_value.setTextInteractionFlags(Qt.TextBrowserInteraction)\n        self._url_value.setOpenExternalLinks(False)\n        self._url_value.setToolTip("Open DroidWebDisplay in the default browser")\n        self._url_value.linkActivated.connect(self._open_summary_url)\n        self._network_value = _field_value()\n        self._device_value = _field_value()\n        self._uptime_value = _field_value()\n        self._error_value = _field_value("None")\n        self._error_value.setWordWrap(True)\n        self._error_value.setProperty("errorValue", True)\n\n        form = QFormLayout()\n        form.setContentsMargins(0, 0, 0, 0)\n        form.setHorizontalSpacing(18)\n        form.setVerticalSpacing(7)\n        form.setFieldGrowthPolicy(QFormLayout.FieldGrowthPolicy.ExpandingFieldsGrow)\n        form.setFormAlignment(Qt.AlignTop)\n        form.setLabelAlignment(Qt.AlignLeft | Qt.AlignVCenter)\n        for name, value in (\n            ("Local URL", self._url_value),\n            ("Network", self._network_value),\n            ("Android", self._device_value),\n            ("Uptime", self._uptime_value),\n            ("Last error", self._error_value),\n        ):\n            form.addRow(_field_label(name), value)\n        summary_layout.addLayout(form)\n        summary_layout.addStretch(1)\n'''
          gui = replace_once(gui, old_summary, new_summary, "summary layout")

          gui = replace_once(
              gui,
              '''    def _open_latest_release(self) -> None:\n        if self._latest_release_url:\n            QDesktopServices.openUrl(QUrl(self._latest_release_url))\n\n''',
              '''    def _open_latest_release(self) -> None:\n        if self._latest_release_url:\n            QDesktopServices.openUrl(QUrl(self._latest_release_url))\n\n    def _open_summary_url(self, href: str) -> None:\n        if href:\n            QDesktopServices.openUrl(QUrl(href))\n\n''',
              "summary URL handler",
          )

          gui = replace_once(
              gui,
              '''        self._set_status_visual(snapshot.state, labels[snapshot.state])\n        self._url_value.setText(snapshot.url)\n        self._network_value.setText(snapshot.network_mode)\n''',
              '''        self._set_status_visual(snapshot.state, labels[snapshot.state])\n        safe_url = escape(snapshot.url, quote=True)\n        self._url_value.setText(\n            f'<a href="{safe_url}" style="color:#82a6ff; text-decoration:none;">{safe_url}</a>'\n        )\n        self._network_value.setText(snapshot.network_mode)\n''',
              "summary URL rendering",
          )

          gui = replace_once(
              gui,
              '''        server_ok = snapshot.state in {ServerState.RUNNING, ServerState.EXTERNAL}\n        if server_ok:\n''',
              '''        server_ok = snapshot.state in {ServerState.RUNNING, ServerState.EXTERNAL}\n        self._header_open_button.setEnabled(server_ok)\n        if server_ok:\n''',
              "header open enabled state",
          )
          gui_path.write_text(gui, encoding="utf-8")

          theme_path = Path("droid_web_display/desktop/theme.py")
          theme = theme_path.read_text(encoding="utf-8")
          theme = replace_once(
              theme,
              '''QLabel#brandSubtitle, QLabel#sectionHint {{\n    color: {c['text_muted']};\n    font-size: 9pt;\n}}\n''',
              '''QLabel#sectionHint {{\n    color: {c['text_muted']};\n    font-size: 9pt;\n}}\n\nQLabel#brandIcon {{\n    background: transparent;\n}}\n\nQLabel#summaryUrl {{\n    color: {c['focus']};\n    font-weight: 600;\n}}\n''',
              "desktop label styles",
          )
          theme = replace_once(
              theme,
              '''QPushButton:hover {{\n    background-color: {c['surface_button_hover']};\n    border-color: #45516a;\n}}\n''',
              '''QPushButton:hover {{\n    background-color: {c['surface_button_hover']};\n    border-color: #45516a;\n}}\n\nQPushButton#headerIconButton {{\n    min-width: 36px;\n    min-height: 36px;\n    max-width: 36px;\n    max-height: 36px;\n    padding: 0;\n    border-radius: 10px;\n    background-color: {c['surface_alt']};\n}}\n\nQPushButton#headerIconButton:hover {{\n    background-color: {c['surface_button_hover']};\n    border-color: {c['focus']};\n}}\n\nQPushButton#headerIconButton[headerDanger="true"]:hover {{\n    background-color: {c['danger_surface']};\n    border-color: {c['danger_border']};\n}}\n''',
              "header icon button styles",
          )
          theme_path.write_text(theme, encoding="utf-8")

          test_path = Path("tests/desktop/test_layout_regression.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '''def test_primary_open_and_exit_actions_live_outside_tabs() -> None:\n    gui = (ROOT / "droid_web_display/desktop/gui.py").read_text(encoding="utf-8")\n    assert 'footer.setObjectName("footer")' in gui\n    assert 'footer_open = QPushButton("Open DroidWebDisplay")' in gui\n    assert 'footer_exit = QPushButton("Exit")' in gui\n\n''',
              '''def test_primary_open_and_exit_actions_live_in_header_as_icons() -> None:\n    gui = (ROOT / "droid_web_display/desktop/gui.py").read_text(encoding="utf-8")\n    assert 'brand_icon.setObjectName("brandIcon")' in gui\n    assert 'brand_title = QLabel("DroidWebDisplay")' in gui\n    assert "QStyle.StandardPixmap.SP_DesktopIcon" in gui\n    assert "QStyle.StandardPixmap.SP_TitleBarCloseButton" in gui\n    assert "header_layout.addWidget(self._status_value" in gui\n    assert "header_layout.addWidget(self._header_open_button" in gui\n    assert "header_layout.addWidget(self._header_exit_button" in gui\n    assert 'footer_open = QPushButton("Open DroidWebDisplay")' not in gui\n    assert 'footer_exit = QPushButton("Exit")' not in gui\n\n\ndef test_summary_is_compact_and_local_url_is_clickable() -> None:\n    gui = (ROOT / "droid_web_display/desktop/gui.py").read_text(encoding="utf-8")\n    assert "summary_layout.setAlignment(Qt.AlignTop)" in gui\n    assert "summary_layout.addStretch(1)" in gui\n    assert '("Local URL", self._url_value)' in gui\n    assert 'self._url_value.setObjectName("summaryUrl")' in gui\n    assert "Qt.TextBrowserInteraction" in gui\n    assert "self._url_value.linkActivated.connect(self._open_summary_url)" in gui\n    assert "QDesktopServices.openUrl(QUrl(href))" in gui\n\n''',
              "layout regression tests",
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

          rm .github/workflows/desktop-manager-header-layout-patch.yml

      - name: Verify desktop UI source
        shell: bash
        run: |
          python -m py_compile droid_web_display/desktop/gui.py droid_web_display/desktop/theme.py
          python - <<'PY'
          from pathlib import Path
          gui = Path('droid_web_display/desktop/gui.py').read_text(encoding='utf-8')
          theme = Path('droid_web_display/desktop/theme.py').read_text(encoding='utf-8')
          tests = Path('tests/desktop/test_layout_regression.py').read_text(encoding='utf-8')
          assert 'brand_icon.setObjectName("brandIcon")' in gui
          assert '("Local URL", self._url_value)' in gui
          assert 'self._header_open_button.setEnabled(server_ok)' in gui
          assert 'QPushButton#headerIconButton' in theme
          assert 'test_summary_is_compact_and_local_url_is_clickable' in tests
          assert 'footer_open = QPushButton("Open DroidWebDisplay")' not in gui
          PY

      - name: Commit layout update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "desktop: refine manager header and summary"
          git push origin HEAD:feat/desktop-manager-header-layout
