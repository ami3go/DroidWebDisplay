name: Add Control Path Debug Log

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  add-control-debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json

      - name: Add bounded control-path instrumentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:160]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          debug = Path('apps/web-client/src/control-debug.ts')
          debug.write_text('''export interface ControlDebugEvent {\n  readonly sequence: number;\n  readonly timestamp: string;\n  readonly monotonicMs: number;\n  readonly category: string;\n  readonly event: string;\n  readonly details: Readonly<Record<string, unknown>>;\n}\n\nconst MAX_CONTROL_DEBUG_EVENTS = 1500;\nconst events: ControlDebugEvent[] = [];\nlet sequence = 0;\n\ntype DebugRoot = typeof globalThis & {\n  __dwdLatencyMetrics?: Record<string, number | string | boolean>;\n  __dwdControlDebugEvents?: readonly ControlDebugEvent[];\n};\n\nfunction monotonicNow(): number {\n  return globalThis.performance?.now?.() ?? Date.now();\n}\n\nfunction safeValue(key: string, value: unknown): unknown {\n  // Never persist user text, clipboard data, auth material or opaque payloads in\n  // a diagnostic bundle. Control debugging needs lifecycle/transport metadata only.\n  if (/(text|clipboard|pin|password|token|cookie|authorization|payload|content)/i.test(key)) return "<redacted>";\n  if (typeof value === "bigint") return value.toString();\n  if (value instanceof Error) return { name: value.name, message: value.message };\n  if (Array.isArray(value)) return value.slice(0, 32).map((item, index) => safeValue(String(index), item));\n  if (value && typeof value === "object") {\n    const output: Record<string, unknown> = {};\n    for (const [childKey, childValue] of Object.entries(value as Record<string, unknown>).slice(0, 64)) {\n      output[childKey] = safeValue(childKey, childValue);\n    }\n    return output;\n  }\n  if (typeof value === "string") return value.slice(0, 240);\n  return value;\n}\n\nfunction safeDetails(details: Readonly<Record<string, unknown>>): Readonly<Record<string, unknown>> {\n  return safeValue("details", details) as Readonly<Record<string, unknown>>;\n}\n\nexport function controlDebug(category: string, event: string, details: Readonly<Record<string, unknown>> = {}): void {\n  const entry: ControlDebugEvent = {\n    sequence: ++sequence,\n    timestamp: new Date().toISOString(),\n    monotonicMs: monotonicNow(),\n    category,\n    event,\n    details: safeDetails(details),\n  };\n  events.push(entry);\n  if (events.length > MAX_CONTROL_DEBUG_EVENTS) events.splice(0, events.length - MAX_CONTROL_DEBUG_EVENTS);\n  (globalThis as DebugRoot).__dwdControlDebugEvents = events;\n  globalThis.dispatchEvent(new CustomEvent("droidwebdisplay-control-debug", { detail: entry }));\n}\n\nexport function controlDebugEvents(): readonly ControlDebugEvent[] {\n  return [...events];\n}\n\nexport function clearControlDebugLog(): void {\n  events.length = 0;\n  sequence = 0;\n  (globalThis as DebugRoot).__dwdControlDebugEvents = events;\n  globalThis.dispatchEvent(new CustomEvent("droidwebdisplay-control-debug-cleared"));\n}\n\nexport function controlDebugBundle(extra: Readonly<Record<string, unknown>> = {}): Record<string, unknown> {\n  const root = globalThis as DebugRoot;\n  return {\n    schemaVersion: 1,\n    generatedAt: new Date().toISOString(),\n    browser: {\n      userAgent: navigator.userAgent,\n      language: navigator.language,\n      visibilityState: document.visibilityState,\n      documentHasFocus: document.hasFocus(),\n      activeElement: document.activeElement?.tagName ?? null,\n      origin: location.origin,\n    },\n    latencyMetrics: safeValue("latencyMetrics", { ...(root.__dwdLatencyMetrics ?? {}) }),\n    extra: safeDetails(extra),\n    events: controlDebugEvents(),\n  };\n}\n\nexport function downloadControlDebugBundle(extra: Readonly<Record<string, unknown>> = {}): void {\n  const payload = JSON.stringify(controlDebugBundle(extra), null, 2);\n  const blob = new Blob([payload], { type: "application/json" });\n  const url = URL.createObjectURL(blob);\n  const anchor = document.createElement("a");\n  const stamp = new Date().toISOString().replace(/[:.]/g, "-");\n  anchor.href = url;\n  anchor.download = `droidwebdisplay-control-debug-${stamp}.json`;\n  anchor.click();\n  window.setTimeout(() => URL.revokeObjectURL(url), 0);\n}\n''', encoding='utf-8')

          # Instrument WebSocket lifecycle and expose a safe state snapshot.
          transport = Path('apps/web-client/src/websocket-transport.ts')
          replace_once(
              transport,
              'import type { BridgeTransport } from "@droid-web-display/scrcpy-protocol";\n',
              'import type { BridgeTransport } from "@droid-web-display/scrcpy-protocol";\nimport { controlDebug } from "./control-debug.js";\n',
          )
          replace_once(
              transport,
              '  readonly #sockets = new Set<WebSocket>();\n  readonly #clientId = crypto.randomUUID();\n',
              '  readonly #sockets = new Set<WebSocket>();\n  readonly #socketChannels = new Map<WebSocket, "video" | "audio" | "control">();\n  readonly #clientId = crypto.randomUUID();\n',
          )
          replace_once(
              transport,
              '      writable: writableToSocket(socket),\n',
              '      writable: writableToSocket(socket, this.sessionId),\n',
          )
          replace_once(
              transport,
              '''  public async close(): Promise<void> {\n    for (const socket of this.#sockets) {\n''',
              '''  public diagnostics(): Record<string, unknown> {\n    return {\n      sessionId: this.sessionId,\n      clientId: this.#clientId,\n      sockets: [...this.#sockets].map((socket) => ({\n        channel: this.#socketChannels.get(socket) ?? "unknown",\n        readyState: socket.readyState,\n        bufferedAmount: socket.bufferedAmount,\n      })),\n    };\n  }\n\n  public async close(): Promise<void> {\n    controlDebug("transport", "close-requested", this.diagnostics());\n    for (const socket of this.#sockets) {\n''',
          )
          replace_once(
              transport,
              '    this.#sockets.clear();\n    const metrics = latencyMetrics();\n',
              '    this.#sockets.clear();\n    this.#socketChannels.clear();\n    const metrics = latencyMetrics();\n',
          )
          replace_once(
              transport,
              '''    const socket = this.socketFactory(url);\n    socket.binaryType = "arraybuffer";\n    this.#sockets.add(socket);\n    await waitForOpen(socket);\n    socket.addEventListener("close", () => this.#sockets.delete(socket), { once: true });\n    return socket;\n''',
              '''    const socket = this.socketFactory(url);\n    socket.binaryType = "arraybuffer";\n    this.#sockets.add(socket);\n    this.#socketChannels.set(socket, channel);\n    controlDebug("websocket", "creating", { sessionId: this.sessionId, channel, readyState: socket.readyState });\n    try {\n      await waitForOpen(socket);\n    } catch (error) {\n      controlDebug("websocket", "open-failed", { sessionId: this.sessionId, channel, error });\n      throw error;\n    }\n    controlDebug("websocket", "opened", { sessionId: this.sessionId, channel, readyState: socket.readyState });\n    socket.addEventListener("error", () => {\n      controlDebug("websocket", "error", { sessionId: this.sessionId, channel, readyState: socket.readyState, bufferedAmount: socket.bufferedAmount });\n    });\n    socket.addEventListener("close", (event) => {\n      controlDebug("websocket", "closed", {\n        sessionId: this.sessionId,\n        channel,\n        code: event.code,\n        reason: event.reason || "",\n        wasClean: event.wasClean,\n        bufferedAmount: socket.bufferedAmount,\n      });\n      this.#sockets.delete(socket);\n      this.#socketChannels.delete(socket);\n    }, { once: true });\n    return socket;\n''',
          )
          replace_once(
              transport,
              'function writableToSocket(socket: WebSocket): WritableStream<Uint8Array> {\n',
              'function writableToSocket(socket: WebSocket, sessionId: string): WritableStream<Uint8Array> {\n',
          )
          replace_once(
              transport,
              '  let sampling = false;\n\n  const sampleBufferedAmount = () => {\n',
              '  let sampling = false;\n  let writeCount = 0;\n\n  const sampleBufferedAmount = () => {\n',
          )
          replace_once(
              transport,
              '''      if (socket.readyState !== WebSocket.OPEN) {\n        throw new Error("Control WebSocket is not open");\n      }\n''',
              '''      if (socket.readyState !== WebSocket.OPEN) {\n        controlDebug("control-writer", "write-rejected", { sessionId, readyState: socket.readyState, bufferedAmount: socket.bufferedAmount });\n        throw new Error("Control WebSocket is not open");\n      }\n''',
          )
          replace_once(
              transport,
              '''      socket.send(chunk);\n      const metrics = latencyMetrics();\n''',
              '''      socket.send(chunk);\n      writeCount += 1;\n      if (writeCount <= 20 || writeCount % 100 === 0) {\n        controlDebug("control-writer", "write", { sessionId, writeCount, bytes: chunk.byteLength, bufferedAmount: socket.bufferedAmount });\n      }\n      const metrics = latencyMetrics();\n''',
          )
          replace_once(
              transport,
              '''    close() {\n      latencyMetrics().controlSocketBufferedBytes = 0;\n''',
              '''    close() {\n      controlDebug("control-writer", "close", { sessionId, writeCount, readyState: socket.readyState, bufferedAmount: socket.bufferedAmount });\n      latencyMetrics().controlSocketBufferedBytes = 0;\n''',
          )
          replace_once(
              transport,
              '''    abort(reason) {\n      latencyMetrics().controlSocketBufferedBytes = 0;\n''',
              '''    abort(reason) {\n      controlDebug("control-writer", "abort", { sessionId, writeCount, readyState: socket.readyState, reason: String(reason ?? "") });\n      latencyMetrics().controlSocketBufferedBytes = 0;\n''',
          )

          # Diagnostics UI controls.
          html = Path('apps/web-client/static/index.html')
          replace_once(
              html,
              '''          <h2>Display sessions</h2>\n          <div id="display-diagnostics" class="display-diagnostics" aria-live="polite"><p class="empty-state">No active display sessions.</p></div>\n''',
              '''          <h2>Display sessions</h2>\n          <div id="display-diagnostics" class="display-diagnostics" aria-live="polite"><p class="empty-state">No active display sessions.</p></div>\n          <h2>Control debug log</h2>\n          <p id="control-debug-summary" class="running-app-status">Control trace ready · 0 events.</p>\n          <div class="two-button-row uniform-buttons"><button id="control-debug-download" type="button" class="secondary">Download control log</button><button id="control-debug-clear" type="button" class="secondary">Clear log</button></div>\n          <p class="control-debug-note">Captures focus, pointer routing, WebSocket lifecycle and control transport metadata. Clipboard and typed text are redacted.</p>\n''',
          )

          styles = Path('apps/web-client/static/styles.css')
          styles.write_text(styles.read_text(encoding='utf-8') + '''\n\n.control-debug-note { margin: 0.45rem 0 0; color: #71869d; font-size: 0.68rem; line-height: 1.4; }\n''', encoding='utf-8')

          main = Path('apps/web-client/src/main.ts')
          replace_once(
              main,
              '      displayDiagnostics: required<HTMLElement>("#display-diagnostics"),\n',
              '      displayDiagnostics: required<HTMLElement>("#display-diagnostics"),\n      controlDebugSummary: required<HTMLElement>("#control-debug-summary"),\n      controlDebugDownload: required<HTMLButtonElement>("#control-debug-download"),\n      controlDebugClear: required<HTMLButtonElement>("#control-debug-clear"),\n',
          )

          controller = Path('apps/web-client/src/controller.ts')
          replace_once(
              controller,
              'import { WebCodecsAudioPlayer, type AudioStatistics } from "./audio-player.js";\n',
              'import { WebCodecsAudioPlayer, type AudioStatistics } from "./audio-player.js";\nimport { clearControlDebugLog, controlDebug, controlDebugEvents, downloadControlDebugBundle } from "./control-debug.js";\n',
          )
          replace_once(
              controller,
              '  readonly displayDiagnostics: HTMLElement;\n',
              '  readonly displayDiagnostics: HTMLElement;\n  readonly controlDebugSummary: HTMLElement;\n  readonly controlDebugDownload: HTMLButtonElement;\n  readonly controlDebugClear: HTMLButtonElement;\n',
          )
          replace_once(
              controller,
              '  #lastDiagnosticsRenderAt = 0;\n  readonly #clipboardAcks = new Map<bigint, ClipboardAckWaiter>();\n',
              '  #lastDiagnosticsRenderAt = 0;\n  #controlDebugHeartbeat: number | null = null;\n  readonly #clipboardAcks = new Map<bigint, ClipboardAckWaiter>();\n',
          )
          replace_once(
              controller,
              '''    this.bindCanvasEvents(elements.canvas);\n    this.renderTabs();\n  }\n''',
              '''    this.bindCanvasEvents(elements.canvas);\n    this.bindControlDebug();\n    this.renderTabs();\n  }\n''',
          )
          replace_once(
              controller,
              '''  public async initialize(): Promise<void> {\n    this.applyProfile(localStorage.getItem("droidwebdisplay-virtual-profile-v1") ?? "chatgpt-desktop");\n''',
              '''  public async initialize(): Promise<void> {\n    controlDebug("lifecycle", "initialize", { visibilityState: document.visibilityState, documentHasFocus: document.hasFocus() });\n    this.applyProfile(localStorage.getItem("droidwebdisplay-virtual-profile-v1") ?? "chatgpt-desktop");\n''',
          )

          # Instrument connect lifecycle around existing deterministic flow.
          replace_once(
              controller,
              '''    const explicitDisplayName = this.elements.displayName.value.trim();\n    const displayName = explicitDisplayName || this.automaticDisplayName(values);\n''',
              '''    const explicitDisplayName = this.elements.displayName.value.trim();\n    const displayName = explicitDisplayName || this.automaticDisplayName(values);\n    controlDebug("session", "connect-requested", {\n      serial,\n      displayMode: values.displayMode,\n      displayName,\n      runtimeCount: this.#runtimes.size,\n      canvasFocus: this.activeDisplayOwnsKeyboardFocus(),\n    });\n''',
          )
          replace_once(
              controller,
              '''      serverSession = await this.#api.startDeviceSession(serial, request);\n      runtimeCanvas = this.allocateRuntimeCanvas(serverSession.sessionId);\n''',
              '''      serverSession = await this.#api.startDeviceSession(serial, request);\n      controlDebug("session", "server-session-started", {\n        sessionId: serverSession.sessionId,\n        serial,\n        displayMode: serverSession.displayMode,\n        displayId: serverSession.display.displayId,\n        displayName: serverSession.display.name,\n      });\n      runtimeCanvas = this.allocateRuntimeCanvas(serverSession.sessionId);\n''',
          )
          replace_once(
              controller,
              '''      protocolSession = await this.#adapter.connect(transport, {\n        video: true,\n        audio: this.elements.audioEnabled.checked,\n        control: true,\n      });\n\n      const runtime: DisplayRuntime = {\n''',
              '''      protocolSession = await this.#adapter.connect(transport, {\n        video: true,\n        audio: this.elements.audioEnabled.checked,\n        control: true,\n      });\n      controlDebug("session", "protocol-connected", { sessionId: serverSession.sessionId, transport: transport.diagnostics() });\n\n      const runtime: DisplayRuntime = {\n''',
          )
          replace_once(
              controller,
              '''      this.activateRuntime(serverSession.sessionId);\n      this.#reconnectCount = 0;\n''',
              '''      this.activateRuntime(serverSession.sessionId);\n      controlDebug("session", "runtime-active", { sessionId: serverSession.sessionId, canvasFocus: runtimeCanvas === document.activeElement });\n      this.#reconnectCount = 0;\n''',
          )
          replace_once(
              controller,
              '''    } catch (error) {\n      if (serverSession && this.#runtimes.has(serverSession.sessionId)) {\n''',
              '''    } catch (error) {\n      controlDebug("session", "connect-error", { sessionId: serverSession?.sessionId ?? null, error });\n      if (serverSession && this.#runtimes.has(serverSession.sessionId)) {\n''',
          )

          # Canvas focus and pointer event trace. MOVE is not logged to avoid flooding.
          replace_once(
              controller,
              '''    canvas.addEventListener("focus", () => this.renderDisplayDiagnostics(true));\n    canvas.addEventListener("blur", () => this.renderDisplayDiagnostics(true));\n''',
              '''    canvas.addEventListener("focus", () => {\n      controlDebug("focus", "canvas-focus", { sessionId: canvas.dataset.sessionId || null, documentHasFocus: document.hasFocus() });\n      this.renderDisplayDiagnostics(true);\n    });\n    canvas.addEventListener("blur", () => {\n      controlDebug("focus", "canvas-blur", {\n        sessionId: canvas.dataset.sessionId || null,\n        documentHasFocus: document.hasFocus(),\n        activeElement: document.activeElement?.tagName ?? null,\n        activeElementId: (document.activeElement as HTMLElement | null)?.id || null,\n      });\n      this.renderDisplayDiagnostics(true);\n    });\n''',
          )
          replace_once(
              controller,
              '''  private activateRuntime(sessionId: string): void {\n    const runtime = this.#runtimes.get(sessionId);\n    if (!runtime) return;\n''',
              '''  private activateRuntime(sessionId: string): void {\n    const runtime = this.#runtimes.get(sessionId);\n    if (!runtime) return;\n    controlDebug("session", "activate-runtime", { sessionId, previousSessionId: this.#activeSessionId, transport: runtime.transport.diagnostics() });\n''',
          )
          replace_once(
              controller,
              '''    runtime.canvas.focus();\n    globalThis.dispatchEvent(new CustomEvent("droidwebdisplay-active-session", { detail: { sessionId } }));\n''',
              '''    runtime.canvas.focus();\n    controlDebug("focus", "canvas-focus-requested", {\n      sessionId,\n      focusSucceeded: runtime.canvas === document.activeElement,\n      documentHasFocus: document.hasFocus(),\n    });\n    globalThis.dispatchEvent(new CustomEvent("droidwebdisplay-active-session", { detail: { sessionId } }));\n''',
          )

          # Add debug helpers before refreshSessionCapacity.
          replace_once(
              controller,
              '  private async refreshSessionCapacity(): Promise<void> {\n',
              '''  private bindControlDebug(): void {\n    const updateSummary = () => {\n      const values = controlDebugEvents();\n      const last = values.at(-1);\n      this.elements.controlDebugSummary.textContent = last\n        ? `Control trace · ${values.length} events · last ${last.category}/${last.event}`\n        : "Control trace ready · 0 events.";\n    };\n    globalThis.addEventListener("droidwebdisplay-control-debug", updateSummary);\n    globalThis.addEventListener("droidwebdisplay-control-debug-cleared", updateSummary);\n    globalThis.addEventListener("focus", () => controlDebug("focus", "window-focus", { documentHasFocus: document.hasFocus() }));\n    globalThis.addEventListener("blur", () => controlDebug("focus", "window-blur", { documentHasFocus: document.hasFocus() }));\n    document.addEventListener("visibilitychange", () => controlDebug("focus", "visibility-change", { visibilityState: document.visibilityState, documentHasFocus: document.hasFocus() }));\n    globalThis.addEventListener("error", (event) => controlDebug("browser", "window-error", { message: event.message, filename: event.filename, line: event.lineno, column: event.colno }));\n    globalThis.addEventListener("unhandledrejection", (event) => controlDebug("browser", "unhandled-rejection", { reason: event.reason instanceof Error ? event.reason : String(event.reason ?? "") }));\n    this.elements.controlDebugClear.addEventListener("click", () => {\n      clearControlDebugLog();\n      controlDebug("debug", "log-cleared");\n    });\n    this.elements.controlDebugDownload.addEventListener("click", () => void this.downloadControlDebug());\n    this.#controlDebugHeartbeat = window.setInterval(() => this.recordControlHeartbeat(), 1000);\n    controlDebug("debug", "logger-ready", { maxEvents: 1500 });\n    updateSummary();\n  }\n\n  private recordControlHeartbeat(): void {\n    if (!this.#runtimes.size) return;\n    const runtime = this.#activeSessionId ? this.#runtimes.get(this.#activeSessionId) : null;\n    const metrics = (globalThis as typeof globalThis & { __dwdLatencyMetrics?: Record<string, unknown> }).__dwdLatencyMetrics ?? {};\n    controlDebug("heartbeat", "control-state", {\n      activeSessionId: this.#activeSessionId,\n      runtimeCount: this.#runtimes.size,\n      documentHasFocus: document.hasFocus(),\n      visibilityState: document.visibilityState,\n      canvasFocus: runtime?.canvas === document.activeElement,\n      activeElement: document.activeElement?.tagName ?? null,\n      activeElementId: (document.activeElement as HTMLElement | null)?.id || null,\n      protocolPresent: this.#protocolSession !== null,\n      transport: runtime?.transport.diagnostics() ?? null,\n      controlSocketBufferedBytes: metrics.controlSocketBufferedBytes ?? null,\n      controlPendingWrites: metrics.controlPendingWrites ?? null,\n      controlPendingMovePointers: metrics.controlPendingMovePointers ?? null,\n      controlQueueDelayMs: metrics.controlQueueDelayMs ?? null,\n      controlLastWriteMs: metrics.controlLastWriteMs ?? null,\n      controlMessagesSent: metrics.controlMessagesSent ?? null,\n      controlLastError: metrics.controlLastError ?? null,\n    });\n  }\n\n  private async downloadControlDebug(): Promise<void> {\n    const serial = this.elements.device.value;\n    let serverDiagnostics: unknown = null;\n    let serverDiagnosticsError: string | null = null;\n    if (serial) {\n      try {\n        serverDiagnostics = await this.#api.displayDiagnostics(serial);\n      } catch (error) {\n        serverDiagnosticsError = errorMessage(error);\n      }\n    }\n    const runtimes = [...this.#runtimes.entries()].map(([sessionId, runtime]) => ({\n      sessionId,\n      active: sessionId === this.#activeSessionId,\n      displayName: runtime.serverSession.display.name,\n      displayMode: runtime.serverSession.displayMode,\n      displayId: runtime.serverSession.display.displayId,\n      canvasFocus: runtime.canvas === document.activeElement,\n      transport: runtime.transport.diagnostics(),\n      videoStatistics: runtime.latestStatistics,\n      audioStatistics: runtime.latestAudioStatistics,\n    }));\n    controlDebug("debug", "download-requested", { serial, activeSessionId: this.#activeSessionId, runtimeCount: runtimes.length });\n    downloadControlDebugBundle({\n      serial,\n      activeSessionId: this.#activeSessionId,\n      runtimes,\n      serverDiagnostics,\n      serverDiagnosticsError,\n    });\n  }\n\n  private async refreshSessionCapacity(): Promise<void> {\n''',
          )

          # Pointer delivery trace and errors. Do not record MOVE events.
          replace_once(
              controller,
              '''  private async pointer(event: PointerEvent, action: number): Promise<void> {\n    if (!this.#protocolSession || !this.#activeSessionId) return;\n    const runtime = this.#runtimes.get(this.#activeSessionId);\n    const canvas = event.currentTarget instanceof HTMLCanvasElement ? event.currentTarget : runtime?.canvas;\n    if (!runtime || !canvas || canvas !== runtime.canvas) return;\n''',
              '''  private async pointer(event: PointerEvent, action: number): Promise<void> {\n    if (!this.#protocolSession || !this.#activeSessionId) {\n      if (action !== 2) controlDebug("pointer", "ignored-no-active-session", { action, pointerId: event.pointerId });\n      return;\n    }\n    const sessionId = this.#activeSessionId;\n    const protocolSession = this.#protocolSession;\n    const runtime = this.#runtimes.get(sessionId);\n    const canvas = event.currentTarget instanceof HTMLCanvasElement ? event.currentTarget : runtime?.canvas;\n    if (!runtime || !canvas || canvas !== runtime.canvas) {\n      if (action !== 2) controlDebug("pointer", "ignored-runtime-mismatch", { action, pointerId: event.pointerId, sessionId, canvasSessionId: canvas?.dataset.sessionId ?? null });\n      return;\n    }\n    if (action !== 2) controlDebug("pointer", "event", {\n      action,\n      pointerId: event.pointerId,\n      sessionId,\n      buttons: event.buttons,\n      canvasFocus: canvas === document.activeElement,\n      documentHasFocus: document.hasFocus(),\n      transport: runtime.transport.diagnostics(),\n    });\n''',
          )
          replace_once(
              controller,
              '''    await this.#protocolSession.sendControl({\n      type: ControlMessageType.InjectTouchEvent,\n      action,\n      pointerId: BigInt(event.pointerId),\n      position,\n      pressure: action === 1 || action === 3 ? 0 : Math.max(0.01, event.pressure || 1),\n      actionButton: 0,\n      buttons: event.buttons,\n    });\n''',
              '''    try {\n      await protocolSession.sendControl({\n        type: ControlMessageType.InjectTouchEvent,\n        action,\n        pointerId: BigInt(event.pointerId),\n        position,\n        pressure: action === 1 || action === 3 ? 0 : Math.max(0.01, event.pressure || 1),\n        actionButton: 0,\n        buttons: event.buttons,\n      });\n      if (action !== 2) controlDebug("pointer", "send-complete", { action, pointerId: event.pointerId, sessionId, activeSessionUnchanged: this.#activeSessionId === sessionId });\n    } catch (error) {\n      controlDebug("pointer", "send-error", { action, pointerId: event.pointerId, sessionId, error, transport: runtime.transport.diagnostics() });\n      throw error;\n    }\n''',
          )

          # Central non-pointer control messages and runtime failures/cleanup.
          replace_once(
              controller,
              '''  private async sendMessages(messages: readonly ControlMessage[]): Promise<void> {\n    const session = this.#protocolSession;\n    if (!session) return;\n    for (const message of messages) await session.sendControl(message);\n  }\n''',
              '''  private async sendMessages(messages: readonly ControlMessage[]): Promise<void> {\n    const session = this.#protocolSession;\n    const sessionId = this.#activeSessionId;\n    if (!session || !sessionId) return;\n    for (const message of messages) {\n      controlDebug("control", "message-send", { sessionId, type: message.type });\n      try {\n        await session.sendControl(message);\n        controlDebug("control", "message-complete", { sessionId, type: message.type });\n      } catch (error) {\n        controlDebug("control", "message-error", { sessionId, type: message.type, error });\n        throw error;\n      }\n    }\n  }\n''',
          )
          replace_once(
              controller,
              '''  private async handleRuntimeFailure(sessionId: string, error: unknown): Promise<void> {\n    if (this.#closing || !this.#runtimes.has(sessionId)) return;\n''',
              '''  private async handleRuntimeFailure(sessionId: string, error: unknown): Promise<void> {\n    controlDebug("session", "runtime-failure", { sessionId, error, closing: this.#closing, runtimePresent: this.#runtimes.has(sessionId) });\n    if (this.#closing || !this.#runtimes.has(sessionId)) return;\n''',
          )
          replace_once(
              controller,
              '''  private async cleanupRuntime(sessionId: string): Promise<void> {\n    const runtime = this.#runtimes.get(sessionId);\n    if (!runtime) return;\n''',
              '''  private async cleanupRuntime(sessionId: string): Promise<void> {\n    const runtime = this.#runtimes.get(sessionId);\n    if (!runtime) return;\n    controlDebug("session", "cleanup-start", { sessionId, active: sessionId === this.#activeSessionId, transport: runtime.transport.diagnostics() });\n''',
          )
          replace_once(
              controller,
              '''    this.releaseRuntimeCanvas(runtime.canvas);\n    this.#availableDisplaySlots = Math.min(this.#maximumDisplaySessions, this.#availableDisplaySlots + 1);\n''',
              '''    this.releaseRuntimeCanvas(runtime.canvas);\n    controlDebug("session", "cleanup-complete", { sessionId, remainingRuntimes: this.#runtimes.size });\n    this.#availableDisplaySlots = Math.min(this.#maximumDisplaySessions, this.#availableDisplaySlots + 1);\n''',
          )

          # Tests for the logging contract and privacy boundary.
          layout = Path('apps/web-client/tests/layout.test.mjs')
          layout.write_text(layout.read_text(encoding='utf-8') + '''\n\ntest("control debug logging is downloadable and instruments the full pointer path", async () => {\n  const debugSource = await readFile(resolve(root, "src/control-debug.ts"), "utf8");\n  const transportSource = await readFile(resolve(root, "src/websocket-transport.ts"), "utf8");\n  for (const id of ["control-debug-summary", "control-debug-download", "control-debug-clear"]) {\n    assert.match(html, new RegExp(`id="${id}"`));\n  }\n  assert.match(mainSource, /controlDebugDownload: required<HTMLButtonElement>\\("#control-debug-download"\\)/);\n  assert.match(controllerSource, /controlDebug\\("pointer", "event"/);\n  assert.match(controllerSource, /controlDebug\\("pointer", "send-complete"/);\n  assert.match(controllerSource, /controlDebug\\("pointer", "send-error"/);\n  assert.match(controllerSource, /recordControlHeartbeat/);\n  assert.match(controllerSource, /displayDiagnostics\\(serial\\)/);\n  assert.match(transportSource, /controlDebug\\("websocket", "opened"/);\n  assert.match(transportSource, /controlDebug\\("websocket", "closed"/);\n  assert.match(transportSource, /controlDebug\\("control-writer", "write"/);\n  assert.match(debugSource, /MAX_CONTROL_DEBUG_EVENTS = 1500/);\n  assert.match(debugSource, /clipboard\\|pin\\|password\\|token\\|cookie/);\n  assert.doesNotMatch(controllerSource, /controlDebug\\([^\\n]*message\\.text/);\n});\n''', encoding='utf-8')
          PY

      - run: npm ci
        working-directory: apps/web-client
      - name: Build web client
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Run web client tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Commit control-path debug instrumentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src apps/web-client/static apps/web-client/tests apps/web-client/dist-manifest.json
          git add -f apps/web-client/dist
          git commit -m "Add downloadable multi-display control path diagnostics"
          git push origin HEAD:multi-display-tabs
