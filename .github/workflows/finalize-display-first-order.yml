name: Finalize Display First Order

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/finalize-display-first-order.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Update release order expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/release/test_drawer_icon_order.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "EXPECTED_ORDER = \"['connect','display','clipboard','files','apps','audio','access','network','diagnostics','settings']\"",
              "EXPECTED_ORDER = \"['display','clipboard','files','apps','audio','access','network','diagnostics','settings']\"",
          )
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/finalize-display-first-order.yml
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - name: Install protocol dependencies
        working-directory: packages/scrcpy-protocol
        run: npm ci
      - name: Install web dependencies
        working-directory: apps/web-client
        run: npm ci
      - name: Run final release gate
        run: $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ci.json
      - name: Commit verified final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release/test_drawer_icon_order.py
          git commit -m "Finalize Display-first drawer order"
          git push origin HEAD:agent/connect-drawer
