name: Clipboard Alternate Validation

on:
  push:
    branches: [agent/harden-clipboard-state]

permissions:
  contents: read

jobs:
  release-alt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install verified uv
        shell: bash
        run: |
          set -euxo pipefail
          python tools/fetch_verified_artifact.py uv-linux-x86_64 .tools/uv.tar.gz
          mkdir -p .tools/uv
          tar -xzf .tools/uv.tar.gz -C .tools/uv --strip-components=1
          test "$(.tools/uv/uv --version | awk '{print $1 " " $2}')" = "uv 0.12.4"
      - name: Sync locked Python environment
        run: .tools/uv/uv sync --locked --extra dev
      - working-directory: packages/scrcpy-protocol
        run: npm ci
      - working-directory: apps/web-client
        run: npm ci
      - name: Run central release gate
        run: .tools/uv/uv run python tools/release_gate.py --require-web-client-build --output /tmp/release-gate.json
