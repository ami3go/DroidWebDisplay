name: Supply Chain Probe

on:
  push:
    branches: [agent/supply-chain-hardening-step5]
    paths:
      - .github/workflows/supply-chain-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture Android Platform-Tools archive identities
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL "https://dl.google.com/android/repository/platform-tools-latest-linux.zip" -o platform-tools-linux.zip
          curl -fsSL "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -o platform-tools-windows.zip
          sha256sum platform-tools-linux.zip platform-tools-windows.zip
          echo "--- Linux source.properties ---"
          unzip -p platform-tools-linux.zip platform-tools/source.properties
          echo "--- Windows source.properties ---"
          unzip -p platform-tools-windows.zip platform-tools/source.properties
