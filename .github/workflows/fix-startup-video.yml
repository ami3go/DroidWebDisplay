name: Fix startup video recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-startup-video.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json

      - name: Patch startup decoder backlog handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer = Path('apps/web-client/src/video-renderer.ts')
          text = renderer.read_text(encoding='utf-8')

          replacements = [
              (
                  '} from "@droid-web-display/scrcpy-protocol";\n\nconst DECODER_BACKLOG_RECOVERY_THRESHOLD = 4;',
                  '} from "@droid-web-display/scrcpy-protocol";\nimport { decoderBacklogAction } from "./video-backlog-policy.js";\n\nconst DECODER_BACKLOG_RECOVERY_THRESHOLD = 4;',
              ),
              (
                  '  #awaitingKeyFrame = false;\n  #decodeLatencyMs = 0;',
                  '  #awaitingKeyFrame = false;\n  #decoderHasOutput = false;\n  #decodeLatencyMs = 0;',
              ),
              (
                  '''    if (this.#decoder.decodeQueueSize >= DECODER_BACKLOG_RECOVERY_THRESHOLD) {\n      this.recoverDecoderBacklog();\n      // A keyframe is exactly the packet needed to resume after reset. Decode it\n      // immediately instead of discarding it with the old backlog. Delta frames\n      // are dropped until the next keyframe arrives.\n      if (!packet.keyFrame) {\n        this.#framesDropped += 1;\n        this.emitStatistics(true);\n        return;\n      }\n    }''',
                  '''    const backlogAction = decoderBacklogAction(\n      this.#decoder.decodeQueueSize,\n      DECODER_BACKLOG_RECOVERY_THRESHOLD,\n      this.#decoderHasOutput,\n      packet.keyFrame,\n    );\n    if (backlogAction === "recover") {\n      this.recoverDecoderBacklog();\n      // A fresh keyframe can immediately seed the reset decoder. Delta frames\n      // are dropped until a new keyframe arrives.\n      if (!packet.keyFrame) {\n        this.#framesDropped += 1;\n        this.emitStatistics(true);\n        return;\n      }\n    } else if (backlogAction === "drop-delta") {\n      // During decoder startup, preserve the already queued keyframe instead of\n      // resetting it out of the queue. Bound startup pressure by dropping only\n      // newly arriving delta frames until the decoder produces its first output.\n      this.#framesDropped += 1;\n      this.emitStatistics(true);\n      return;\n    }''',
              ),
              (
                  '    this.#awaitingKeyFrame = true;\n    this.#packetArrivals.clear();',
                  '    this.#awaitingKeyFrame = true;\n    this.#decoderHasOutput = false;\n    this.#packetArrivals.clear();',
              ),
              (
                  '    this.#decoder = null;\n    this.#awaitingKeyFrame = false;\n    this.#packetArrivals.clear();',
                  '    this.#decoder = null;\n    this.#awaitingKeyFrame = false;\n    this.#decoderHasOutput = false;\n    this.#packetArrivals.clear();',
              ),
              (
                  '    this.#decodeOutputs.set(timestamp, decodedAt);\n    this.#framesDecoded += 1;\n\n    const width = frame.displayWidth || frame.codedWidth;',
                  '    this.#decodeOutputs.set(timestamp, decodedAt);\n    this.#framesDecoded += 1;\n    this.#decoderHasOutput = true;\n\n    const width = frame.displayWidth || frame.codedWidth;',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected renderer fragment not found:\n{old}')
              text = text.replace(old, new, 1)
          renderer.write_text(text, encoding='utf-8')

          Path('apps/web-client/src/video-backlog-policy.ts').write_text('''export type DecoderBacklogAction = "decode" | "drop-delta" | "recover";\n\nexport function decoderBacklogAction(\n  queueSize: number,\n  threshold: number,\n  decoderHasOutput: boolean,\n  packetIsKeyFrame: boolean,\n): DecoderBacklogAction {\n  if (queueSize < threshold) return "decode";\n  if (decoderHasOutput || packetIsKeyFrame) return "recover";\n  return "drop-delta";\n}\n''', encoding='utf-8')

          Path('apps/web-client/tests/video-backlog-policy.test.mjs').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { decoderBacklogAction } from "../dist/assets/video-backlog-policy.js";\n\ntest("startup backlog preserves the first queued keyframe", () => {\n  assert.equal(decoderBacklogAction(3, 4, false, false), "decode");\n  assert.equal(decoderBacklogAction(4, 4, false, false), "drop-delta");\n});\n\ntest("startup may recover when a fresh keyframe is available", () => {\n  assert.equal(decoderBacklogAction(4, 4, false, true), "recover");\n});\n\ntest("normal low-latency recovery resumes after first decoder output", () => {\n  assert.equal(decoderBacklogAction(4, 4, true, false), "recover");\n});\n''', encoding='utf-8')

          regression = Path('tests/regression/browser/test_low_latency_runtime.py')
          regression_text = regression.read_text(encoding='utf-8')
          old_read = '    renderer = (root / "apps/web-client/src/video-renderer.ts").read_text(encoding="utf-8")\n'
          new_read = old_read + '    backlog_policy = (root / "apps/web-client/src/video-backlog-policy.ts").read_text(encoding="utf-8")\n'
          if old_read not in regression_text:
              raise SystemExit('Expected renderer read in low-latency regression test not found')
          regression_text = regression_text.replace(old_read, new_read, 1)
          old_contract = '''    # Decoder recovery must keep an arriving keyframe after reset.\n    assert "DECODER_BACKLOG_RECOVERY_THRESHOLD = 4" in renderer\n    assert "if (this.#decoder.decodeQueueSize >= DECODER_BACKLOG_RECOVERY_THRESHOLD)" in renderer\n    assert "if (!packet.keyFrame)" in renderer\n    assert "this.#awaitingKeyFrame = false" in renderer\n'''
          new_contract = '''    # Decoder recovery must preserve the initial queued keyframe until WebCodecs\n    # produces output, while retaining aggressive low-latency recovery afterward.\n    assert "DECODER_BACKLOG_RECOVERY_THRESHOLD = 4" in renderer\n    assert "decoderBacklogAction(" in renderer\n    assert "this.#decoderHasOutput" in renderer\n    assert 'backlogAction === "drop-delta"' in renderer\n    assert 'if (decoderHasOutput || packetIsKeyFrame) return "recover"' in backlog_policy\n    assert 'return "drop-delta"' in backlog_policy\n    assert "if (!packet.keyFrame)" in renderer\n    assert "this.#awaitingKeyFrame = false" in renderer\n'''
          if old_contract not in regression_text:
              raise SystemExit('Expected decoder recovery contract assertions not found')
          regression.write_text(regression_text.replace(old_contract, new_contract, 1), encoding='utf-8')
          PY

      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build

      - name: Build and test web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm test

      - name: Install locked Python environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev

      - name: Run release gate
        run: $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output /tmp/startup-video-fix-gate.json

      - name: Commit generated fix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/video-renderer.ts \
                  apps/web-client/src/video-backlog-policy.ts \
                  apps/web-client/tests/video-backlog-policy.test.mjs \
                  apps/web-client/dist \
                  apps/web-client/dist-manifest.json \
                  tests/regression/browser/test_low_latency_runtime.py
          git diff --cached --check
          git commit -m "Fix initial video keyframe starvation"
          git push origin HEAD:main
