name: Publish DroidWebDisplay v0.11.3

on:
  push:
    branches:
      - release/v0.11.3-publish
    paths:
      - .github/workflows/release-v0.11.3-publish.yml

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: v0.11.3
  RELEASE_VERSION: 0.11.3
  TARGET_COMMIT: ac316efe32e4a0ff731fec706f0ea4237e54241a
  SOURCE_RUN_ID: '31841701778'

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify qualified source and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$TARGET_COMMIT" HEAD

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "main"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$TARGET_COMMIT"

          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Download qualified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/windows artifacts/linux artifacts/evidence release
          gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" --name windows-package-smoke --dir artifacts/windows
          gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" --name linux-appimage-smoke --dir artifacts/linux
          gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" --name supply-chain-evidence --dir artifacts/evidence

          windows_source="$(find artifacts/windows -type f -iname '*.exe' -print -quit)"
          linux_source="$(find artifacts/linux -type f -name '*.AppImage' -print -quit)"
          sbom_source="$(find artifacts/evidence -type f -name 'build-sbom.cdx.json' -print -quit)"
          license_source="$(find artifacts/evidence -type f -name 'license-inventory.json' -print -quit)"

          test -n "$windows_source" && test -f "$windows_source"
          test -n "$linux_source" && test -f "$linux_source"
          test -n "$sbom_source" && test -f "$sbom_source"
          test -n "$license_source" && test -f "$license_source"

          install -m 0644 "$windows_source" "release/DroidWebDisplay-${RELEASE_VERSION}-windows-x86_64.exe"
          install -m 0755 "$linux_source" "release/DroidWebDisplay-${RELEASE_VERSION}-linux-x86_64.AppImage"
          install -m 0644 "$sbom_source" release/build-sbom.cdx.json
          install -m 0644 "$license_source" release/license-inventory.json

          (
            cd release
            sha256sum \
              "DroidWebDisplay-${RELEASE_VERSION}-windows-x86_64.exe" \
              "DroidWebDisplay-${RELEASE_VERSION}-linux-x86_64.AppImage" \
              build-sbom.cdx.json \
              license-inventory.json > SHA256SUMS.txt
          )
      - name: Create release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # DroidWebDisplay v0.11.3

          Patch release from qualified `main` commit `ac316efe32e4a0ff731fec706f0ea4237e54241a`.

          ## What's new

          - Added **Check for updates** to the desktop server manager under **Settings → Updates**.
          - Shows the installed DroidWebDisplay version.
          - Supports **Stable** and **Pre-release** release channels.
          - Reports **Update available**, **Up to date**, or an update-check failure without blocking the server UI.
          - Opens the matching GitHub release page when a release is found.

          ## Release qualification

          - Full DroidWebDisplay Release Gate passed on the exact release commit.
          - Windows x86_64 executable passed desktop-host, CLI, and service smoke tests.
          - Linux x86_64 AppImage passed desktop-host, CLI, and service smoke tests.
          - CycloneDX SBOM and license inventory were generated by the qualified CI run.

          ## Release assets

          - `DroidWebDisplay-0.11.3-windows-x86_64.exe`
          - `DroidWebDisplay-0.11.3-linux-x86_64.AppImage`
          - `SHA256SUMS.txt`
          - `build-sbom.cdx.json`
          - `license-inventory.json`

          This patch does not change the video renderer, scrcpy transport, session handling, or application-switching behavior. The Windows executable is unsigned; verify downloaded files against `SHA256SUMS.txt`.
          EOF
      - name: Publish immutable v0.11.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create "$RELEASE_TAG" \
            -R "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title "DroidWebDisplay v0.11.3" \
            --notes-file RELEASE_NOTES.md \
            "release/DroidWebDisplay-${RELEASE_VERSION}-windows-x86_64.exe" \
            "release/DroidWebDisplay-${RELEASE_VERSION}-linux-x86_64.AppImage" \
            release/SHA256SUMS.txt \
            release/build-sbom.cdx.json \
            release/license-inventory.json
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.name' <<<"$release_json")" = "DroidWebDisplay v0.11.3"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"

          for required in \
            "DroidWebDisplay-${RELEASE_VERSION}-windows-x86_64.exe" \
            "DroidWebDisplay-${RELEASE_VERSION}-linux-x86_64.AppImage" \
            SHA256SUMS.txt \
            build-sbom.cdx.json \
            license-inventory.json; do
            jq -e --arg name "$required" '.assets[] | select(.name == $name)' <<<"$release_json" >/dev/null
          done

          echo "Published: $(jq -r '.html_url' <<<"$release_json")"
