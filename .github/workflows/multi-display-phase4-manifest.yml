name: Multi-display Phase 4 Manifest Refresh

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  refresh-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json
      - run: npm ci
        working-directory: apps/web-client
      - name: Rebuild bundled web client and checksum manifest
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Verify static bundle checksum manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from droid_web_display.release_checks import verify_static_client
          result = verify_static_client(Path.cwd())
          print(result)
          if result.get("status") != "PASS":
              raise SystemExit(1)
          PY
      - name: Commit refreshed bundled client manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/dist-manifest.json
          git add -f apps/web-client/dist
          if git diff --cached --quiet; then
            echo "Bundled client and manifest already current"
            exit 0
          fi
          git commit -m "Refresh Phase 4 web client manifest"
          git push origin HEAD:multi-display-tabs
