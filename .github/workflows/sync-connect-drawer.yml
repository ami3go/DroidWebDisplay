name: Sync Connect Drawer Dist

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/sync-connect-drawer.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Update drawer release expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/release/test_drawer_icon_order.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "['display','clipboard','files','apps','audio','access','network','diagnostics','settings']",
              "['connect','display','clipboard','files','apps','audio','access','network','diagnostics','settings']",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build protocol
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build and test web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm test
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release/test_drawer_icon_order.py apps/web-client/dist-manifest.json
          git add -u apps/web-client/dist
          git diff --cached --quiet && exit 0
          git commit -m "Sync Connect drawer generated assets"
          git push origin HEAD:agent/connect-drawer
