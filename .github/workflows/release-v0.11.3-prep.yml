name: Prepare DroidWebDisplay v0.11.3

on:
  push:
    branches:
      - release/v0.11.3-prep
    paths:
      - .github/workflows/release-v0.11.3-prep.yml

permissions:
  contents: write

env:
  TARGET_COMMIT: 4176d114eb597ac6aa780a456f5a30e595a27efb
  RELEASE_VERSION: 0.11.3

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify release base
        shell: bash
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$TARGET_COMMIT" HEAD
      - name: Bump release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "0.11.3"

          Path("VERSION").write_text(version + "\n", encoding="utf-8")

          init_path = Path("droid_web_display/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          old = '__version__ = "0.11.2"'
          if init_text.count(old) != 1:
              raise SystemExit("unexpected __version__ declaration")
          init_path.write_text(init_text.replace(old, f'__version__ = "{version}"'), encoding="utf-8")

          project_path = Path("pyproject.toml")
          project_text = project_path.read_text(encoding="utf-8")
          old = 'version = "0.11.2"'
          if project_text.count(old) != 1:
              raise SystemExit("unexpected pyproject version declaration")
          project_path.write_text(project_text.replace(old, f'version = "{version}"', 1), encoding="utf-8")

          lock_path = Path("uv.lock")
          lock_text = lock_path.read_text(encoding="utf-8")
          old = 'name = "droid-web-display"\nversion = "0.11.2"\nsource = { editable = "." }'
          new = f'name = "droid-web-display"\nversion = "{version}"\nsource = {{ editable = "." }}'
          if lock_text.count(old) != 1:
              raise SystemExit("unexpected droid-web-display uv.lock package entry")
          lock_path.write_text(lock_text.replace(old, new, 1), encoding="utf-8")

          requirements_path = Path("requirements-runtime.txt")
          requirements_text = requirements_path.read_text(encoding="utf-8")
          old_header = "# DroidWebDisplay v0.11.2 pinned runtime environment."
          new_header = f"# DroidWebDisplay v{version} pinned runtime environment."
          if requirements_text.count(old_header) != 1:
              raise SystemExit("unexpected requirements-runtime version header")
          requirements_path.write_text(
              requirements_text.replace(old_header, new_header, 1),
              encoding="utf-8",
          )
          PY
          rm .github/workflows/release-v0.11.3-prep.yml
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install verified uv
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/dwd-uv"
          python tools/fetch_verified_artifact.py uv-linux-x86_64 "$RUNNER_TEMP/uv.tar.gz"
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/dwd-uv" --strip-components=1
          test "$("$RUNNER_TEMP/dwd-uv/uv" --version | awk '{print $1 " " $2}')" = "uv 0.12.4"
          echo "UV_BIN=$RUNNER_TEMP/dwd-uv/uv" >> "$GITHUB_ENV"
      - name: Sync locked Python environment
        run: |
          "$UV_BIN" sync --locked --extra dev
      - name: Install web dependencies
        run: |
          npm ci --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Regenerate OpenAPI release metadata
        run: |
          "$UV_BIN" run python tools/generate_openapi.py
      - name: Verify release version
        run: |
          "$UV_BIN" run python -c "import droid_web_display; assert droid_web_display.__version__ == '0.11.3'"
      - name: Run targeted update-check tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$UV_BIN" run pytest -q tests/desktop/test_update_check.py tests/desktop/test_layout_regression.py tests/security/test_version_metadata.py
      - name: Run full release gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$UV_BIN" run python tools/release_gate.py --require-web-client-build --output /tmp/v0.11.3-release-gate.json
      - name: Commit validated release metadata
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml uv.lock droid_web_display/__init__.py requirements-runtime.txt packages/bridge-api/openapi/openapi-v1.json .github/workflows/release-v0.11.3-prep.yml
          git commit -m "Prepare v0.11.3 release"
          git push origin HEAD:release/v0.11.3-prep
