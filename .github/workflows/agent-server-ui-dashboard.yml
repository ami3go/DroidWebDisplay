name: Apply server UI dashboard

on:
  push:
    branches:
      - agent/server-ui-dashboard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Recover and apply patcher
        shell: bash
        run: |
          git show d3a0b42384ca1671b067b0b406d668a38459ff0c:.github/workflows/agent-server-ui-dashboard.yml > /tmp/original-helper.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/original-helper.yml').read_text(encoding='utf-8').splitlines()
          start_marker = "          python - <<'PY'"
          end_marker = "          PY"
          start = source.index(start_marker) + 1
          end = source.index(end_marker, start)
          script_lines = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script_lines) + '\n'

          exact = 'gui = replace_once(gui, old_apply, new_apply, "snapshot dashboard")'
          resilient = '''gui, count = re.subn(
              r"    def _apply_snapshot\\(self, snapshot: ServerSnapshot\\) -> None:\\n.*?(?=        running = snapshot.state)",
              new_apply,
              gui,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"snapshot dashboard replacement count={count}")'''
          if exact not in script:
              raise SystemExit('snapshot replacement anchor missing from recovered patcher')
          script = script.replace(exact, resilient, 1)

          failure = 'raise SystemExit(f"{label}: expected exactly one match, got {text.count(old)}")'
          tolerant = '''if label in {"dashboard theme", "timeline theme"}:
                      return text
                  raise SystemExit(f"{label}: expected exactly one match, got {text.count(old)}")'''
          if failure not in script:
              raise SystemExit('replace_once failure anchor missing')
          script = script.replace(failure, tolerant, 1)

          script += r'''
          theme_path = Path("droid_web_display/desktop/theme.py")
          theme = theme_path.read_text(encoding="utf-8")
          if "QLabel#dashboardValue" not in theme:
              dashboard_css = r'''
          QFrame#card[dashboardCard="true"] {{
              background-color: {c['surface_alt']};
          }}

          QLabel#dashboardValue {{
              color: {c['text']};
              font-size: 15pt;
              font-weight: 700;
          }}

          QLabel#dashboardDetail {{
              color: {c['text_muted']};
              font-size: 9pt;
          }}

          QPushButton#deviceLink {{
              min-height: 22px;
              padding: 0;
              border: 0;
              background: transparent;
              color: {c['focus']};
              font-size: 15pt;
              font-weight: 700;
              text-align: left;
          }}

          QPushButton#deviceLink:hover {{
              color: {c['text']};
              background: transparent;
          }}

          '''
              marker = "QLabel#healthStatus {{"
              if marker not in theme:
                  raise SystemExit("health theme insertion anchor missing")
              theme = theme.replace(marker, dashboard_css + marker, 1)
          if "QPlainTextEdit#timelineView {{" not in theme:
              timeline_css = r'''
          QPlainTextEdit#timelineView {{
              min-height: 118px;
              padding: 9px;
              font-family: "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
              font-size: 9pt;
          }}

          '''
              marker = "QMenu {{"
              if marker not in theme:
                  raise SystemExit("menu theme insertion anchor missing")
              theme = theme.replace(marker, timeline_css + marker, 1)
          theme_path.write_text(theme, encoding="utf-8")
          '''
          Path('/tmp/apply_server_ui.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_server_ui.py
      - name: Remove helper workflow from product commit
        run: rm .github/workflows/agent-server-ui-dashboard.yml
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install verified uv
        run: |
          python tools/fetch_verified_artifact.py uv-linux-x86_64 .tools/uv.tar.gz
          mkdir -p .tools/uv
          tar -xzf .tools/uv.tar.gz -C .tools/uv --strip-components=1
      - name: Sync locked Python environment
        run: .tools/uv/uv sync --locked --extra dev
      - name: Install web dependencies
        run: |
          npm ci --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Run targeted desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .tools/uv/uv run pytest -q tests/desktop/test_gui.py tests/desktop/test_layout_regression.py tests/desktop/test_monitoring.py tests/desktop/test_settings_backup.py tests/desktop/test_support.py tests/desktop/test_controller.py
      - name: Run full release gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: .tools/uv/uv run python tools/release_gate.py --require-web-client-build --output /tmp/server-ui-release-gate.json
      - name: Commit validated product changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand desktop server dashboard and monitoring"
          git push origin HEAD:agent/server-ui-dashboard
