name: Add Control Path Debug Log v2

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  add-control-debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json

      - name: Apply debug instrumentation and corrected source-contract tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/add-control-debug-log.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'add-control-debug-log.py', 'exec'))

          path = Path('apps/web-client/tests/layout.test.mjs')
          text = path.read_text(encoding='utf-8')

          old = '''  const start = controllerSource.indexOf("private activateRuntime");\n  const end = controllerSource.indexOf("private async refreshSessionCapacity", start);\n  assert.ok(start >= 0 && end > start);\n  const body = controllerSource.slice(start, end);\n'''
          new = '''  const start = controllerSource.indexOf("private activateRuntime");\n  const end = controllerSource.indexOf("private bindControlDebug", start);\n  assert.ok(start >= 0 && end > start);\n  const body = controllerSource.slice(start, end);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Phase 5 activateRuntime test boundary, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''  assert.match(controllerSource, /canvas\\.addEventListener\\("focus", \\(\\) => this\\.renderDisplayDiagnostics\\(true\\)\\)/);\n  assert.match(controllerSource, /canvas\\.addEventListener\\("blur", \\(\\) => this\\.renderDisplayDiagnostics\\(true\\)\\)/);\n'''
          new = '''  assert.match(controllerSource, /canvas\\.addEventListener\\("focus", \\(\\) => \\{[\\s\\S]{0,300}controlDebug\\("focus", "canvas-focus"[\\s\\S]{0,300}renderDisplayDiagnostics\\(true\\)/);\n  assert.match(controllerSource, /canvas\\.addEventListener\\("blur", \\(\\) => \\{[\\s\\S]{0,500}controlDebug\\("focus", "canvas-blur"[\\s\\S]{0,500}renderDisplayDiagnostics\\(true\\)/);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy focus-listener assertion pair, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - run: npm ci
        working-directory: apps/web-client
      - name: Build web client
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Run web client tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Commit control-path debug instrumentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web-client/src/control-debug.ts \
            apps/web-client/src/websocket-transport.ts \
            apps/web-client/src/controller.ts \
            apps/web-client/src/main.ts \
            apps/web-client/static/index.html \
            apps/web-client/static/styles.css \
            apps/web-client/tests/layout.test.mjs \
            apps/web-client/dist-manifest.json
          git add -f apps/web-client/dist
          if git diff --cached --quiet; then
            echo "No control debug changes to commit"
            exit 0
          fi
          git commit -m "Add downloadable multi-display control path diagnostics"
          git push origin HEAD:multi-display-tabs
