name: DroidWebDisplay Release Gate

on:
  push:
    branches: [main, agent/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: 6.21.0

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install verified uv
        shell: bash
        run: |
          set -euxo pipefail
          python tools/fetch_verified_artifact.py uv-linux-x86_64 .tools/uv.tar.gz
          mkdir -p .tools/uv
          tar -xzf .tools/uv.tar.gz -C .tools/uv --strip-components=1
          test "$(.tools/uv/uv --version | awk '{print $1 " " $2}')" = "uv 0.12.4"
      - name: Sync locked Python environment
        run: .tools/uv/uv sync --locked --extra dev
      - working-directory: packages/scrcpy-protocol
        run: npm ci
      - working-directory: apps/web-client
        run: npm ci
      - name: Run release gate
        run: .tools/uv/uv run python tools/release_gate.py --require-web-client-build --output /tmp/release-gate.json
      - name: Generate build SBOM and license inventory
        run: .tools/uv/uv run python tools/generate_sbom.py --output-dir evidence/supply-chain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: evidence/supply-chain/*
          if-no-files-found: error

  windows-package-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check . "pyinstaller==$env:PYINSTALLER_VERSION"
      - name: Download verified scrcpy server
        run: python tools/download_server.py
      - name: Download verified Android platform-tools
        shell: pwsh
        run: |
          python tools/fetch_verified_artifact.py android-platform-tools-windows platform-tools.zip
          Expand-Archive -Path platform-tools.zip -DestinationPath platform-tools
          $adb = (Resolve-Path "platform-tools/platform-tools").Path
          "DWD_ADB_DIR=$adb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/DroidWebDisplay.spec
      - name: Smoke-test Windows executable CLI
        shell: pwsh
        run: |
          & .\dist\DroidWebDisplay.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test Windows executable service
        run: python tools/smoke_desktop_package.py .\dist\DroidWebDisplay.exe --timeout 60
      - name: Smoke-test Windows Authenticode signing helper
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signedCopy = Join-Path $env:RUNNER_TEMP "DroidWebDisplay-signing-smoke.exe"
          $certificateFile = Join-Path $env:RUNNER_TEMP "DroidWebDisplay-signing-smoke.cer"
          $checksumManifest = Join-Path $env:RUNNER_TEMP "SHA256SUMS-signing-smoke.txt"
          Copy-Item .\dist\DroidWebDisplay.exe $signedCopy

          Write-Host "Creating disposable CI code-signing certificate."
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=DroidWebDisplay CI Signing Smoke" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddDays(1)
          Write-Host "Exporting and trusting disposable CI certificate."
          Export-Certificate -Cert $certificate -FilePath $certificateFile -Force | Out-Null
          Import-Certificate -FilePath $certificateFile -CertStoreLocation "Cert:\CurrentUser\Root" -Confirm:$false | Out-Null
          Import-Certificate -FilePath $certificateFile -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" -Confirm:$false | Out-Null

          try {
            Write-Host "Invoking signing helper on disposable EXE copy."
            .\tools\sign_windows_release.ps1 `
              -File $signedCopy `
              -CertificateThumbprint $certificate.Thumbprint `
              -SkipTimestamp `
              -ChecksumManifest $checksumManifest
            Write-Host "Invoking verification-only path."
            .\tools\sign_windows_release.ps1 -File $signedCopy -VerifyOnly

            $expectedHash = (Get-FileHash -LiteralPath $signedCopy -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedLine = "$expectedHash  DroidWebDisplay-signing-smoke.exe"
            $manifestLines = @(Get-Content -LiteralPath $checksumManifest)
            if ($manifestLines.Count -ne 1 -or $manifestLines[0] -ne $expectedLine) {
              throw "Signing smoke checksum manifest did not match the signed disposable copy."
            }
            Write-Host "Disposable signing smoke completed successfully."
          }
          finally {
            Write-Host "Cleaning disposable signing material."
            Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\Root\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\TrustedPublisher\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item $signedCopy, $certificateFile, $checksumManifest -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-smoke
          path: dist/DroidWebDisplay.exe
          if-no-files-found: error

  linux-appimage-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check . "pyinstaller==$PYINSTALLER_VERSION"
      - name: Download verified scrcpy server
        run: python tools/download_server.py
      - name: Download verified Android platform-tools
        shell: bash
        run: |
          set -euxo pipefail
          python tools/fetch_verified_artifact.py android-platform-tools-linux platform-tools.zip
          unzip -q platform-tools.zip -d platform-tools
          echo "DWD_ADB_DIR=$PWD/platform-tools/platform-tools" >> "$GITHUB_ENV"
      - name: Build Linux frozen runtime
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/DroidWebDisplay.spec
      - name: Smoke-test frozen runtime CLI
        run: ./dist/DroidWebDisplay/DroidWebDisplay --help
      - name: Build AppImage with verified toolchain
        shell: bash
        run: |
          set -euxo pipefail
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/lib/droidwebdisplay"
          cp -a dist/DroidWebDisplay/. "$APPDIR/usr/lib/droidwebdisplay/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/usr/bin/env sh
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$HERE/usr/lib/droidwebdisplay/DroidWebDisplay" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/droidwebdisplay.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DroidWebDisplay
          Comment=Open the local DroidWebDisplay browser interface
          Exec=DroidWebDisplay
          Icon=droidwebdisplay
          Terminal=false
          Categories=Development;Utility;
          EOF
          cp packaging/linux/droidwebdisplay.svg "$APPDIR/droidwebdisplay.svg"
          ln -s droidwebdisplay.svg "$APPDIR/.DirIcon"

          python tools/fetch_verified_artifact.py appimagetool-linux-x86_64 appimagetool-x86_64.AppImage
          python tools/fetch_verified_artifact.py appimage-runtime-linux-x86_64 runtime-x86_64
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p release
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            --runtime-file "$PWD/runtime-x86_64" \
            "$APPDIR" \
            "release/DroidWebDisplay-ci-linux-x86_64.AppImage"
          chmod +x release/DroidWebDisplay-ci-linux-x86_64.AppImage
      - name: Smoke-test AppImage CLI
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --help
      - name: Smoke-test AppImage service
        run: python tools/smoke_desktop_package.py ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --appimage-extract-and-run --timeout 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-appimage-smoke
          path: release/DroidWebDisplay-ci-linux-x86_64.AppImage
          if-no-files-found: error
