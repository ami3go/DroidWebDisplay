name: Apply audited web UI optimizations

on:
  push:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message == 'Continue UI optimization after drawer tests'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify phase one
        run: |
          npm run build --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-1-verified.json
      - name: Phase 2 - harden asynchronous UI refreshes
        run: |
          python tools/_ui_refactor_builder.py 2
          npm run build --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-2.json
          git add apps/web-client
          git commit -m "Harden asynchronous UI refreshes"
      - name: Phase 3 - optimize File Explorer selection rendering
        run: |
          python tools/_ui_refactor_builder.py 3
          npm run build --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-3.json
          git add apps/web-client
          git commit -m "Optimize File Explorer selection rendering"
      - name: Phase 4 - reduce idle browser polling
        run: |
          python tools/_ui_refactor_builder.py 4
          npm run build --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-4.json
          git add apps/web-client
          git commit -m "Reduce idle browser polling"
      - name: Push optimized commit stack
        run: git push origin HEAD:agent/web-ui-refactor-builder
