name: Apply Explorer consolidation
on:
  push:
    branches: [agent/connect-drawer]
    paths: [.github/workflows/ci.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable_main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch helper scripts
        run: |
          git show origin/agent/connect-drawer:.github/scripts/apply_explorer_consolidation.py > /tmp/apply_explorer_consolidation.py
          git show origin/agent/connect-drawer:.github/scripts/update_explorer_tests.py > /tmp/update_explorer_tests.py
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm run build --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Apply Explorer consolidation
        run: |
          python /tmp/apply_explorer_consolidation.py
          python /tmp/update_explorer_tests.py
          $HOME/.local/bin/uv run python tools/generate_openapi.py
      - name: Build and verify
        run: |
          npm run build --prefix apps/web-client
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run pytest tests/regression/transfers/test_api.py tests/regression/transfers/test_transfer_manager.py tests/regression/transfers/test_explorer_ui.py -q
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output /tmp/gate.json
      - name: Commit verified Explorer consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web-client droid_web_display tests tools/release_gate.py packages/bridge-api/openapi/openapi-v1.json
          git commit -m "Consolidate uploads into File Explorer"
          git push origin HEAD:stable_main
