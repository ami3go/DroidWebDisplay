name: Apply audited web UI optimizations

on:
  push:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message == 'Run audited web UI optimizations'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: packages/scrcpy-protocol
      - run: npm ci
        working-directory: apps/web-client
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Phase 1 - remove legacy drawer boot transforms
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/web-client')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          html_path = root / 'static/index.html'
          html = html_path.read_text(encoding='utf-8')
          html = replace_once(
              html,
              '        <select id="device" aria-label="Android device"></select>\n        <button id="connect" class="compact">Connect</button>\n',
              '',
              'remove topbar connection controls',
          )
          html = replace_once(
              html,
              '        <button type="button" class="gb-rail-button" data-group="files" aria-selected="false" title="Files"><span class="gb-rail-icon" aria-hidden="true"></span><span class="gb-rail-label">Files</span></button>\n        <button type="button" class="gb-rail-button" data-group="clipboard" aria-selected="false" title="Clipboard"><span class="gb-rail-icon" aria-hidden="true"></span><span class="gb-rail-label">Clipboard</span></button>\n        <button type="button" class="gb-rail-button" data-group="display" aria-selected="false" title="Display"><span class="gb-rail-icon" aria-hidden="true"></span><span class="gb-rail-label">Display</span></button>\n',
              '        <button type="button" class="gb-rail-button" data-group="display" aria-selected="false" title="Display"><span class="gb-rail-icon" aria-hidden="true"></span><span class="gb-rail-label">Display</span></button>\n        <button type="button" class="gb-rail-button" data-group="clipboard" aria-selected="false" title="Clipboard"><span class="gb-rail-icon" aria-hidden="true"></span><span class="gb-rail-label">Clipboard</span></button>\n        <button type="button" class="gb-rail-button" data-group="files" aria-selected="false" title="Files"><span class="gb-rail-icon" aria-hidden="true"></span><span class="gb-rail-label">Files</span></button>\n',
              'make final rail order static',
          )
          html = replace_once(
              html,
              '          <div class="gb-drawer-slot" data-slot="display"><section class="help-card display-mode-card">',
              '''          <div class="gb-drawer-slot" data-slot="display"><section class="help-card connect-card" aria-label="Android device connection">
          <label>Android device
            <select id="device" aria-label="Android device"></select>
          </label>
          <div class="button-grid connect-actions">
            <button id="connect" class="compact">Connect</button>
          </div>
        </section>
        <section class="help-card display-mode-card">''',
              'place connection card directly in Display drawer',
          )
          html = replace_once(
              html,
              '''  <p id="auth-security-status" class="running-app-status">Session protection active.</p>
</section></div>
          <div class="gb-drawer-slot" data-slot="network"><section id="network-card" class="help-card network-access-card" hidden aria-label="Network access settings">''',
              '''  <p id="auth-security-status" class="running-app-status">Session protection active.</p>
  <details class="gb-accordion" data-section-key="access-network">
    <summary class="gb-accordion-summary"><span class="gb-accordion-triangle" aria-hidden="true">▸</span><span class="gb-accordion-label">Network access</span></summary>
    <div class="gb-accordion-content"><section id="network-card" class="help-card network-access-card" hidden aria-label="Network access settings">''',
              'merge Network into Access',
          )
          html = replace_once(
              html,
              '''          <p class="network-recovery-note">Recovery: <code>python tools\\reset_network_access.py --local-only</code></p>
        </section></div>
          <div class="gb-drawer-slot" data-slot="diagnostics">''',
              '''          <p class="network-recovery-note">Recovery: <code>python tools\\reset_network_access.py --local-only</code></p>
        </section></div>
  </details>
</section></div>
          <div class="gb-drawer-slot" data-slot="diagnostics">''',
              'close merged Access network accordion',
          )
          html_path.write_text(html, encoding='utf-8')

          drawer_path = root / 'static/droidwebdisplay-main-drawer.js'
          drawer = drawer_path.read_text(encoding='utf-8')
          drawer = replace_once(drawer, "  const CONNECTION_STYLE_ID = 'droidwebdisplay-connect-drawer-css';\n", '', 'remove legacy connection style id')
          start = drawer.index('  function ensureConnectionStyles()')
          end = drawer.index('  function applyPinned(', start)
          drawer = drawer[:start] + drawer[end:]
          for call in (
              '    ensureConnectionStyles();\n',
              '    removeLegacyHeaderText();\n',
              '    ensureDisplayConnectionUi();\n',
              '    mergeNetworkIntoAccess();\n',
              '    applyRailOrder();\n',
          ):
              drawer = replace_once(drawer, call, '', f'remove boot call {call.strip()}')
          drawer_path.write_text(drawer, encoding='utf-8')

          main_css_path = root / 'static/droidwebdisplay-main-drawer.css'
          connect_css_path = root / 'static/droidwebdisplay-connect-drawer.css'
          main_css = main_css_path.read_text(encoding='utf-8').rstrip()
          connect_css = connect_css_path.read_text(encoding='utf-8').strip()
          if 'Compact connection controls at the top of the Display drawer.' not in main_css:
              main_css += '\n\n/* Display drawer connection controls. */\n' + connect_css + '\n'
          main_css_path.write_text(main_css, encoding='utf-8')
          connect_css_path.unlink()

          test_path = root / 'tests/layout.test.mjs'
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              'const runningAppSource = await readFile(resolve(root, "src/running-app-controller.ts"), "utf8");\n',
              'const runningAppSource = await readFile(resolve(root, "src/running-app-controller.ts"), "utf8");\nconst drawerSource = await readFile(resolve(root, "static/droidwebdisplay-main-drawer.js"), "utf8");\n',
              'load drawer source in layout tests',
          )
          old_start = tests.index('test("compact header keeps device and Android controls beside the title"')
          old_end = tests.index('test("optional LAN access is explicit, authenticated and recoverable"', old_start)
          replacement = '''test("compact header keeps Android controls while connection controls live directly in Display", () => {
  const headerStart = html.indexOf('<header class="topbar">');
  const headerEnd = html.indexOf('</header>', headerStart);
  const header = html.slice(headerStart, headerEnd);
  for (const id of ["back", "home", "recent", "rotate", "power", "fullscreen"]) {
    assert.match(header, new RegExp(`id="${id}"`));
  }
  assert.equal(header.includes('id="device"'), false);
  assert.equal(header.includes('id="connect"'), false);
  const displayStart = html.indexOf('data-slot="display"');
  const audioStart = html.indexOf('data-slot="audio"', displayStart);
  const display = html.slice(displayStart, audioStart);
  assert.match(display, /id="device"/);
  assert.match(display, /id="connect"/);
  assert.match(header, /class="topbar-brand"/);
  assert.match(header, /class="android-control-row"/);
  assert.match(css, /\\.topbar \\{ display: flex; align-items: center;/);
  assert.match(controllerSource, /DEVICE_DROPDOWN_REFRESH_STALE_MS/);
  assert.match(controllerSource, /device\\.addEventListener\\(\\"pointerdown\\"/);
  assert.equal(html.includes('id="refresh"'), false);
  assert.equal(html.includes('id="disconnect"'), false);
  assert.match(controllerSource, /connect\\.textContent = connected \\? \\"Disconnect\\" : \\"Connect\\"/);
});

test("single drawer ships final structure without legacy runtime migration", () => {
  assert.equal(html.includes('data-slot="network"'), false);
  const accessStart = html.indexOf('data-slot="access"');
  const diagnosticsStart = html.indexOf('data-slot="diagnostics"', accessStart);
  const access = html.slice(accessStart, diagnosticsStart);
  assert.match(access, /data-section-key="access-network"/);
  assert.match(access, /id="network-card"/);
  assert.doesNotMatch(drawerSource, /ensureConnectionStyles|ensureDisplayConnectionUi|mergeNetworkIntoAccess|applyRailOrder|removeLegacyHeaderText/);
});

'''
          tests = tests[:old_start] + replacement + tests[old_end:]
          test_path.write_text(tests, encoding='utf-8')
          PY
          npm run build --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-1.json
          git add apps/web-client
          git commit -m "Remove legacy drawer boot transforms"

      - name: Phase 2 - harden asynchronous UI refreshes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          root = Path('apps/web-client/src')
          controller = root / 'controller.ts'
          replace_once(controller, '  #capabilities: VirtualDisplayCapabilities | null = null;\n', '  #capabilities: VirtualDisplayCapabilities | null = null;\n  #capabilityRequestGeneration = 0;\n', 'controller capability generation field')
          replace_once(controller, '  private async refreshVirtualCapabilities(): Promise<void> {\n    const serial = this.elements.device.value;\n', '  private async refreshVirtualCapabilities(): Promise<void> {\n    const generation = ++this.#capabilityRequestGeneration;\n    const serial = this.elements.device.value;\n', 'start capability generation')
          replace_once(controller, '      ]);\n      this.#capabilities = capabilities;\n', '      ]);\n      if (generation !== this.#capabilityRequestGeneration || this.elements.device.value !== serial) return;\n      this.#capabilities = capabilities;\n', 'discard stale capability result')
          replace_once(controller, '    } catch (error) {\n      this.#capabilities = null;\n      this.elements.capability.textContent = `Capability probe failed: ${errorMessage(error)}. Physical Screen mode remains available.`;\n', '    } catch (error) {\n      if (generation !== this.#capabilityRequestGeneration || this.elements.device.value !== serial) return;\n      this.#capabilities = null;\n      this.elements.capability.textContent = `Capability probe failed: ${errorMessage(error)}. Physical Screen mode remains available.`;\n', 'discard stale capability error')

          transfer = root / 'transfer-controller.ts'
          replace_once(transfer, '  #lastBrowseAt = 0;\n', '  #lastBrowseAt = 0;\n  #browseGeneration = 0;\n  #refreshTransfersBusy = false;\n', 'transfer request guards')
          replace_once(transfer, '  private async browse(path = this.elements.storagePath.value || "/sdcard/Download"): Promise<void> {\n    const serial = this.elements.device.value;\n', '  private async browse(path = this.elements.storagePath.value || "/sdcard/Download"): Promise<void> {\n    const generation = ++this.#browseGeneration;\n    const serial = this.elements.device.value;\n', 'start browse generation')
          replace_once(transfer, '    const result = await this.#api.androidStorage(serial, path);\n    this.elements.storagePath.value = result.path;\n', '    const result = await this.#api.androidStorage(serial, path);\n    if (generation !== this.#browseGeneration || this.elements.device.value !== serial) return;\n    this.elements.storagePath.value = result.path;\n', 'discard stale browse result')
          replace_once(transfer, '''  private async refreshTransfers(): Promise<void> {
    try {
      const response = await this.#api.transfers();
      this.#lastTransfers = response.transfers;
      this.renderTransfers(response.transfers);
    } catch (error) {
      this.setStatus(errorMessage(error), true);
    }
  }
''', '''  private async refreshTransfers(): Promise<void> {
    if (this.#refreshTransfersBusy) return;
    this.#refreshTransfersBusy = true;
    try {
      const response = await this.#api.transfers();
      this.#lastTransfers = response.transfers;
      this.renderTransfers(response.transfers);
    } catch (error) {
      this.setStatus(errorMessage(error), true);
    } finally {
      this.#refreshTransfersBusy = false;
    }
  }
''', 'guard transfer polling overlap')

          auto = root / 'auto-download-controller.ts'
          replace_once(auto, '  #snapshot: AutoDownloadSnapshotDto | null = null;\n', '  #snapshot: AutoDownloadSnapshotDto | null = null;\n  #refreshing = false;\n', 'auto-download refresh guard field')
          replace_once(auto, '''  private async refresh(): Promise<void> {
    try {
      this.applySnapshot(await this.#api.autoDownload());
    } catch (error) {
      this.elements.status.textContent = "Unavailable";
      this.elements.summary.textContent = errorMessage(error);
      this.elements.summary.classList.add("error-text");
    }
  }
''', '''  private async refresh(): Promise<void> {
    if (this.#refreshing) return;
