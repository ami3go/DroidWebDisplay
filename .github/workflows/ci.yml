              text = text.replace(old, new, 1)

          replace_once('      this.renderStorage(this.#currentEntries);\n    });\n    this.elements.downloadSelected.addEventListener', '      this.updateSelectionUi();\n    });\n    this.elements.downloadSelected.addEventListener', 'select-all incremental update')
          replace_once('    this.#lastSelectedIndex = index;\n    this.renderStorage(this.#currentEntries);\n', '    this.#lastSelectedIndex = index;\n    this.updateSelectionUi();\n', 'row selection incremental update')
          replace_once('      this.#selectedDownloads.add(entry.path);\n      this.renderStorage(this.#currentEntries);\n', '      this.#selectedDownloads.add(entry.path);\n      this.updateSelectionUi();\n', 'context selection incremental update')
          replace_once('    if (selected) this.#selectedDownloads.add(path);\n    else this.#selectedDownloads.delete(path);\n    this.renderStorage(this.#currentEntries);\n', '    if (selected) this.#selectedDownloads.add(path);\n    else this.#selectedDownloads.delete(path);\n    this.updateSelectionUi();\n', 'checkbox incremental update')
          replace_once('    this.#selectedDownloads.clear();\n    this.#lastSelectedIndex = null;\n    this.renderStorage(this.#currentEntries);\n  }\n\n  private updateSelectionControls', '    this.#selectedDownloads.clear();\n    this.#lastSelectedIndex = null;\n    this.updateSelectionUi();\n  }\n\n  private updateSelectionUi(): void {\n    for (const row of this.elements.storageBody.querySelectorAll<HTMLElement>(".explorer-row[data-path]")) {\n      const path = row.dataset.path ?? "";\n      const selected = this.#selectedDownloads.has(path);\n      row.classList.toggle("selected", selected);\n      row.setAttribute("aria-selected", String(selected));\n      const checkbox = row.querySelector<HTMLInputElement>(".storage-select");\n      if (checkbox) checkbox.checked = selected;\n    }\n    this.updateSelectionControls();\n  }\n\n  private updateSelectionControls', 'add incremental selection renderer')
          replace_once('    this.#selectedDownloads.clear();\n    this.renderStorage(this.#currentEntries);\n    this.setStatus(`Queued ${selected.length} download(s)`);\n', '    this.#selectedDownloads.clear();\n    this.#lastSelectedIndex = null;\n    this.updateSelectionUi();\n    this.setStatus(`Queued ${selected.length} download(s)`);\n', 'download selection incremental update')
          path.write_text(text, encoding='utf-8')

