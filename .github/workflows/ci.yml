name: DroidWebDisplay Release Gate

on:
  push:
    branches: [main, agent/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: 6.21.0

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install verified uv
        shell: bash
        run: |
          set -euxo pipefail
          python tools/fetch_verified_artifact.py uv-linux-x86_64 .tools/uv.tar.gz
          mkdir -p .tools/uv
          tar -xzf .tools/uv.tar.gz -C .tools/uv --strip-components=1
          test "$(.tools/uv/uv --version | awk '{print $1 " " $2}')" = "uv 0.12.4"
      - name: Sync locked Python environment
        run: .tools/uv/uv sync --locked --extra dev
      - name: Lint Python
        run: .tools/uv/uv run ruff check droid_web_display tools tests
      - name: Run high-risk behavioral regressions
        run: |
          .tools/uv/uv run pytest -q \
            tests/security \
            tests/regression/transfers \
            tests/regression/test_clipboard_copy_server_mode.py
      - working-directory: packages/scrcpy-protocol
        run: npm ci
      - working-directory: apps/web-client
        run: npm ci
      - name: Run release gate
        run: .tools/uv/uv run python tools/release_gate.py --require-web-client-build --output /tmp/release-gate.json
      - name: Generate build SBOM and license inventory
        run: .tools/uv/uv run python tools/generate_sbom.py --output-dir evidence/supply-chain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: evidence/supply-chain/*
          if-no-files-found: error

  windows-package-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check . "pyinstaller==$env:PYINSTALLER_VERSION"
      - name: Download verified scrcpy server
        run: python tools/download_server.py
      - name: Download verified Android platform-tools
        shell: pwsh
        run: |
          python tools/fetch_verified_artifact.py android-platform-tools-windows platform-tools.zip
          Expand-Archive -Path platform-tools.zip -DestinationPath platform-tools
          $adb = (Resolve-Path "platform-tools/platform-tools").Path
          "DWD_ADB_DIR=$adb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/DroidWebDisplay.spec
      - name: Smoke-test Windows desktop host
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\DroidWebDisplay.exe" -ArgumentList "--desktop-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Smoke-test Windows executable CLI
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\DroidWebDisplay.exe" -ArgumentList "--help" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Smoke-test Windows executable service
        run: python tools/smoke_desktop_package.py .\dist\DroidWebDisplay.exe --timeout 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-smoke
          path: dist/DroidWebDisplay.exe
          if-no-files-found: error

  linux-appimage-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check . "pyinstaller==$PYINSTALLER_VERSION"
      - name: Download verified scrcpy server
        run: python tools/download_server.py
      - name: Download verified Android platform-tools
        shell: bash
        run: |
          set -euxo pipefail
          python tools/fetch_verified_artifact.py android-platform-tools-linux platform-tools.zip
          unzip -q platform-tools.zip -d platform-tools
          echo "DWD_ADB_DIR=$PWD/platform-tools/platform-tools" >> "$GITHUB_ENV"
      - name: Build Linux frozen runtime
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/DroidWebDisplay.spec
      - name: Smoke-test Linux desktop host
        run: QT_QPA_PLATFORM=offscreen ./dist/DroidWebDisplay/DroidWebDisplay --desktop-smoke
      - name: Smoke-test frozen runtime CLI
        run: ./dist/DroidWebDisplay/DroidWebDisplay --help
      - name: Build AppImage with verified toolchain
        shell: bash
        run: |
          set -euxo pipefail
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/lib/droidwebdisplay"
          cp -a dist/DroidWebDisplay/. "$APPDIR/usr/lib/droidwebdisplay/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/usr/bin/env sh
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$HERE/usr/lib/droidwebdisplay/DroidWebDisplay" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/droidwebdisplay.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DroidWebDisplay
          Comment=Open the local DroidWebDisplay browser interface
          Exec=DroidWebDisplay
          Icon=droidwebdisplay
          Terminal=false
          Categories=Development;Utility;
          EOF
          cp packaging/linux/droidwebdisplay.svg "$APPDIR/droidwebdisplay.svg"
          ln -s droidwebdisplay.svg "$APPDIR/.DirIcon"

          python tools/fetch_verified_artifact.py appimagetool-linux-x86_64 appimagetool-x86_64.AppImage
          python tools/fetch_verified_artifact.py appimage-runtime-linux-x86_64 runtime-x86_64
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p release
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            --runtime-file "$PWD/runtime-x86_64" \
            "$APPDIR" \
            "release/DroidWebDisplay-ci-linux-x86_64.AppImage"
          chmod +x release/DroidWebDisplay-ci-linux-x86_64.AppImage
      - name: Smoke-test AppImage desktop host
        run: QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --desktop-smoke
      - name: Smoke-test AppImage CLI
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --help
      - name: Smoke-test AppImage service
        run: python tools/smoke_desktop_package.py ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --appimage-extract-and-run --timeout 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-appimage-smoke
          path: release/DroidWebDisplay-ci-linux-x86_64.AppImage
          if-no-files-found: error
