name: Diagnose audited web UI optimization

on:
  push:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Capture verified phase one gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Capture gate evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run build --prefix apps/web-client
          set +e
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-1-verified.json > evidence/release/gate-ui-refactor-1-verified.log 2>&1
          rc=$?
          set -e
          git add apps/web-client
          git add -f evidence/release/gate-ui-refactor-1-verified.json evidence/release/gate-ui-refactor-1-verified.log
          git commit -m "Capture verified phase one evidence"
          git push origin HEAD:agent/web-ui-refactor-builder
          exit $rc
