name: Apply follow-up web UI optimizations

on:
  push:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message == 'Run follow-up UI optimizations'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Phase 5 - delegate File Explorer row events
        run: |
          python tools/_ui_refactor_followup.py 5
          npm run build --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-5.json
          git add apps/web-client
          git commit -m "Delegate File Explorer row events"
      - name: Phase 6 - finalize UI polling lifecycle
        run: |
          python tools/_ui_refactor_followup.py 6
          npm run build --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-ui-refactor-6.json
          git add apps/web-client
          git commit -m "Finalize UI polling lifecycle"
      - name: Push optimized commit stack
        run: git push origin HEAD:agent/web-ui-refactor-builder
