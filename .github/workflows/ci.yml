name: Apply Clipboard UI optimization
on:
  push:
    branches: [agent/connect-drawer]
    paths: [.github/workflows/ci.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/fix-running-app-always-move, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm run build --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web-client/static/index.html'); s=p.read_text()
          s=s.replace('<div class="help-card clipboard-card">','<div id="clipboard-card" class="help-card clipboard-card">',1)
          s=s.replace('id="clipboard" aria-label=','id="clipboard" class="clipboard-sync-fallback" aria-label=',1)
          s=s.replace('id="clipboard-copy-android" class="secondary"','id="clipboard-copy-android" class="secondary clipboard-sync-fallback"',1)
          s=s.replace('Clipboard text is never written to diagnostics.','In this drawer, Ctrl+Enter types the text box into Android. Clipboard text is never written to diagnostics.',1)
          p.write_text(s)
          p=Path('apps/web-client/src/controller.ts'); s=p.read_text()
          a='    this.elements.clipboardTextPaste.addEventListener("click", () => void this.runUiAction(() => this.pasteTypedText()));'
          b=a+'\n    this.elements.clipboardText.addEventListener("keydown", (event) => { if ((event.ctrlKey || event.metaKey) && event.key === "Enter") { event.preventDefault(); void this.runUiAction(() => this.pasteTypedText()); } });\n    document.querySelector<HTMLButtonElement>(\'[data-group="clipboard"]\')?.addEventListener("click", () => window.requestAnimationFrame(() => { if (!this.elements.clipboardText.disabled) this.elements.clipboardText.focus(); }));'
          assert a in s; s=s.replace(a,b,1)
          a='      this.saveBrowserSettings();\n      await this.startClipboardPolling(true);'
          b='      this.saveBrowserSettings();\n      this.updateClipboardUi();\n      await this.startClipboardPolling(true);'
          assert a in s; s=s.replace(a,b,1)
          a='  private populateProfiles(): void {'
          b='  private updateClipboardUi(): void { document.querySelector<HTMLElement>("#clipboard-card")?.classList.toggle("auto-sync-enabled", this.elements.clipboardAutoSync.checked); }\n\n'+a
          assert a in s; s=s.replace(a,b,1)
          s=s.replace('    this.restoreBrowserSettings();\n    await this.refreshDevices();','    this.restoreBrowserSettings();\n    this.updateClipboardUi();\n    await this.refreshDevices();',1)
          p.write_text(s)
          p=Path('apps/web-client/static/styles.css'); s=p.read_text(); a='.clipboard-actions {'; assert a in s
          s=s.replace(a,'.clipboard-card.auto-sync-enabled .clipboard-sync-fallback { opacity: 0.62; filter: saturate(0.65); }\n'+a,1); p.write_text(s)
          p=Path('apps/web-client/tests/layout.test.mjs'); s=p.read_text(); a='test("automatic clipboard sync never triggers Android paste", () => {'
          b='test("Clipboard drawer supports focused Ctrl+Enter Type", () => {\n  assert.match(controllerSource, /clipboardText\.focus\(\)/);\n  assert.match(controllerSource, /updateClipboardUi/);\n  assert.match(html, /id="clipboard-card"/);\n});\n\n'+a
          assert a in s; p.write_text(s.replace(a,b,1))
          PY
          npm run build --prefix apps/web-client
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output /tmp/gate.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web-client
          git commit -m "Optimize Clipboard interactions"
          git push origin HEAD:agent/fix-running-app-always-move
