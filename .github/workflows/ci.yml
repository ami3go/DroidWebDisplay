name: Apply File Explorer control reorder
on:
  push:
    branches: [agent/connect-drawer]
    paths: [.github/workflows/ci.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable_main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm run build --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Reorder Android File Explorer controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web-client/static/index.html')
          s = p.read_text()
          old = '''  <div class="gb-accordion-content"><div class="section-heading">
<span>Double-click to open · Right-click for actions</span>
          </div>
          <div class="explorer-toolbar">
            <button id="storage-up" class="secondary compact explorer-icon-button" title="Parent folder" aria-label="Parent folder">↑</button>
            <nav id="storage-breadcrumbs" class="storage-breadcrumbs" aria-label="Android folder breadcrumbs"></nav>
            <button id="storage-refresh" class="secondary compact explorer-icon-button" title="Refresh" aria-label="Refresh">↻</button>
          </div>
          <label>Storage location
            <select id="storage-root"><option value="/sdcard/Download">Internal storage · Download</option></select>
          </label>
          <input id="storage-path" class="storage-address" value="/sdcard/Download" aria-label="Android folder path" spellcheck="false">
          <div class="explorer-options">
            <label>Destination folder
              <select id="destination-profile"></select>
            </label>
            <div class="two-button-row uniform-buttons"><button id="download-selected" class="secondary" disabled>Download</button><button id="open-pc-folder" class="secondary">Open PC folder</button></div>
          </div>
'''
          new = '''  <div class="gb-accordion-content">
          <div class="explorer-options">
            <label>Destination folder
              <select id="destination-profile"></select>
            </label>
            <div class="two-button-row uniform-buttons"><button id="download-selected" class="secondary" disabled>Download</button><button id="open-pc-folder" class="secondary">Open PC folder</button></div>
          </div>
          <label>Storage location
            <select id="storage-root"><option value="/sdcard/Download">Internal storage · Download</option></select>
          </label>
          <input id="storage-path" class="storage-address" value="/sdcard/Download" aria-label="Android folder path" spellcheck="false">
          <div class="explorer-toolbar">
            <button id="storage-up" class="secondary compact explorer-icon-button" title="Parent folder" aria-label="Parent folder">↑</button>
            <nav id="storage-breadcrumbs" class="storage-breadcrumbs" aria-label="Android folder breadcrumbs"></nav>
            <button id="storage-refresh" class="secondary compact explorer-icon-button" title="Refresh" aria-label="Refresh">↻</button>
          </div>
'''
          if old not in s:
              raise SystemExit('Explorer control block not found')
          p.write_text(s.replace(old, new, 1))

          t = Path('apps/web-client/tests/layout.test.mjs')
          ts = t.read_text()
          test = '''\n\ntest("Android File Explorer prioritizes destination then storage navigation", () => {\n  const destination = html.indexOf('id="destination-profile"');\n  const download = html.indexOf('id="download-selected"');\n  const pcFolder = html.indexOf('id="open-pc-folder"');\n  const storage = html.indexOf('id="storage-root"');\n  const path = html.indexOf('id="storage-path"');\n  const up = html.indexOf('id="storage-up"');\n  const breadcrumbs = html.indexOf('id="storage-breadcrumbs"');\n  const refresh = html.indexOf('id="storage-refresh"');\n  const table = html.indexOf('class="explorer-frame"');\n  assert.ok(destination < download && download < pcFolder);\n  assert.ok(pcFolder < storage && storage < path);\n  assert.ok(path < up && up < breadcrumbs && breadcrumbs < refresh);\n  assert.ok(refresh < table);\n});\n'''
          if 'Android File Explorer prioritizes destination then storage navigation' not in ts:
              t.write_text(ts + test)
          PY
          npm run build --prefix apps/web-client
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output /tmp/gate.json
      - name: Commit verified UI reorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web-client
          git commit -m "Reorder Android File Explorer controls"
          git push origin HEAD:stable_main
