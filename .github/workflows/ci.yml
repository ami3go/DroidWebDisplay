name: DroidWebDisplay Release Gate

on:
  push:
    branches: [main, agent/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: 6.21.0

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install verified uv
        shell: bash
        run: |
          set -euxo pipefail
          python tools/fetch_verified_artifact.py uv-linux-x86_64 .tools/uv.tar.gz
          mkdir -p .tools/uv
          tar -xzf .tools/uv.tar.gz -C .tools/uv --strip-components=1
          test "$(.tools/uv/uv --version | awk '{print $1 " " $2}')" = "uv 0.12.4"
      - name: Sync locked Python environment
        run: .tools/uv/uv sync --locked --extra dev
      - name: Build protocol package before integrity checks
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client before integrity checks
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Run release gate
        run: .tools/uv/uv run python tools/release_gate.py --require-web-client-build --output /tmp/release-gate.json
      - name: Generate build SBOM and license inventory
        run: .tools/uv/uv run python tools/generate_sbom.py --output-dir evidence/supply-chain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: evidence/supply-chain/*
          if-no-files-found: error

  windows-package-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check . "pyinstaller==$env:PYINSTALLER_VERSION"
      - name: Download verified scrcpy server
        run: python tools/download_server.py
      - name: Download verified Android platform-tools
        shell: pwsh
        run: |
          python tools/fetch_verified_artifact.py android-platform-tools-windows platform-tools.zip
          Expand-Archive -Path platform-tools.zip -DestinationPath platform-tools
          $adb = (Resolve-Path "platform-tools/platform-tools").Path
          "DWD_ADB_DIR=$adb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows portable executable
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/DroidWebDisplayWindows.spec
      - name: Build Windows stable onedir package
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/DroidWebDisplayWindowsOnedir.spec
      - name: Verify Windows PE metadata and bundled ADB
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $packages = @(
            ".\dist\DroidWebDisplay.exe",
            ".\dist\DroidWebDisplayWindowsOnedir\DroidWebDisplay.exe"
          )
          foreach ($path in $packages) {
            $info = (Get-Item $path).VersionInfo
            if ($info.ProductName -ne "DroidWebDisplay") { throw "ProductName missing from $path" }
            if (-not $info.FileVersion.StartsWith($version)) { throw "FileVersion $($info.FileVersion) does not match $version in $path" }
            if (-not $info.ProductVersion.StartsWith($version)) { throw "ProductVersion $($info.ProductVersion) does not match $version in $path" }
            if ($info.OriginalFilename -ne "DroidWebDisplay.exe") { throw "OriginalFilename missing from $path" }
          }
          $adb = Get-ChildItem ".\dist\DroidWebDisplayWindowsOnedir" -Recurse -Filter adb.exe | Select-Object -First 1
          if (-not $adb) { throw "Bundled adb.exe missing from onedir package" }
          & $adb.FullName version
          if ($LASTEXITCODE -ne 0) { throw "Bundled adb.exe failed to execute" }
      - name: Smoke-test Windows portable desktop, CLI and bundled ADB
        shell: pwsh
        run: |
          foreach ($arg in @("--desktop-smoke", "--help", "--adb-smoke")) {
            $process = Start-Process -FilePath ".\dist\DroidWebDisplay.exe" -ArgumentList $arg -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Portable smoke $arg failed: $($process.ExitCode)" }
          }
      - name: Smoke-test Windows onedir desktop, CLI and bundled ADB
        shell: pwsh
        run: |
          $exe = ".\dist\DroidWebDisplayWindowsOnedir\DroidWebDisplay.exe"
          foreach ($arg in @("--desktop-smoke", "--help", "--adb-smoke")) {
            $process = Start-Process -FilePath $exe -ArgumentList $arg -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Onedir smoke $arg failed: $($process.ExitCode)" }
          }
      - name: Repeat Windows service start-stop smoke
        shell: pwsh
        run: |
          1..3 | ForEach-Object { python tools/smoke_desktop_package.py .\dist\DroidWebDisplay.exe --timeout 60 }
          1..3 | ForEach-Object { python tools/smoke_desktop_package.py .\dist\DroidWebDisplayWindowsOnedir\DroidWebDisplay.exe --timeout 60 }
      - name: Build Windows stable onedir ZIP
        shell: pwsh
        run: Compress-Archive -Path ".\dist\DroidWebDisplayWindowsOnedir\*" -DestinationPath ".\dist\DroidWebDisplay-windows-x86_64.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-smoke
          path: |
            dist/DroidWebDisplay.exe
            dist/DroidWebDisplay-windows-x86_64.zip
          if-no-files-found: error

  linux-appimage-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check . "pyinstaller==$PYINSTALLER_VERSION"
      - name: Download verified scrcpy server
        run: python tools/download_server.py
      - name: Download verified Android platform-tools
        shell: bash
        run: |
          set -euxo pipefail
          python tools/fetch_verified_artifact.py android-platform-tools-linux platform-tools.zip
          unzip -q platform-tools.zip -d platform-tools
          echo "DWD_ADB_DIR=$PWD/platform-tools/platform-tools" >> "$GITHUB_ENV"
      - name: Build Linux frozen runtime
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/DroidWebDisplay.spec
      - name: Smoke-test Linux desktop host
        run: QT_QPA_PLATFORM=offscreen ./dist/DroidWebDisplay/DroidWebDisplay --desktop-smoke
      - name: Smoke-test frozen runtime CLI
        run: ./dist/DroidWebDisplay/DroidWebDisplay --help
      - name: Build AppImage with verified toolchain
        shell: bash
        run: |
          set -euxo pipefail
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/lib/droidwebdisplay"
          cp -a dist/DroidWebDisplay/. "$APPDIR/usr/lib/droidwebdisplay/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/usr/bin/env sh
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$HERE/usr/lib/droidwebdisplay/DroidWebDisplay" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/droidwebdisplay.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DroidWebDisplay
          Comment=Open the local DroidWebDisplay browser interface
          Exec=DroidWebDisplay
          Icon=droidwebdisplay
          Terminal=false
          Categories=Development;Utility;
          EOF
          cp packaging/linux/droidwebdisplay.svg "$APPDIR/droidwebdisplay.svg"
          ln -s droidwebdisplay.svg "$APPDIR/.DirIcon"

          python tools/fetch_verified_artifact.py appimagetool-linux-x86_64 appimagetool-x86_64.AppImage
          python tools/fetch_verified_artifact.py appimage-runtime-linux-x86_64 runtime-x86_64
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p release
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            --runtime-file "$PWD/runtime-x86_64" \
            "$APPDIR" \
            "release/DroidWebDisplay-ci-linux-x86_64.AppImage"
          chmod +x release/DroidWebDisplay-ci-linux-x86_64.AppImage
      - name: Verify AppImage version metadata and bundled ADB
        shell: bash
        run: |
          set -euo pipefail
          # The Windows job verifies PE FileVersion/ProductVersion against VERSION.
          # Without an equivalent here, release.yml renames this artifact to
          # DroidWebDisplay-v<version>-linux-x86_64.AppImage and publishes a
          # filename asserting a version nothing checked.
          version=$(tr -d '[:space:]' < VERSION)
          appimage="$PWD/release/DroidWebDisplay-ci-linux-x86_64.AppImage"
          workdir=$(mktemp -d)
          cd "$workdir"
          "$appimage" --appimage-extract > /dev/null
          root="$workdir/squashfs-root/usr/lib/droidwebdisplay"
          test -d "$root"
          bundled=$(find "$root" -maxdepth 3 -name VERSION -type f | head -n 1)
          test -n "$bundled"
          got=$(tr -d '[:space:]' < "$bundled")
          if [ "$got" != "$version" ]; then
            echo "AppImage bundles VERSION $got but the tree says $version" >&2
            exit 1
          fi
          adb=$(find "$root" -name adb -type f | head -n 1)
          test -n "$adb"
          echo "AppImage version $got verified, bundled adb at ${adb#$root/}"
          cd - > /dev/null
          rm -rf "$workdir"
      - name: Smoke-test AppImage desktop host
        run: QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --desktop-smoke
      - name: Smoke-test AppImage CLI
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --help
      - name: Smoke-test AppImage service
        run: python tools/smoke_desktop_package.py ./release/DroidWebDisplay-ci-linux-x86_64.AppImage --appimage-extract-and-run --timeout 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-appimage-smoke
          path: release/DroidWebDisplay-ci-linux-x86_64.AppImage
          if-no-files-found: error
