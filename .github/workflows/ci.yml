    try {
      this.applySnapshot(await this.#api.autoDownload());
    } catch (error) {
      this.elements.status.textContent = "Unavailable";
      this.elements.summary.textContent = errorMessage(error);
      this.elements.summary.classList.add("error-text");
    } finally {
      this.#refreshing = false;
    }
  }
''', 'guard file-sync polling overlap')

          running = root / 'running-app-controller.ts'
          replace_once(running, '  #refreshAfterDropdown = false;\n', '  #refreshAfterDropdown = false;\n  #refreshQueued = false;\n', 'running app queued refresh field')
          replace_once(running, '''    elements.device.addEventListener("change", () => {
      this.#dropdownActive = false;
      this.#refreshAfterDropdown = false;
      void this.refresh();
    });
''', '''    elements.device.addEventListener("change", () => {
      this.#dropdownActive = false;
      this.#refreshAfterDropdown = false;
      this.#lastRefreshAt = 0;
      if (this.#refreshing) this.#refreshQueued = true;
      else void this.refresh();
    });
''', 'queue refresh across device change')
          replace_once(running, '  public async refresh(silent = false): Promise<void> {\n    if (this.#refreshing) return;\n', '  public async refresh(silent = false): Promise<void> {\n    if (this.#refreshing) {\n      this.#refreshQueued = true;\n      return;\n    }\n', 'queue overlapping running app refresh')
          replace_once(running, '      const [apps, sessions] = await Promise.all([this.#api.runningApps(serial), this.#api.sessions()]);\n      this.#apps = apps.apps;\n', '      const [apps, sessions] = await Promise.all([this.#api.runningApps(serial), this.#api.sessions()]);\n      if (this.#elements.device.value !== serial) {\n        this.#refreshQueued = true;\n        return;\n      }\n      this.#apps = apps.apps;\n', 'discard stale running app result')
          replace_once(running, '''    } finally {
      this.#refreshing = false;
    }
  }
''', '''    } finally {
      this.#refreshing = false;
      if (this.#refreshQueued) {
        this.#refreshQueued = false;
        void this.refresh(true);
      }
    }
  }
''', 'run queued running app refresh')

          tests = Path('apps/web-client/tests/layout.test.mjs')
          text = tests.read_text(encoding='utf-8')
          marker = 'test("Android File Explorer refreshes when stale", () => {\n'
          insert = '''test("device-dependent UI refreshes reject stale or overlapping results", () => {
  assert.match(controllerSource, /#capabilityRequestGeneration/);
  assert.match(transferSource, /#browseGeneration/);
  assert.match(transferSource, /#refreshTransfersBusy/);
  assert.match(autoDownloadSource, /#refreshing/);
  assert.match(runningAppSource, /#refreshQueued/);
});

'''
          if text.count(marker) != 1:
              raise SystemExit('request guard test insertion marker mismatch')
          tests.write_text(text.replace(marker, insert + marker, 1), encoding='utf-8')
          PY
