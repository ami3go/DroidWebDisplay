name: Apply Explorer auto-refresh
on:
  push:
    branches: [agent/connect-drawer]
    paths: [.github/workflows/ci.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-running-app-always-move
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm run build --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web-client/src/transfer-controller.ts'); s=p.read_text()
          s=s.replace('const ACTIVE_STATES = new Set(["queued", "preparing", "transferring", "verifying"]);','const ACTIVE_STATES = new Set(["queued", "preparing", "transferring", "verifying"]);\nconst EXPLORER_REFRESH_STALE_MS = 3000;',1)
          s=s.replace('  #lastSelectedIndex: number | null = null;','  #lastSelectedIndex: number | null = null;\n  #lastBrowseAt = 0;',1)
          a='    this.elements.storageRefresh.addEventListener("click", () => void this.runAction(() => this.browse()));'
          b=a+'\n    document.querySelector<HTMLButtonElement>(\'[data-group="files"]\')?.addEventListener("click", () => { void this.runAction(() => this.refreshExplorerIfStale()); });\n    const explorerSection = document.querySelector<HTMLDetailsElement>(\'[data-section-key="files-explorer"]\');\n    explorerSection?.addEventListener("toggle", () => { if (explorerSection.open) void this.runAction(() => this.refreshExplorerIfStale()); });'
          assert a in s; s=s.replace(a,b,1)
          a='  private async browse(path = this.elements.storagePath.value || "/sdcard/Download"): Promise<void> {'
          b='  private async refreshExplorerIfStale(): Promise<void> {\n    if (!this.elements.device.value) return;\n    if (Date.now() - this.#lastBrowseAt < EXPLORER_REFRESH_STALE_MS) return;\n    await this.browse();\n  }\n\n'+a
          assert a in s; s=s.replace(a,b,1)
          a='    this.renderStorage(result.entries);\n    this.setStatus(`${result.entries.length} item(s) in ${result.path}`);'
          b='    this.renderStorage(result.entries);\n    this.#lastBrowseAt = Date.now();\n    this.setStatus(`${result.entries.length} item(s) in ${result.path}`);'
          assert a in s; p.write_text(s.replace(a,b,1))
          p=Path('apps/web-client/tests/layout.test.mjs'); s=p.read_text()
          if 'const transferSource =' not in s: s=s.replace('const controllerSource = await readFile(resolve(root, "src/controller.ts"), "utf8");','const controllerSource = await readFile(resolve(root, "src/controller.ts"), "utf8");\nconst transferSource = await readFile(resolve(root, "src/transfer-controller.ts"), "utf8");')
          a='test("File sync keeps Save primary and moves uncommon actions into overflow", () => {'
          b='test("Android File Explorer refreshes when stale", () => {\n  assert.match(transferSource, /EXPLORER_REFRESH_STALE_MS = 3000/);\n  assert.match(transferSource, /refreshExplorerIfStale/);\n});\n\n'+a
          assert a in s; p.write_text(s.replace(a,b,1))
          PY
          npm run build --prefix apps/web-client
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output /tmp/gate.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web-client
          git commit -m "Auto-refresh Android File Explorer"
          git push origin HEAD:agent/fix-running-app-always-move
