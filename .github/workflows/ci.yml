name: Apply Explorer consolidation
on:
  push:
    branches: [agent/connect-drawer]
    paths: [.github/workflows/ci.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable_main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm run build --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Consolidate Files UI and custom destinations
        run: |
          python - <<'PY'
          from pathlib import Path

          def between(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          # Static UI: remove Load card and make Explorer self-contained.
          p = Path('apps/web-client/static/index.html')
          s = p.read_text()
          load_start = s.index('<details class="gb-accordion" data-section-key="files-load"')
          explorer_start = s.index('<details class="gb-accordion" data-section-key="files-explorer"', load_start)
          s = s[:load_start] + s[explorer_start:]
          marker = '  <div class="gb-accordion-content">\n'
          explorer_start = s.index('data-section-key="files-explorer"')
          content_pos = s.index(marker, explorer_start) + len(marker)
          s = s[:content_pos] + '          <input id="context-upload-file" type="file" multiple hidden>\n' + s[content_pos:]
          destination = '            <label>Destination folder\n              <select id="destination-profile"></select>\n            </label>\n'
          custom = destination + '            <div id="custom-destination-row" hidden>\n              <label>Custom PC folder\n                <input id="custom-destination-path" type="text" placeholder="Absolute PC folder path" spellcheck="false">\n              </label>\n            </div>\n'
          assert destination in s
          s = s.replace(destination, custom, 1)
          help_marker = '          <p class="explorer-help">Drag PC files onto a folder to upload there, or onto empty Explorer space to upload to the current folder. Right-click remains available for all actions.</p>'
          transfer_options = '          <details class="explorer-transfer-options">\n            <summary>Transfer options</summary>\n            <label>Duplicate handling\n              <select id="duplicate-policy">\n                <option value="rename" selected>Rename safely</option>\n                <option value="overwrite">Overwrite</option>\n                <option value="fail">Fail</option>\n              </select>\n            </label>\n          </details>\n'
          assert help_marker in s
          s = s.replace(help_marker, transfer_options + help_marker, 1)
          p.write_text(s)

          # Main bootstrap: remove Load-only elements, add custom destination inputs.
          p = Path('apps/web-client/src/main.ts')
          s = p.read_text()
          for line in [
              '      file: required<HTMLInputElement>("#upload-file"),\n',
              '      uploadDirectory: required<HTMLSelectElement>("#upload-directory"),\n',
              '      upload: required<HTMLButtonElement>("#upload-file-button"),\n',
              '      openUploadFolder: required<HTMLButtonElement>("#open-upload-folder"),\n',
          ]:
              assert line in s
              s = s.replace(line, '', 1)
          anchor = '      contextUploadFile: required<HTMLInputElement>("#context-upload-file"),\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '      customDestinationRow: required<HTMLElement>("#custom-destination-row"),\n      customDestinationPath: required<HTMLInputElement>("#custom-destination-path"),\n', 1)
          p.write_text(s)

          # Transfer controller.
          p = Path('apps/web-client/src/transfer-controller.ts')
          s = p.read_text()
          for line in [
              '  readonly file: HTMLInputElement;\n',
              '  readonly uploadDirectory: HTMLSelectElement;\n',
              '  readonly upload: HTMLButtonElement;\n',
              '  readonly openUploadFolder: HTMLButtonElement;\n',
          ]:
              assert line in s
              s = s.replace(line, '', 1)
          anchor = '  readonly contextUploadFile: HTMLInputElement;\n'
          s = s.replace(anchor, anchor + '  readonly customDestinationRow: HTMLElement;\n  readonly customDestinationPath: HTMLInputElement;\n', 1)

          init_new = '''  public async initialize(): Promise<void> {
    const [profiles, roots] = await Promise.all([this.#api.destinationProfiles(), this.#api.androidStorageRoots(this.elements.device.value || undefined)]);
    this.elements.destinationProfile.replaceChildren();
    for (const profile of profiles.profiles) {
      const option = document.createElement("option");
      option.value = profile.id;
      option.textContent = `${profile.id} · ${profile.path}`;
      this.elements.destinationProfile.append(option);
    }
    const custom = document.createElement("option");
    custom.value = "__custom__";
    custom.textContent = "Custom PC folder…";
    this.elements.destinationProfile.append(custom);
    const savedPath = localStorage.getItem("droidwebdisplay-custom-download-path-v1") ?? "";
    const savedDestination = localStorage.getItem("droidwebdisplay-download-destination-v1") ?? "";
    this.elements.customDestinationPath.value = savedPath;
    if ([...this.elements.destinationProfile.options].some((option) => option.value === savedDestination)) this.elements.destinationProfile.value = savedDestination;
    this.updateDestinationUi();
    this.elements.storageRoot.replaceChildren();
    ANDROID_ROOTS = roots.roots.map((root) => root.path);
    for (const root of roots.roots) {
      const rootOption = document.createElement("option");
      rootOption.value = root.path;
      rootOption.textContent = root.label;
      this.elements.storageRoot.append(rootOption);
    }
    this.elements.storageRoot.value = roots.defaultPath;
    await Promise.allSettled([this.browse(roots.defaultPath), this.refreshTransfers()]);
    this.#pollTimer = window.setInterval(() => void this.refreshTransfers(), 750);
  }

'''
          s = between(s, '  public async initialize(): Promise<void> {', '  private bindEvents(): void {', init_new)
          s = s.replace('    this.elements.upload.addEventListener("click", () => void this.runAction(() => this.uploadFiles(this.elements.uploadDirectory.value, [...(this.elements.file.files ?? [])])));\n', '', 1)
          s = s.replace('    this.elements.openUploadFolder.addEventListener("click", () => void this.runAction(() => this.browse(this.elements.uploadDirectory.value)));\n', '', 1)
          old_open = '''    this.elements.openPcFolder.addEventListener("click", () => void this.runAction(async () => {
      await this.#api.openDestinationProfile(this.elements.destinationProfile.value);
      this.setStatus("Opened PC destination folder");
    }));
'''
          new_open = '''    this.elements.destinationProfile.addEventListener("change", () => {
      localStorage.setItem("droidwebdisplay-download-destination-v1", this.elements.destinationProfile.value);
      this.updateDestinationUi();
    });
    this.elements.customDestinationPath.addEventListener("change", () => {
      localStorage.setItem("droidwebdisplay-custom-download-path-v1", this.elements.customDestinationPath.value.trim());
    });
    this.elements.openPcFolder.addEventListener("click", () => void this.runAction(async () => {
      const destination = this.downloadDestination();
      if (destination.destinationPath) await this.#api.openDestinationPath(destination.destinationPath);
      else await this.#api.openDestinationProfile(destination.destinationProfile);
      this.setStatus("Opened PC destination folder");
    }));
'''
          assert old_open in s
          s = s.replace(old_open, new_open, 1)

          refresh_new = '''  private async refreshStorageRoots(): Promise<void> {
    const roots = await this.#api.androidStorageRoots(this.elements.device.value || undefined);
    const currentRoot = this.elements.storageRoot.value;
    this.elements.storageRoot.replaceChildren();
    for (const root of roots.roots) {
      const option = document.createElement("option");
      option.value = root.path;
      option.textContent = root.label;
      this.elements.storageRoot.append(option);
    }
    ANDROID_ROOTS = roots.roots.map((root) => root.path);
    this.elements.storageRoot.value = [...this.elements.storageRoot.options].some((item) => item.value === currentRoot) ? currentRoot : roots.defaultPath;
  }

'''
          s = between(s, '  private async refreshStorageRoots(): Promise<void> {', '  private async refreshExplorerIfStale(): Promise<void> {', refresh_new)

          upload_new = '''  private async uploadFiles(destinationPath: string, files: readonly File[]): Promise<void> {
    const serial = this.requireSerial();
    if (!files.length) throw new Error("Choose one or more PC files to upload");
    for (const file of files) {
      await this.#api.uploadFile({
        serial,
        file,
        destinationPath,
        duplicatePolicy: this.duplicatePolicy(),
      });
    }
    this.elements.contextUploadFile.value = "";
    await this.refreshTransfers();
    this.setStatus(`Queued ${files.length} upload(s) to ${destinationPath}`);
  }

  private updateDestinationUi(): void {
    const custom = this.elements.destinationProfile.value === "__custom__";
    this.elements.customDestinationRow.hidden = !custom;
    if (custom) this.elements.customDestinationPath.focus();
  }

  private downloadDestination(): { destinationProfile: string; destinationPath?: string } {
    if (this.elements.destinationProfile.value !== "__custom__") return { destinationProfile: this.elements.destinationProfile.value };
    const destinationPath = this.elements.customDestinationPath.value.trim();
    if (!destinationPath) throw new Error("Enter an absolute PC destination folder path");
    localStorage.setItem("droidwebdisplay-custom-download-path-v1", destinationPath);
    return { destinationProfile: "default-downloads", destinationPath };
  }

'''
          s = between(s, '  private async uploadFiles(destinationPath: string, files: readonly File[]): Promise<void> {', '  private async download(sourcePath: string): Promise<void> {', upload_new)
          old_download = '''  private async download(sourcePath: string): Promise<void> {
    const serial = this.requireSerial();
    await this.#api.downloadFile({
      serial,
      sourcePath,
      destinationProfile: this.elements.destinationProfile.value,
      duplicatePolicy: this.duplicatePolicy(),
    });
'''
          new_download = '''  private async download(sourcePath: string): Promise<void> {
    const serial = this.requireSerial();
    const destination = this.downloadDestination();
    await this.#api.downloadFile({
      serial,
      sourcePath,
      ...destination,
      duplicatePolicy: this.duplicatePolicy(),
    });
'''
          assert old_download in s
          s = s.replace(old_download, new_download, 1)
          p.write_text(s)

          # Browser API support for custom PC destination.
          p = Path('apps/web-client/src/api.ts')
          s = p.read_text()
          anchor = '''  public async openDestinationProfile(profileId: string): Promise<{ profileId: string; path: string; opened: boolean }> {
    return this.request(`/api/v1/destination-profiles/${encodeURIComponent(profileId)}/open`, { method: "POST" });
  }
'''
          addition = anchor + '''
  public async openDestinationPath(path: string): Promise<{ path: string; opened: boolean }> {
    return this.request("/api/v1/destination-path/open", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ path }),
    });
  }
'''
          assert anchor in s
          s = s.replace(anchor, addition, 1)
          old_sig = '  public async downloadFile(request: { serial: string; sourcePath: string; destinationProfile: string; duplicatePolicy: DuplicatePolicy }): Promise<TransferDto> {'
          new_sig = '  public async downloadFile(request: { serial: string; sourcePath: string; destinationProfile: string; destinationPath?: string; duplicatePolicy: DuplicatePolicy }): Promise<TransferDto> {'
          assert old_sig in s
          s = s.replace(old_sig, new_sig, 1)
          p.write_text(s)

          # Backend manager custom-path validation and download routing.
          p = Path('droid_web_display/transfers/manager.py')
          s = p.read_text()
          open_anchor = '''    def open_destination_profile(self, profile_id: str) -> Path:
        path = self._profile(profile_id)
        path.mkdir(parents=True, exist_ok=True)
        try:
            if sys.platform == "win32":
                import os
                os.startfile(path)  # type: ignore[attr-defined]
            elif sys.platform == "darwin":
                subprocess.Popen(["open", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
            else:
                subprocess.Popen(["xdg-open", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
        except OSError as exc:
            raise TransferError("unable to open destination folder", details={"path": str(path), "error": str(exc)}) from exc
        return path
'''
          open_replacement = '''    def open_destination_profile(self, profile_id: str) -> Path:
        return self._open_local_folder(self._profile(profile_id))

    def open_destination_path(self, destination_path: str) -> Path:
        return self._open_local_folder(self._custom_destination(destination_path))

    def _open_local_folder(self, path: Path) -> Path:
        path.mkdir(parents=True, exist_ok=True)
        try:
            if sys.platform == "win32":
                import os
                os.startfile(path)  # type: ignore[attr-defined]
            elif sys.platform == "darwin":
                subprocess.Popen(["open", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
            else:
                subprocess.Popen(["xdg-open", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
        except OSError as exc:
            raise TransferError("unable to open destination folder", details={"path": str(path), "error": str(exc)}) from exc
        return path
'''
          assert open_anchor in s
          s = s.replace(open_anchor, open_replacement, 1)
          s = s.replace('        destination_profile: str = "default-downloads",\n        duplicate_policy: DuplicatePolicy = DuplicatePolicy.RENAME,\n', '        destination_profile: str = "default-downloads",\n        destination_path: str | None = None,\n        duplicate_policy: DuplicatePolicy = DuplicatePolicy.RENAME,\n', 1)
          s = s.replace('        profile_path = self._profile(destination_profile)\n        filename = sanitize_filename(PurePosixPath(normalized).name)\n', '        profile_path = self._custom_destination(destination_path) if destination_path else self._profile(destination_profile)\n        destination_label = "custom" if destination_path else destination_profile\n        filename = sanitize_filename(PurePosixPath(normalized).name)\n', 1)
          s = s.replace('            destination_profile=destination_profile,\n            internal_local_path=str(destination),\n', '            destination_profile=destination_label,\n            internal_local_path=str(destination),\n', 1)
          profile_marker = '''    def _profile(self, profile_id: str) -> Path:
        try:
            return self.destination_profiles[profile_id]
        except KeyError as exc:
            raise TransferValidationError(
                "unknown destination profile",
                details={"destinationProfile": profile_id, "available": sorted(self.destination_profiles)},
            ) from exc
'''
          profile_add = profile_marker + '''
    def _custom_destination(self, destination_path: str) -> Path:
        raw = Path(destination_path).expanduser()
        if not raw.is_absolute():
            raise TransferValidationError("custom destination must be an absolute PC path", details={"destinationPath": destination_path})
        path = raw.resolve()
        if path.exists() and not path.is_dir():
            raise TransferValidationError("custom destination is not a folder", details={"destinationPath": str(path)})
        return path
'''
          assert profile_marker in s
          s = s.replace(profile_marker, profile_add, 1)
          p.write_text(s)

          # Backend API model and endpoints.
          p = Path('droid_web_display/api/app.py')
          s = p.read_text()
          old_field = '    destination_profile: str = Field(default="default-downloads", alias="destinationProfile")\n    duplicate_policy: DuplicatePolicy = Field(default=DuplicatePolicy.RENAME, alias="duplicatePolicy")\n'
          new_field = '    destination_profile: str = Field(default="default-downloads", alias="destinationProfile")\n    destination_path: str | None = Field(default=None, alias="destinationPath")\n    duplicate_policy: DuplicatePolicy = Field(default=DuplicatePolicy.RENAME, alias="duplicatePolicy")\n\n\nclass CustomDestinationPathRequest(BaseModel):\n    model_config = ConfigDict(extra="forbid")\n    path: str = Field(min_length=1, max_length=4096)\n'
          assert old_field in s
          s = s.replace(old_field, new_field, 1)
          route_anchor = '''    @app.post("/api/v1/destination-profiles/{profile_id}/open")
    async def destination_profile_open(profile_id: str, container: Annotated[ServiceContainer, Depends(get_container)]) -> dict:
        path = container.transfers.open_destination_profile(profile_id)
        return {"profileId": profile_id, "path": str(path), "opened": True}
'''
          route_add = route_anchor + '''
    @app.post("/api/v1/destination-path/open")
    async def destination_path_open(body: CustomDestinationPathRequest, container: Annotated[ServiceContainer, Depends(get_container)]) -> dict:
        path = container.transfers.open_destination_path(body.path)
        return {"path": str(path), "opened": True}
'''
          assert route_anchor in s
          s = s.replace(route_anchor, route_add, 1)
          call_anchor = '            destination_profile=body.destination_profile,\n            duplicate_policy=body.duplicate_policy,\n'
          assert call_anchor in s
          s = s.replace(call_anchor, '            destination_profile=body.destination_profile,\n            destination_path=body.destination_path,\n            duplicate_policy=body.duplicate_policy,\n', 1)
          p.write_text(s)

          # UI regression coverage.
          p = Path('apps/web-client/tests/layout.test.mjs')
          s = p.read_text()
          test = '''

test("Files drawer uses Explorer-only transfers with custom PC destination", () => {
  assert.doesNotMatch(html, /data-section-key="files-load"/);
  assert.doesNotMatch(html, /id="upload-file-button"/);
  assert.match(html, /id="context-upload-file"/);
  assert.match(html, /id="custom-destination-path"/);
  assert.match(html, /Custom PC folder/);
  assert.match(html, /id="duplicate-policy"/);
  assert.match(transferSource, /destinationPath/);
});
'''
          if 'Files drawer uses Explorer-only transfers with custom PC destination' not in s:
              p.write_text(s + test)

          # API regression: custom PC destination is used for downloads.
          p = Path('tests/regression/transfers/test_api.py')
          s = p.read_text()
          anchor = '        assert (tmp_path / "downloads" / "result.txt").read_bytes() == b"result"\n'
          addition = anchor + '''

        custom_dir = tmp_path / "custom-downloads"
        custom_download = client.post(
            "/api/v1/transfers/download",
            json={"serial": "PHONE", "sourcePath": "/sdcard/Download/result.txt", "destinationPath": str(custom_dir), "duplicatePolicy": "rename"},
        )
        assert custom_download.status_code == 202
        custom_completed = wait_completed(client, custom_download.json()["transferId"])
        assert custom_completed["state"] == "completed"
        assert custom_completed["destinationProfile"] == "custom"
        assert (custom_dir / "result.txt").read_bytes() == b"result"
'''
          assert anchor in s
          s = s.replace(anchor, addition, 1)
          p.write_text(s)
          PY
          npm run build --prefix apps/web-client
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run pytest tests/regression/transfers/test_api.py tests/regression/transfers/test_transfer_manager.py tests/regression/transfers/test_explorer_ui.py -q
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output /tmp/gate.json
      - name: Commit verified Explorer consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web-client droid_web_display tests
          git commit -m "Consolidate uploads into File Explorer"
          git push origin HEAD:stable_main
