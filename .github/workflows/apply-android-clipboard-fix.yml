name: Apply Android clipboard regression fix

on:
  push:
    branches: [main]
    paths:
      - '.github/android-clipboard-fix-trigger'

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json

      - name: Apply source and regression-test patch
        run: python3 tools/apply_android_clipboard_sync_fix.py

      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build

      - name: Build and test web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm test

      - name: Commit generated and tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web-client/src/input.ts \
            apps/web-client/src/controller.ts \
            apps/web-client/tests/input.test.mjs \
            apps/web-client/tests/layout.test.mjs \
            apps/web-client/dist \
            apps/web-client/dist-manifest.json \
            tests/packaging/test_clipboard_sync_regression.py \
            tools/release_gate.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Fix is already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: restore Android to PC clipboard sync'
          git push origin HEAD:main

      - name: Report automation failure
        if: failure()
        shell: bash
        run: |
          set +e
          body=$(cat <<EOF
          The Android → PC clipboard regression fix automation failed.

          Trigger commit: $GITHUB_SHA
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Android clipboard fix automation failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'Android clipboard fix automation failed' --body "$body"
          fi
