name: Publish DroidWebDisplay v0.11.6 Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.11.6-final.yml'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: droidwebdisplay-v0.11.6-final
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 55c67c93003bd0dfd1c0e1414a9e5a7d0d9b613e
      TAG: v0.11.6
      VERSION: 0.11.6
      BUILD_BRANCH: release/v0.11.6-final-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify target and release state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq .sha)" = "$TARGET_SHA"
          encoded=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$TARGET_SHA" --jq .content)
          test "$(printf '%s' "$encoded" | base64 -d | tr -d '\r\n')" = "$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create exact build ref
        if: steps.preflight.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BUILD_BRANCH" >/dev/null 2>&1 || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BUILD_BRANCH" -f sha="$TARGET_SHA" >/dev/null

      - name: Dispatch release gate
        if: steps.preflight.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BUILD_BRANCH"

      - name: Locate exact CI run
        if: steps.preflight.outputs.exists != 'true'
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$BUILD_BRANCH" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Require green release gate
        if: steps.preflight.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh run watch '${{ steps.gate.outputs.run_id }}' --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Report concise gate failure
        if: failure() && steps.gate.outputs.run_id != ''
        shell: bash
        run: |
          set +e
          run_id='${{ steps.gate.outputs.run_id }}'
          {
            echo "v0.11.6 final gate failed for $TARGET_SHA."
            echo
            echo "CI run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
            echo
            echo '```text'
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 \
              | grep -E '(^|[[:space:]])not ok [0-9]+|FAILED |FAILURES|# fail |status.*FAIL|Process completed with exit code' \
              | tail -n 160
            echo '```'
          } > /tmp/v0116-failure.md
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"v0.11.6 recovery failure" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/v0116-failure.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "v0.11.6 recovery failure" --body-file /tmp/v0116-failure.md
          fi

      - name: Download green package artifacts
        if: steps.preflight.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.gate.outputs.run_id }}'
          mkdir -p artifacts/windows artifacts/linux assets
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name windows-package-smoke --dir artifacts/windows
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name linux-appimage-smoke --dir artifacts/linux
          windows=$(find artifacts/windows -type f -name 'DroidWebDisplay.exe' -print -quit)
          linux=$(find artifacts/linux -type f -name '*.AppImage' -print -quit)
          test -n "$windows" && test -n "$linux"
          cp "$windows" "assets/DroidWebDisplay-v${VERSION}-windows-x86_64.exe"
          cp "$linux" "assets/DroidWebDisplay-v${VERSION}-linux-x86_64.AppImage"
          chmod +x "assets/DroidWebDisplay-v${VERSION}-linux-x86_64.AppImage"
          (cd assets && sha256sum DroidWebDisplay-* > SHA256SUMS.txt)

      - name: Publish release
        if: steps.preflight.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/releases/${TAG}.md?ref=$TARGET_SHA" --jq .content \
            | base64 -d > /tmp/release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" \
            --title "DroidWebDisplay $TAG" --notes-file /tmp/release-notes.md \
            "assets/DroidWebDisplay-v${VERSION}-windows-x86_64.exe" \
            "assets/DroidWebDisplay-v${VERSION}-linux-x86_64.AppImage" \
            assets/SHA256SUMS.txt

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets \
            --jq '(.tagName == "v0.11.6") and (.isDraft == false) and (.isPrerelease == false) and ([.assets[].name] | sort) == (["DroidWebDisplay-v0.11.6-linux-x86_64.AppImage","DroidWebDisplay-v0.11.6-windows-x86_64.exe","SHA256SUMS.txt"] | sort)' \
            | grep -qx true

      - name: Remove temporary build ref
        if: always() && steps.preflight.outputs.exists != 'true'
        shell: bash
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BUILD_BRANCH" >/dev/null 2>&1 || true
