name: Multi-display Phase 4 Builder v2

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  build-phase4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json

      - name: Apply corrected Phase 4 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          types_path = Path('apps/web-client/src/types.ts')
          types_text = types_path.read_text(encoding='utf-8')
          old_session_shape = (
              '  readonly options: SessionOptionsDto;\n'
              '  readonly displayMode: DisplayMode;\n'
              '  readonly virtualDisplay: VirtualDisplayDiagnosticDto;\n'
          )
          normalized_session_shape = (
              '  readonly options: SessionOptionsDto;\n'
              '  readonly displayMode: "physical" | "virtual";\n'
              '  readonly virtualDisplay: VirtualDisplayDiagnosticDto;\n'
          )
          if types_text.count(old_session_shape) != 1:
              raise SystemExit('SessionDto displayMode context changed unexpectedly')
          types_text = types_text.replace(old_session_shape, normalized_session_shape, 1)
          old_list = 'export interface SessionListResponse {\n  readonly sessions: readonly SessionDto[];\n}\n'
          normalized_list = 'export interface SessionListResponse {\n  readonly sessions: SessionDto[];\n}\n'
          if types_text.count(old_list) != 1:
              raise SystemExit('SessionListResponse context changed unexpectedly')
          types_text = types_text.replace(old_list, normalized_list, 1)
          types_path.write_text(types_text, encoding='utf-8')

          workflow = Path('.github/workflows/multi-display-phase4-builder.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'phase4-builder.py', 'exec'))

          # Restore the branch's stronger shared DisplayMode and readonly-array typing.
          types_text = types_path.read_text(encoding='utf-8')
          patched_session_shape = (
              '  readonly options: SessionOptionsDto;\n'
              '  readonly displayMode: "physical" | "virtual";\n'
              '  readonly display: DisplayIdentityDto;\n'
              '  readonly virtualDisplay: VirtualDisplayDiagnosticDto;\n'
          )
          restored_session_shape = (
              '  readonly options: SessionOptionsDto;\n'
              '  readonly displayMode: DisplayMode;\n'
              '  readonly display: DisplayIdentityDto;\n'
              '  readonly virtualDisplay: VirtualDisplayDiagnosticDto;\n'
          )
          if types_text.count(patched_session_shape) != 1:
              raise SystemExit('Patched SessionDto context changed unexpectedly')
          types_text = types_text.replace(patched_session_shape, restored_session_shape, 1)
          types_text = types_text.replace('readonly sessions: SessionDto[];', 'readonly sessions: readonly SessionDto[];')
          types_path.write_text(types_text, encoding='utf-8')
          PY

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: packages/scrcpy-protocol
      - run: npm ci
        working-directory: apps/web-client
      - name: Run Python regression subset
        run: $HOME/.local/bin/uv run pytest -q tests/regression/session/test_device_session_api.py tests/regression/session/test_display_identity.py tests/regression/session/test_multi_session.py
      - name: Build protocol package
        run: npm run build
        working-directory: packages/scrcpy-protocol
      - name: Build web client
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Run web client tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Ruff correctness checks
        run: $HOME/.local/bin/uv run ruff check droid_web_display/api/app.py tests/regression/session/test_device_session_api.py --select E9,F63,F7,F82
      - name: Check OpenAPI
        run: $HOME/.local/bin/uv run python tools/generate_openapi.py --check
      - name: Commit Phase 4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src apps/web-client/static apps/web-client/tests apps/web-client/dist
          if git diff --cached --quiet; then
            echo "No Phase 4 changes to commit"
            exit 0
          fi
          git commit -m "Implement multi-display Phase 4 live browser tabs"
          git push origin HEAD:multi-display-tabs
