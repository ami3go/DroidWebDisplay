name: Recover DroidWebDisplay v0.11.6 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v0.11.6.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: droidwebdisplay-v0.11.6-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 00f357d389b7d0fe72e11bffe61dd5788272fc75
      RELEASE_VERSION: 0.11.6
      RELEASE_TAG: v0.11.6
      BUILD_BRANCH: release/v0.11.6-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify exact release target
        shell: bash
        run: |
          set -euo pipefail
          resolved=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq .sha)
          test "$resolved" = "$TARGET_SHA"
          encoded=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$TARGET_SHA" --jq .content)
          version=$(printf '%s' "$encoded" | base64 -d | tr -d '\r\n')
          test "$version" = "$RELEASE_VERSION"

      - name: Stop if release already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin recovery build branch to release commit
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ref="repos/$GITHUB_REPOSITORY/git/refs/heads/$BUILD_BRANCH"
          if gh api "$ref" >/dev/null 2>&1; then
            gh api -X PATCH "$ref" -f sha="$TARGET_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$BUILD_BRANCH" \
              -f sha="$TARGET_SHA" >/dev/null
          fi

      - name: Dispatch exact release gate
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BUILD_BRANCH"

      - name: Find and verify release gate
        if: steps.existing.outputs.exists != 'true'
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$BUILD_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" \
              | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Download verified packages
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.gate.outputs.run_id }}'
          mkdir -p artifacts/windows artifacts/linux release-assets
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name windows-package-smoke --dir artifacts/windows
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name linux-appimage-smoke --dir artifacts/linux

          windows=$(find artifacts/windows -type f -name 'DroidWebDisplay.exe' -print -quit)
          linux=$(find artifacts/linux -type f -name '*.AppImage' -print -quit)
          test -n "$windows"
          test -n "$linux"

          cp "$windows" "release-assets/DroidWebDisplay-v${RELEASE_VERSION}-windows-x86_64.exe"
          cp "$linux" "release-assets/DroidWebDisplay-v${RELEASE_VERSION}-linux-x86_64.AppImage"
          chmod +x "release-assets/DroidWebDisplay-v${RELEASE_VERSION}-linux-x86_64.AppImage"
          (cd release-assets && sha256sum DroidWebDisplay-* > SHA256SUMS.txt)

      - name: Load release notes
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/releases/${RELEASE_TAG}.md?ref=$TARGET_SHA" \
            --jq .content | base64 -d > release-notes.md
          grep -q "^## ${RELEASE_VERSION} " release-notes.md

      - name: Publish v0.11.6
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "DroidWebDisplay $RELEASE_TAG" \
            --notes-file release-notes.md \
            "release-assets/DroidWebDisplay-v${RELEASE_VERSION}-windows-x86_64.exe" \
            "release-assets/DroidWebDisplay-v${RELEASE_VERSION}-linux-x86_64.AppImage" \
            release-assets/SHA256SUMS.txt

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets \
            --jq '
              (.tagName == "v0.11.6") and
              (.isDraft == false) and
              (.isPrerelease == false) and
              ([.assets[].name] | index("DroidWebDisplay-v0.11.6-windows-x86_64.exe") != null) and
              ([.assets[].name] | index("DroidWebDisplay-v0.11.6-linux-x86_64.AppImage") != null) and
              ([.assets[].name] | index("SHA256SUMS.txt") != null)
            ' | grep -qx true

      - name: Remove recovery build branch
        if: always() && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BUILD_BRANCH" >/dev/null 2>&1 || true
