name: Apply Windows Package Hardening

on:
  push:
    branches: [agent/windows-package-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-windows-package-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/windows-package-hardening
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4e3e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Apply focused hardening patch
        run: python tools/apply_windows_package_hardening.py
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build and test web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm test
      - name: Python syntax check
        run: python -m compileall -q droid_web_display tools
      - name: Validate patch
        run: |
          git diff --check
          test -s packaging/windows/droidwebdisplay.ico
          test -f packaging/pyinstaller/DroidWebDisplayOnedir.spec
          grep -q 'upx=False' packaging/pyinstaller/DroidWebDisplay.spec
          grep -q 'windows-x86_64.zip' .github/workflows/release.yml
      - name: Commit hardened implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_windows_package_hardening.py .github/workflows/apply-windows-package-hardening.yml
          git rm -f tools/.windows-hardening-trigger 2>/dev/null || true
          git add -- \
            packaging/pyinstaller/DroidWebDisplay.spec \
            packaging/pyinstaller/DroidWebDisplayOnedir.spec \
            packaging/windows/droidwebdisplay.ico \
            tools/desktop_entry.py \
            apps/web-client/src/browser-support.ts \
            apps/web-client/src/controller.ts \
            apps/web-client/src/main.ts \
            apps/web-client/static/index.html \
            apps/web-client/tests/browser-support.test.mjs \
            apps/web-client/dist \
            apps/web-client/dist-manifest.json \
            droid_web_display/scrcpy/session.py \
            tests/regression/test_scrcpy_android16_failure_classification.py \
            tests/packaging/test_windows_package_hardening.py \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            docs/WINDOWS_PACKAGING.md \
            docs/WINDOWS_RELEASE_HIL.md
          git commit -m "fix: harden Windows packaging and diagnostics"
          git push origin HEAD:agent/windows-package-hardening
