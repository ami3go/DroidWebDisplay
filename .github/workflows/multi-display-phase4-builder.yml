name: Multi-display Phase 4 Builder

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  build-phase4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json

      - name: Apply live display tabs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_block(path: Path, start: str, end: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{path}: start marker not found: {start!r}')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{path}: end marker not found: {end!r}')
              path.write_text(text[:start_index] + replacement + text[end_index:], encoding='utf-8')

          # ---- Session DTO/API contract ----
          types = Path('apps/web-client/src/types.ts')
          replace_once(
              types,
              'export interface SessionDto {\n',
              '''export interface DisplayIdentityDto {\n  readonly sessionId: string;\n  readonly kind: "physical" | "virtual";\n  readonly displayId: number | null;\n  readonly name: string;\n  readonly application: string | null;\n  readonly resolution: {\n    readonly width: number | null;\n    readonly height: number | null;\n    readonly source: "unknown" | "requested" | "actual";\n  };\n  readonly dpi: {\n    readonly value: number | null;\n    readonly source: "unknown" | "requested" | "actual";\n  };\n  readonly createdAt: number;\n  readonly state: string;\n}\n\nexport interface SessionDto {\n''',
          )
          replace_once(
              types,
              '  readonly displayMode: "physical" | "virtual";\n',
              '  readonly displayMode: "physical" | "virtual";\n  readonly display: DisplayIdentityDto;\n',
          )
          replace_once(
              types,
              'export interface SessionListResponse {\n  readonly sessions: SessionDto[];\n}\n',
              '''export interface SessionListResponse {\n  readonly sessions: SessionDto[];\n}\n\nexport interface DeviceSessionListResponse {\n  readonly serial: string;\n  readonly activeSessionCount: number;\n  readonly sessions: SessionDto[];\n}\n\nexport interface DeviceSessionStopResponse {\n  readonly serial: string;\n  readonly stoppedCount: number;\n  readonly sessions: SessionDto[];\n}\n''',
          )

          api = Path('apps/web-client/src/api.ts')
          replace_once(
              api,
              '  DeviceListResponse,\n',
              '  DeviceListResponse,\n  DeviceSessionListResponse,\n  DeviceSessionStopResponse,\n',
          )
          replace_once(
              api,
              '  readonly serial?: string;\n',
              '  readonly serial?: string;\n  readonly displayName?: string;\n',
          )
          replace_once(
              api,
              '''  public async sessions(): Promise<SessionListResponse> {\n    return this.request<SessionListResponse>("/api/v1/sessions");\n  }\n\n''',
              '''  public async sessions(): Promise<SessionListResponse> {\n    return this.request<SessionListResponse>("/api/v1/sessions");\n  }\n\n  public async deviceSessions(serial: string): Promise<DeviceSessionListResponse> {\n    return this.request<DeviceSessionListResponse>(`/api/v1/devices/${encodeURIComponent(serial)}/sessions`);\n  }\n\n  public async startDeviceSession(serial: string, request: StartSessionRequest): Promise<SessionDto> {\n    return this.request<SessionDto>(`/api/v1/devices/${encodeURIComponent(serial)}/sessions`, {\n      method: "POST",\n      headers: { "content-type": "application/json" },\n      body: JSON.stringify({\n        video: true,\n        audio: false,\n        control: true,\n        audioCodec: "opus",\n        audioBitRate: 128_000,\n        videoCodec: "h264",\n        maxSize: 1920,\n        videoBitRate: 8_000_000,\n        maxFps: 30,\n        displayMode: "physical",\n        ...request,\n        serial,\n      }),\n    });\n  }\n\n  public async stopDeviceSession(serial: string, sessionId: string, keepalive = false): Promise<SessionDto | null> {\n    try {\n      return await this.request<SessionDto>(\n        `/api/v1/devices/${encodeURIComponent(serial)}/sessions/${encodeURIComponent(sessionId)}`,\n        { method: "DELETE", keepalive },\n      );\n    } catch (error) {\n      if (keepalive) return null;\n      throw error;\n    }\n  }\n\n  public async stopDeviceSessions(serial: string, keepalive = false): Promise<DeviceSessionStopResponse | null> {\n    try {\n      return await this.request<DeviceSessionStopResponse>(\n        `/api/v1/devices/${encodeURIComponent(serial)}/sessions`,\n        { method: "DELETE", keepalive },\n      );\n    } catch (error) {\n      if (keepalive) return null;\n      throw error;\n    }\n  }\n\n''',
          )

          # ---- Static HTML ----
          html = Path('apps/web-client/static/index.html')
          replace_once(
              html,
              '''          <h2>Display mode</h2>\n          <label>Mode\n''',
              '''          <h2>Display mode</h2>\n          <label>Display name, optional\n            <input id="display-name" maxlength="80" placeholder="Automatic tab name">\n          </label>\n          <label>Mode\n''',
          )
          replace_once(
              html,
              '''    <section class="workspace native-workspace"><section id="stage" class="stage" aria-label="Android display">\n        <canvas id="screen" tabindex="0" aria-label="Mirrored Android screen"></canvas>\n        <div class="stage-hint">Connect an authorized Android phone over USB</div>\n      </section></section>\n''',
              '''    <section class="workspace native-workspace">\n      <div class="display-workspace">\n        <div class="display-tabbar" aria-label="Display sessions">\n          <div id="display-tabs" class="display-tabs" role="tablist" aria-label="Android display sessions">\n            <span class="display-tabs-empty">No active displays</span>\n          </div>\n          <button id="display-tab-add" type="button" class="display-tab-add" title="Create another display session">+ New display</button>\n        </div>\n        <section id="stage" class="stage" aria-label="Android display">\n          <canvas id="screen" class="display-canvas" tabindex="0" aria-label="Mirrored Android screen"></canvas>\n          <div id="stage-hint" class="stage-hint">Connect an authorized Android phone over USB</div>\n        </section>\n      </div>\n    </section>\n''',
          )

          styles = Path('apps/web-client/static/styles.css')
          css = styles.read_text(encoding='utf-8')
          css += '''\n\n/* Multi-display Phase 4 live session tabs */\n.display-workspace { min-width: 0; width: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 0.5rem; }\n.display-tabbar { min-width: 0; display: flex; align-items: center; gap: 0.45rem; }\n.display-tabs { min-width: 0; flex: 1 1 auto; display: flex; align-items: stretch; gap: 0.3rem; overflow-x: auto; scrollbar-width: thin; }\n.display-tabs-empty { align-self: center; padding: 0.45rem 0.7rem; color: #71869d; font-size: 0.78rem; }\n.display-tab { flex: 0 0 auto; min-width: 8.5rem; max-width: 15rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; border: 1px solid #243244; border-radius: 9px; background: #0b1220; overflow: hidden; }\n.display-tab[data-active="true"] { border-color: #22d3ee; background: #0f1d31; box-shadow: inset 0 -2px 0 #22d3ee; }\n.display-tab-select, .display-tab-close, .display-tab-add { box-shadow: none !important; }\n.display-tab-select { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; column-gap: 0.42rem; row-gap: 0.05rem; padding: 0.43rem 0.55rem !important; border: 0 !important; border-radius: 0 !important; background: transparent !important; text-align: left; }\n.display-tab-select:hover { background: rgba(59, 130, 246, .08) !important; }\n.display-tab-kind { grid-row: 1 / 3; color: #22d3ee; font-size: 0.72rem; font-weight: 800; }\n.display-tab-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e6edf7; font-size: 0.78rem; font-weight: 700; }\n.display-tab-meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #71869d; font-size: 0.64rem; font-weight: 600; }\n.display-tab-close { width: 1.8rem; min-width: 1.8rem; padding: 0 !important; border: 0 !important; border-left: 1px solid #243244 !important; border-radius: 0 !important; background: transparent !important; color: #8fa4b8 !important; font-size: 1rem; }\n.display-tab-close:hover { color: #ffdce4 !important; background: rgba(251, 113, 133, .12) !important; }\n.display-tab-add { flex: 0 0 auto; min-height: 2.35rem; padding: 0.42rem 0.7rem !important; color: #bdeefa !important; border-color: #334155 !important; background: #0f172a !important; white-space: nowrap; }\n.display-canvas { display: block; max-width: 100%; max-height: calc(100vh - 112px); width: auto; height: auto; outline: none; touch-action: none; cursor: default; background: #020304; z-index: 2; }\n.display-canvas[hidden] { display: none !important; }\n.display-canvas:focus { box-shadow: 0 0 0 2px #22d3ee; }\n@media (max-width: 700px) { .display-tab-add { padding-inline: 0.5rem !important; } .display-tab { min-width: 7.4rem; } }\n'''
          styles.write_text(css, encoding='utf-8')

          # ---- main.ts element wiring ----
          main = Path('apps/web-client/src/main.ts')
          replace_once(
              main,
              '      canvas: required<HTMLCanvasElement>("#screen"),\n      stage: required<HTMLElement>("#stage"),\n',
              '      canvas: required<HTMLCanvasElement>("#screen"),\n      stage: required<HTMLElement>("#stage"),\n      stageHint: required<HTMLElement>("#stage-hint"),\n      tabs: required<HTMLElement>("#display-tabs"),\n      tabAdd: required<HTMLButtonElement>("#display-tab-add"),\n',
          )
          replace_once(
              main,
              '      displayMode: required<HTMLSelectElement>("#display-mode"),\n',
              '      displayName: required<HTMLInputElement>("#display-name"),\n      displayMode: required<HTMLSelectElement>("#display-mode"),\n',
          )

          # ---- Running Apps follows the active display tab ----
          running = Path('apps/web-client/src/running-app-controller.ts')
          replace_once(
              running,
              '  #timer: number | null = null;\n',
              '  #timer: number | null = null;\n  #activeSessionId: string | null = null;\n',
          )
          replace_once(
              running,
              '''    elements.device.addEventListener("change", () => void this.refresh());\n  }\n''',
              '''    elements.device.addEventListener("change", () => void this.refresh());\n    globalThis.addEventListener("droidwebdisplay-active-session", (event) => {\n      const detail = (event as CustomEvent<{ sessionId: string | null }>).detail;\n      this.#activeSessionId = detail?.sessionId ?? null;\n      void this.refresh(true);\n    });\n  }\n''',
          )
          replace_once(
              running,
              '      const [apps, sessions] = await Promise.all([this.#api.runningApps(serial), this.#api.sessions()]);\n      this.#apps = apps.apps;\n      this.#virtualSession = sessions.sessions.find((session) =>\n        session.serial === serial\n        && session.state === "running"\n        && session.displayMode === "virtual"\n        && typeof session.virtualDisplay.displayId === "number"\n      ) ?? null;\n',
              '''      const [apps, sessions] = await Promise.all([this.#api.runningApps(serial), this.#api.deviceSessions(serial)]);\n      this.#apps = apps.apps;\n      const virtualSessions = sessions.sessions.filter((session) =>\n        session.state === "running"\n        && session.displayMode === "virtual"\n        && typeof session.virtualDisplay.displayId === "number"\n      );\n      this.#virtualSession = virtualSessions.find((session) => session.sessionId === this.#activeSessionId)\n        ?? (this.#activeSessionId === null ? virtualSessions[0] ?? null : null);\n''',
          )

          # ---- Controller live runtime model ----
          controller = Path('apps/web-client/src/controller.ts')
          replace_once(
              controller,
              '  readonly canvas: HTMLCanvasElement;\n  readonly stage: HTMLElement;\n',
              '  readonly canvas: HTMLCanvasElement;\n  readonly stage: HTMLElement;\n  readonly stageHint: HTMLElement;\n  readonly tabs: HTMLElement;\n  readonly tabAdd: HTMLButtonElement;\n',
          )
          replace_once(
              controller,
              '  readonly displayMode: HTMLSelectElement;\n',
              '  readonly displayName: HTMLInputElement;\n  readonly displayMode: HTMLSelectElement;\n',
          )
          replace_once(
              controller,
              '}\n\nexport class DroidWebDisplayController {\n',
              '''}\n\ninterface DisplayRuntime {\n  serverSession: SessionDto;\n  readonly transport: WebSocketBridgeTransport;\n  readonly protocolSession: ScrcpyV41Session;\n  readonly renderer: WebCodecsVideoRenderer;\n  readonly audioPlayer: WebCodecsAudioPlayer;\n  readonly canvas: HTMLCanvasElement;\n  readonly values: DisplayFormValues;\n  audioTask: Promise<void> | null;\n  deviceMessageTask: Promise<void> | null;\n  latestStatistics: VideoStatistics | null;\n  latestAudioStatistics: AudioStatistics | null;\n  lastAndroidClipboard: string;\n  lastSentClipboard: string;\n}\n\nexport class DroidWebDisplayController {\n''',
          )
          replace_once(
              controller,
              '  #renderer: WebCodecsVideoRenderer;\n',
              '  readonly #baseRenderer: WebCodecsVideoRenderer;\n  #renderer: WebCodecsVideoRenderer;\n',
          )
          replace_once(
              controller,
              '  #lastRequestedSize: { width: number; height: number } | null = null;\n  readonly #clipboardAcks = new Map<bigint, ClipboardAckWaiter>();\n',
              '  #lastRequestedSize: { width: number; height: number } | null = null;\n  readonly #runtimes = new Map<string, DisplayRuntime>();\n  #activeSessionId: string | null = null;\n  readonly #clipboardAcks = new Map<bigint, ClipboardAckWaiter>();\n',
          )
          replace_once(
              controller,
              '''  public constructor(private readonly elements: Elements) {\n    this.#renderer = new WebCodecsVideoRenderer(elements.canvas, (stats) => this.updateStatistics(stats));\n    this.#audioPlayer = new WebCodecsAudioPlayer((stats) => this.updateAudioStatistics(stats));\n    this.populateProfiles();\n    this.bindEvents();\n  }\n''',
              '''  public constructor(private readonly elements: Elements) {\n    this.#baseRenderer = new WebCodecsVideoRenderer(\n      elements.canvas,\n      (stats) => this.updateRuntimeStatistics(elements.canvas.dataset.sessionId ?? null, stats),\n    );\n    this.#renderer = this.#baseRenderer;\n    this.#audioPlayer = new WebCodecsAudioPlayer(() => undefined);\n    this.populateProfiles();\n    this.bindEvents();\n    this.bindCanvasEvents(elements.canvas);\n    this.renderTabs();\n  }\n''',
          )

          connect_start = '  public async connect(): Promise<void> {\n'
          disconnect_marker = '  public async disconnect(): Promise<void> {\n'
          new_connect = '''  public async connect(): Promise<void> {\n    const serial = this.elements.device.value;\n    if (!serial) throw new Error("No authorized device is selected");\n    const existingSerial = this.firstRuntime()?.serverSession.serial ?? null;\n    if (existingSerial && existingSerial !== serial) {\n      throw new Error("Close the current device display tabs before selecting another Android device");\n    }\n    const values = this.readDisplayValues();\n    const errors = validateDisplayForm(values);\n    if (errors.length) throw new Error(errors.join(" "));\n    if (values.displayMode === "virtual" && !this.#capabilities?.virtualDisplaySupported) {\n      throw new Error(this.#capabilities?.warnings.join(" ") || "Virtual Display mode is not supported by this device.");\n    }\n\n    const explicitDisplayName = this.elements.displayName.value.trim();\n    const displayName = explicitDisplayName || this.automaticDisplayName(values);\n    let serverSession: SessionDto | null = null;\n    let transport: WebSocketBridgeTransport | null = null;\n    let protocolSession: ScrcpyV41Session | null = null;\n    let runtimeCanvas: HTMLCanvasElement | null = null;\n    let renderer: WebCodecsVideoRenderer | null = null;\n    let audioPlayer: WebCodecsAudioPlayer | null = null;\n\n    this.setBusy(true);\n    this.setStatus(\n      this.#runtimes.size ? "Adding display" : "Starting",\n      values.displayMode === "virtual" ? "Creating Android virtual display and opening browser channels…" : "Launching scrcpy and opening browser channels…",\n    );\n    try {\n      const request = {\n        ...buildSessionRequest(values, serial),\n        displayName,\n        audio: this.elements.audioEnabled.checked,\n        audioCodec: "opus",\n        audioBitRate: 128_000,\n      } as StartSessionRequest;\n      serverSession = await this.#api.startDeviceSession(serial, request);\n      runtimeCanvas = this.allocateRuntimeCanvas(serverSession.sessionId);\n      renderer = runtimeCanvas === this.elements.canvas\n        ? this.#baseRenderer\n        : new WebCodecsVideoRenderer(\n          runtimeCanvas,\n          (stats) => this.updateRuntimeStatistics(runtimeCanvas?.dataset.sessionId ?? null, stats),\n        );\n      audioPlayer = new WebCodecsAudioPlayer(\n        (stats) => this.updateRuntimeAudioStatistics(serverSession?.sessionId ?? null, stats),\n      );\n      audioPlayer.setMuted(true);\n      audioPlayer.setVolume(Number(this.elements.audioVolume.value) / 100);\n\n      transport = new WebSocketBridgeTransport(serverSession.sessionId);\n      protocolSession = await this.#adapter.connect(transport, {\n        video: true,\n        audio: this.elements.audioEnabled.checked,\n        control: true,\n      });\n\n      const runtime: DisplayRuntime = {\n        serverSession,\n        transport,\n        protocolSession,\n        renderer,\n        audioPlayer,\n        canvas: runtimeCanvas,\n        values,\n        audioTask: null,\n        deviceMessageTask: null,\n        latestStatistics: null,\n        latestAudioStatistics: null,\n        lastAndroidClipboard: "",\n        lastSentClipboard: "",\n      };\n      this.#runtimes.set(serverSession.sessionId, runtime);\n      this.renderTabs();\n\n      runtime.deviceMessageTask = this.consumeDeviceMessages(serverSession.sessionId, protocolSession);\n      void runtime.deviceMessageTask.catch((error: unknown) => {\n        if (this.#runtimes.has(serverSession!.sessionId)) console.warn("Control device-message stream ended", error);\n      });\n      void renderer.run(protocolSession).catch((error: unknown) => this.handleRuntimeFailure(serverSession!.sessionId, error));\n\n      if (this.elements.audioEnabled.checked && protocolSession.audioHeader) {\n        runtime.audioTask = audioPlayer.run(protocolSession);\n        void runtime.audioTask.catch((error: unknown) => {\n          if (this.#activeSessionId === serverSession!.sessionId) {\n            this.elements.audioStatus.textContent = `Audio unavailable: ${errorMessage(error)}. Video and control remain active.`;\n          }\n        });\n      }\n\n      if (values.displayMode === "virtual" && values.startApp) {\n        const payload = values.forceStopBeforeLaunch ? `+${values.startApp}` : values.startApp;\n        await protocolSession.sendControl({ type: ControlMessageType.StartApp, name: payload });\n        runtime.serverSession = await this.#api.recordApplicationLaunch(serverSession.sessionId, "sent");\n      }\n\n      this.activateRuntime(serverSession.sessionId);\n      this.#reconnectCount = 0;\n      this.renderTabs();\n    } catch (error) {\n      if (serverSession && this.#runtimes.has(serverSession.sessionId)) {\n        await this.cleanupRuntime(serverSession.sessionId);\n      } else {\n        renderer?.stop();\n        audioPlayer?.stop();\n        try {\n          await protocolSession?.close();\n        } catch {\n          await transport?.close();\n        }\n        if (runtimeCanvas) this.releaseRuntimeCanvas(runtimeCanvas);\n        if (serverSession) {\n          try {\n            await this.#api.stopDeviceSession(serial, serverSession.sessionId);\n          } catch {\n            // The WebSocket endpoint may already have stopped the failed session.\n          }\n        }\n      }\n      if (this.#serverSession) this.updateActiveRuntimeStatus();\n      else this.setStatus("Connection failed", errorMessage(error));\n      this.setConnectedControls(this.#serverSession !== null);\n      throw error;\n    } finally {\n      this.setBusy(false);\n      this.updateConnectAvailability();\n    }\n  }\n\n'''
          replace_block(controller, connect_start, disconnect_marker, new_connect)

          disconnect_start = '  public async disconnect(): Promise<void> {\n'
          bind_marker = '  private bindEvents(): void {\n'
          new_disconnect_helpers = '''  public async disconnect(): Promise<void> {\n    if (!this.#activeSessionId) return;\n    this.#manualDisconnect = true;\n    this.cancelReconnect();\n    this.#closing = true;\n    try {\n      const closingName = this.#serverSession?.display.name ?? "display";\n      await this.cleanupSession();\n      if (this.#serverSession) this.updateActiveRuntimeStatus();\n      else this.setStatus("Disconnected", `${closingName} was stopped. No display tabs remain.`);\n    } finally {\n      this.#closing = false;\n      this.setConnectedControls(this.#serverSession !== null);\n      this.#manualDisconnect = false;\n    }\n  }\n\n  public stopOnUnload(): void {\n    const serial = this.firstRuntime()?.serverSession.serial;\n    if (!serial) return;\n    void this.#api.stopDeviceSessions(serial, true);\n  }\n\n  private firstRuntime(): DisplayRuntime | null {\n    return this.#runtimes.values().next().value ?? null;\n  }\n\n  private automaticDisplayName(values: DisplayFormValues): string {\n    const sameKind = [...this.#runtimes.values()].filter((runtime) => runtime.serverSession.display.kind === values.displayMode);\n    if (values.displayMode === "physical") return sameKind.length ? `Phone ${sameKind.length + 1}` : "Phone";\n    const base = values.startApp === "com.openai.chatgpt"\n      ? "ChatGPT"\n      : values.startApp ? values.startApp.split(".").at(-1) || "Virtual display" : "Virtual display";\n    const duplicateCount = [...this.#runtimes.values()].filter((runtime) => runtime.serverSession.display.name.startsWith(base)).length;\n    return duplicateCount ? `${base} ${duplicateCount + 1}` : base;\n  }\n\n  private allocateRuntimeCanvas(sessionId: string): HTMLCanvasElement {\n    if (![...this.#runtimes.values()].some((runtime) => runtime.canvas === this.elements.canvas)) {\n      this.elements.canvas.dataset.sessionId = sessionId;\n      this.elements.canvas.hidden = false;\n      return this.elements.canvas;\n    }\n    const canvas = document.createElement("canvas");\n    canvas.className = "display-canvas";\n    canvas.tabIndex = 0;\n    canvas.setAttribute("aria-label", "Android display session");\n    canvas.dataset.sessionId = sessionId;\n    canvas.hidden = true;\n    this.bindCanvasEvents(canvas);\n    this.elements.stage.insertBefore(canvas, this.elements.stageHint);\n    return canvas;\n  }\n\n  private releaseRuntimeCanvas(canvas: HTMLCanvasElement): void {\n    canvas.dataset.sessionId = "";\n    canvas.hidden = true;\n    if (canvas !== this.elements.canvas) canvas.remove();\n    else if (this.#runtimes.size === 0) {\n      canvas.hidden = false;\n      const context = canvas.getContext?.("2d");\n      context?.clearRect(0, 0, canvas.width, canvas.height);\n    }\n  }\n\n  private bindCanvasEvents(canvas: HTMLCanvasElement): void {\n    canvas.addEventListener("contextmenu", (event) => event.preventDefault());\n    canvas.addEventListener("pointerdown", (event) => void this.pointer(event, 0));\n    canvas.addEventListener("pointermove", (event) => {\n      if (event.buttons !== 0) void this.pointer(event, 2);\n    });\n    canvas.addEventListener("pointerup", (event) => void this.pointer(event, 1));\n    canvas.addEventListener("pointercancel", (event) => void this.pointer(event, 3));\n    canvas.addEventListener("wheel", (event) => void this.scroll(event), { passive: false });\n    canvas.addEventListener("keydown", (event) => void this.keydown(event));\n    canvas.addEventListener("paste", (event) => {\n      const text = event.clipboardData?.getData("text/plain") ?? "";\n      if (!text) return;\n      event.preventDefault();\n      void this.runUiAction(() => this.pasteText(text, "Ctrl+V"));\n    });\n  }\n\n  private renderTabs(): void {\n    this.elements.tabs.replaceChildren();\n    if (!this.#runtimes.size) {\n      const empty = document.createElement("span");\n      empty.className = "display-tabs-empty";\n      empty.textContent = "No active displays";\n      this.elements.tabs.append(empty);\n      return;\n    }\n    const ids = [...this.#runtimes.keys()];\n    for (const [sessionId, runtime] of this.#runtimes) {\n      const identity = runtime.serverSession.display;\n      const item = document.createElement("div");\n      item.className = "display-tab";\n      item.dataset.active = String(sessionId === this.#activeSessionId);\n\n      const select = document.createElement("button");\n      select.type = "button";\n      select.className = "display-tab-select";\n      select.setAttribute("role", "tab");\n      select.setAttribute("aria-selected", String(sessionId === this.#activeSessionId));\n      select.dataset.sessionId = sessionId;\n      select.title = identity.application ? `${identity.name} · ${identity.application}` : identity.name;\n      const kind = document.createElement("span");\n      kind.className = "display-tab-kind";\n      kind.textContent = identity.kind === "physical" ? "PHONE" : "VD";\n      const name = document.createElement("span");\n      name.className = "display-tab-name";\n      name.textContent = identity.name;\n      const meta = document.createElement("span");\n      meta.className = "display-tab-meta";\n      meta.textContent = identity.kind === "physical"\n        ? "display 0 · live"\n        : `display ${identity.displayId ?? "…"} · live`;\n      select.append(kind, name, meta);\n      select.addEventListener("click", () => this.activateRuntime(sessionId));\n      select.addEventListener("keydown", (event) => {\n        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;\n        event.preventDefault();\n        const current = ids.indexOf(sessionId);\n        const offset = event.key === "ArrowRight" ? 1 : -1;\n        const next = ids[(current + offset + ids.length) % ids.length];\n        if (next) this.activateRuntime(next);\n      });\n\n      const close = document.createElement("button");\n      close.type = "button";\n      close.className = "display-tab-close