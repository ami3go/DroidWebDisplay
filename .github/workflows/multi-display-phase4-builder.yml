          api_text += '''\n\ntest("device-scoped display-session API supports tab lifecycle", async () => {\n  const calls = [];\n  const api = new BridgeApi("", async (url, init = {}) => {\n    calls.push({ url: String(url), init });\n    const method = init.method ?? "GET";\n    const payload = method === "GET"\n      ? { serial: "PHONE", activeSessionCount: 1, sessions: [] }\n      : method === "DELETE" && String(url).endsWith("/sessions")\n        ? { serial: "PHONE", stoppedCount: 1, sessions: [] }\n        : { sessionId: "S1", serial: "PHONE", state: "running", channels: ["video", "control"], options: {}, display: { name: "ChatGPT" } };\n    return new Response(JSON.stringify(payload), { status: method === "POST" ? 201 : 200, headers: { "content-type": "application/json" } });\n  });\n  await api.deviceSessions("PHONE");\n  await api.startDeviceSession("PHONE", { serial: "WRONG-IGNORED", displayName: "ChatGPT" });\n  await api.stopDeviceSession("PHONE", "S1");\n  await api.stopDeviceSessions("PHONE");\n  assert.deepEqual(calls.map((call) => call.url), [\n    "/api/v1/devices/PHONE/sessions",\n    "/api/v1/devices/PHONE/sessions",\n    "/api/v1/devices/PHONE/sessions/S1",\n    "/api/v1/devices/PHONE/sessions",\n  ]);\n  const createBody = JSON.parse(calls[1].init.body);\n  assert.equal(createBody.serial, "PHONE");\n  assert.equal(createBody.displayName, "ChatGPT");\n  assert.equal(calls[2].init.method, "DELETE");\n  assert.equal(calls[3].init.method, "DELETE");\n});\n'''
          api_test.write_text(api_text, encoding='utf-8')
          PY

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: packages/scrcpy-protocol
      - run: npm ci
        working-directory: apps/web-client
      - name: Run Python regression subset
        run: $HOME/.local/bin/uv run pytest -q tests/regression/session/test_device_session_api.py tests/regression/session/test_display_identity.py tests/regression/session/test_multi_session.py
      - name: Build protocol package
        run: npm run build
        working-directory: packages/scrcpy-protocol
      - name: Build web client
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Run web client tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Ruff correctness checks
        run: $HOME/.local/bin/uv run ruff check droid_web_display/api/app.py tests/regression/session/test_device_session_api.py --select E9,F63,F7,F82
      - name: Check OpenAPI
        run: $HOME/.local/bin/uv run python tools/generate_openapi.py --check
      - name: Commit Phase 4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src apps/web-client/static apps/web-client/tests apps/web-client/dist
          if git diff --cached --quiet; then
            echo "No Phase 4 changes to commit"
            exit 0
          fi
          git commit -m "Implement multi-display Phase 4 live browser tabs"
          git push origin HEAD:multi-display-tabs
