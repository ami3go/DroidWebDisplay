name: Apply Clipboard Hardening

on:
  push:
    branches: [agent/harden-clipboard-state]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json

      - name: Apply clipboard hardening patch
        run: python tools/apply_clipboard_hardening.py

      - name: Rebuild checked-in web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build

      - name: Install focused Python test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run clipboard regression tests
        run: python -m pytest -q tests/packaging/test_clipboard_sync_regression.py tests/regression/test_clipboard_copy_server_mode.py

      - name: Run web client unit tests
        working-directory: apps/web-client
        run: node tools/run-tests.mjs

      - name: Commit generated hardening changes and remove one-shot helpers
        shell: bash
        run: |
          set -euxo pipefail
          rm tools/apply_clipboard_hardening.py .github/workflows/apply-clipboard-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No clipboard hardening changes were produced"; exit 1; }
          git commit -m "Harden clipboard session state"
          git push origin HEAD:agent/harden-clipboard-state
