name: Multi-display Phase 5 Review v2

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  review-phase5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json

      - name: Apply reviewed Phase 5 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/multi-display-phase5-review.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              'reconnect_end = controller.index("private scheduleReconnect", reconnect_start)',
              'reconnect_end = controller.index("private browserSettings", reconnect_start)',
              1,
          )
          exec(compile(script, 'phase5-review-v2.py', 'exec'))
          PY

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: packages/scrcpy-protocol
      - run: npm ci
        working-directory: apps/web-client
      - name: Run reviewed Phase 5 Python tests
        run: |
          $HOME/.local/bin/uv run ruff check tools/run_bridge_service.py droid_web_display/config.py droid_web_display/scrcpy/session.py droid_web_display/api/app.py tests/regression/session/test_multi_session.py tests/regression/session/test_device_session_api.py tests/release/test_multi_display_phase5_release.py --select E9,F63,F7,F82
          $HOME/.local/bin/uv run pytest -q tests/regression/session/test_multi_session.py tests/regression/session/test_device_session_api.py tests/release/test_multi_display_phase5_release.py
      - name: Build protocol package
        run: npm run build
        working-directory: packages/scrcpy-protocol
      - name: Build web client
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Run web client tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Verify bundled static client
        run: |
          $HOME/.local/bin/uv run python - <<'PY'
          from pathlib import Path
          from droid_web_display.release_checks import verify_static_client
          result = verify_static_client(Path.cwd())
          print(result)
          if result.get("status") != "PASS":
              raise SystemExit(1)
          PY
      - name: Commit Phase 5 review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_bridge_service.py apps/web-client/src/controller.ts apps/web-client/dist-manifest.json tests/regression/session/test_multi_session.py tests/release/test_multi_display_phase5_release.py docs/MULTI_DISPLAY_PHASE5.md
          git add -f apps/web-client/dist
          if git diff --cached --quiet; then
            echo "No reviewed Phase 5 changes to commit"
            exit 0
          fi
          git commit -m "Harden multi-display Phase 5 qualification"
          git push origin HEAD:multi-display-tabs
