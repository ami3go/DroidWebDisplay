name: Rebuild optimized response runtime

on:
  push:
    branches: [optimized-reponce-time]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[response-dist]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimized-reponce-time
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: packages/scrcpy-protocol
      - run: npm run clean && npm run build
        working-directory: packages/scrcpy-protocol
      - run: npm ci
        working-directory: apps/web-client
      - run: npm run build
        working-directory: apps/web-client
      - name: Refresh OpenAPI
        run: $HOME/.local/bin/uv run python tools/generate_openapi.py
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/scrcpy-protocol/dist apps/web-client/dist apps/web-client/dist-manifest.json packages/bridge-api/openapi/openapi-v1.json
          if git diff --cached --quiet; then
            echo "Generated runtime already current."
            exit 0
          fi
          git commit -m "Rebuild optimized response runtime [response-dist]"
          git push origin HEAD:optimized-reponce-time
