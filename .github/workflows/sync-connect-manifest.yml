name: Sync Connect Manifest

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/sync-connect-manifest.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - name: Refresh Connect CSS manifest entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('apps/web-client')
          manifest_path = root / 'dist-manifest.json'
          css_path = root / 'dist/droidwebdisplay-connect-drawer.css'
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          raw = css_path.read_bytes()
          for item in data['files']:
              if item['path'] == 'droidwebdisplay-connect-drawer.css':
                  item['bytes'] = len(raw)
                  item['sha256'] = hashlib.sha256(raw).hexdigest()
                  break
          else:
              raise SystemExit('manifest entry not found')
          manifest_path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/dist-manifest.json
          git commit -m "Sync Connect drawer manifest"
          git push origin HEAD:agent/connect-drawer
