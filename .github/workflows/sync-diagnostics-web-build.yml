name: Sync diagnostics web build

on:
  push:
    branches:
      - work/diagnostics-storage

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/diagnostics-storage
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - run: npm ci
        working-directory: packages/scrcpy-protocol
      - run: npm ci
        working-directory: apps/web-client
      - run: npm run build
        working-directory: apps/web-client
      - name: Commit generated web client
        run: |
          if git diff --quiet -- apps/web-client/dist apps/web-client/dist-manifest.json; then
            echo "Generated web client is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/web-client/dist
          git add apps/web-client/dist-manifest.json
          git commit -m "Rebuild bundled web client"
          git push origin HEAD:work/diagnostics-storage
