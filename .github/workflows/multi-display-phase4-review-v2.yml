name: Multi-display Phase 4 Review v2

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  review-phase4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json

      - name: Apply review patch and updated regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/multi-display-phase4-review.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'phase4-review.py', 'exec'))

          path = Path('apps/web-client/tests/layout.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = '  assert.match(controllerSource, /pollPcClipboard[\\s\\S]*synchronizePcClipboard\\(text\\)/);\n'
          new = '  assert.match(controllerSource, /pollPcClipboard[\\s\\S]*synchronizePcClipboard\\(text, sessionId, session\\)/);\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy clipboard assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - run: npm ci
        working-directory: apps/web-client
      - name: Build web client
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Run web client tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/controller.ts apps/web-client/tests/layout.test.mjs
          git add -f apps/web-client/dist
          git commit -m "Isolate multi-display canvas and clipboard lifecycles"
          git push origin HEAD:multi-display-tabs
