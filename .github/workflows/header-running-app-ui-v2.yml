name: Apply Running App Header UI

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/header-running-app-ui-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch header UI API diagnostics and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label} not found in {path_name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'apps/web-client/src/types.ts',
              'export interface RunningAppsResponse {\n  readonly serial: string;\n  readonly apps: readonly RunningGuiAppDto[];\n  readonly moveStrategy: "start-activity-on-display";\n}',
              'export interface RunningAppsResponse {\n  readonly serial: string;\n  readonly apps: readonly RunningGuiAppDto[];\n  readonly moveStrategy: "start-activity-on-display";\n  readonly freeMemoryBytes: number | null;\n}',
              'RunningAppsResponse',
          )

          replace(
              'apps/web-client/src/main.ts',
              '    const runningAppController = new RunningAppController({\n      device: required<HTMLSelectElement>("#device"),\n      select: required<HTMLSelectElement>("#running-app-select"),\n      refresh: required<HTMLButtonElement>("#running-app-refresh"),\n      move: required<HTMLButtonElement>("#running-app-move"),\n      status: required<HTMLElement>("#running-app-status"),\n    });',
              '    const runningAppController = new RunningAppController({\n      device: required<HTMLSelectElement>("#device"),\n      select: required<HTMLSelectElement>("#running-app-select"),\n      refresh: required<HTMLButtonElement>("#running-app-refresh"),\n      count: required<HTMLElement>("#running-app-count"),\n      status: required<HTMLElement>("#running-app-status"),\n      diagnosticDisplay: required<HTMLElement>("#diagnostic-display"),\n      diagnosticRam: required<HTMLElement>("#diagnostic-ram"),\n    });',
              'RunningAppController wiring',
          )

          path = Path('droid_web_display/adb/client.py')
          text = path.read_text(encoding='utf-8')
          marker = '    async def list_running_gui_apps(self, serial: str) -> list[RunningGuiApp]:\n'
          if marker not in text:
              raise SystemExit('list_running_gui_apps marker not found')
          method = '    async def free_memory_bytes(self, serial: str) -> int | None:\n        result = await self.shell(serial, "cat", "/proc/meminfo", check=False, timeout=10.0)\n        if result.returncode != 0:\n            return None\n        for raw in result.stdout.splitlines():\n            match = re.match(r"^MemAvailable:\\s+(\\d+)\\s+kB$", raw.strip(), re.IGNORECASE)\n            if match:\n                return int(match.group(1)) * 1024\n        return None\n\n'
          path.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')

          replace(
              'droid_web_display/api/app.py',
              '        await container.manager.select_device(serial)\n        values = await container.adb.list_running_gui_apps(serial)\n        return {\n            "serial": serial,\n            "apps": [item.to_dict() for item in values],\n            "moveStrategy": "start-activity-on-display",\n        }',
              '        await container.manager.select_device(serial)\n        values = await container.adb.list_running_gui_apps(serial)\n        free_memory_bytes = await container.adb.free_memory_bytes(serial)\n        return {\n            "serial": serial,\n            "apps": [item.to_dict() for item in values],\n            "moveStrategy": "start-activity-on-display",\n            "freeMemoryBytes": free_memory_bytes,\n        }',
              'running apps API body',
          )

          path = Path('apps/web-client/static/index.html')
          text = path.read_text(encoding='utf-8')
          old = '          <button id="fullscreen" class="secondary compact" disabled>Fullscreen</button>\n        </div>'
          new = '          <button id="fullscreen" class="secondary compact" disabled>Fullscreen</button>\n        </div>\n        <div class="running-app-header" aria-label="Running Android applications">\n          <span class="running-app-header-icon" aria-hidden="true" title="Running application">\n            <svg viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>\n          </span>\n          <select id="running-app-select" aria-label="Running Android application" title="Selecting an application moves it to the active virtual display" disabled>\n            <option value="">No GUI apps</option>\n          </select>\n          <button id="running-app-refresh" type="button" class="secondary compact running-app-refresh" aria-label="Refresh running applications, 0 found" title="Refresh running applications (0 found)"><span aria-hidden="true">↻</span><span id="running-app-count">0</span></button>\n          <span id="running-app-status" class="visually-hidden" aria-live="polite">Start a virtual display to move applications.</span>\n        </div>'
          if old not in text:
              raise SystemExit('fullscreen insertion point not found')
          text = text.replace(old, new, 1)
          text, rail_count = re.subn(r'\n\s*<button type="button" class="gb-rail-button" data-group="apps"[^\n]*</button>', '', text, count=1)
          text, slot_count = re.subn(r'\n\s*<div class="gb-drawer-slot" data-slot="apps">.*?</section></div>', '', text, count=1, flags=re.S)
          if rail_count != 1 or slot_count != 1:
              raise SystemExit(f'Apps UI removal failed rail={rail_count} slot={slot_count}')
          old_diag = '          <div class="gb-drawer-slot" data-slot="diagnostics"><section class="help-card statistics-card">\n          <h2>Mode statistic</h2>\n          <div id="statistics" class="statistics">No video statistics</div>\n        </section></div>'
          new_diag = '          <div class="gb-drawer-slot" data-slot="diagnostics"><section class="help-card statistics-card">\n          <h2>Mode statistic</h2>\n          <div class="device-diagnostic-summary" aria-label="Android device diagnostics">\n            <div><span>Display</span><strong id="diagnostic-display">—</strong></div>\n            <div><span>Free RAM</span><strong id="diagnostic-ram">—</strong></div>\n          </div>\n          <div id="statistics" class="statistics">No video statistics</div>\n        </section></div>'
          if old_diag not in text:
              raise SystemExit('diagnostics block not found')
          path.write_text(text.replace(old_diag, new_diag, 1), encoding='utf-8')

          replace(
              'apps/web-client/static/droidwebdisplay-main-drawer.js',
              "const GROUPS = ['display','clipboard','files','apps','audio','access','network','diagnostics','settings'];",
              "const GROUPS = ['display','clipboard','files','audio','access','network','diagnostics','settings'];",
              'drawer group order',
          )
          path = Path('apps/web-client/static/droidwebdisplay-main-drawer.js')
          path.write_text(path.read_text(encoding='utf-8').replace('controller v1.3.0', 'controller v1.4.0', 1), encoding='utf-8')

          path = Path('apps/web-client/static/styles.css')
          text = path.read_text(encoding='utf-8')
          marker = '.android-control-row button { background: #202838; }\n'
          css = '.running-app-header { height: 2.12rem; min-height: 2.12rem; margin-left: auto; display: flex; align-items: center; gap: 0.3rem; flex: 0 0 auto; }\n.running-app-header-icon { width: 2.12rem; height: 2.12rem; flex: 0 0 2.12rem; display: grid; place-items: center; color: #9fb0c2; }\n.running-app-header-icon svg { width: 1.12rem; height: 1.12rem; fill: currentColor; }\n.connection-row .running-app-header select { width: clamp(10rem, 18vw, 16rem); min-width: 10rem; max-width: 16rem; height: 2.12rem; min-height: 2.12rem; flex: 0 1 16rem; padding: 0.42rem 1.8rem 0.42rem 0.58rem; border-radius: 8px; font-size: 0.76rem; }\n.connection-row .running-app-refresh { min-width: 3.05rem; width: auto; height: 2.12rem; min-height: 2.12rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; padding-inline: 0.52rem; }\n#running-app-count { min-width: 1ch; font-variant-numeric: tabular-nums; text-align: right; }\n.device-diagnostic-summary { margin: 0.65rem 0 0.45rem; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem; }\n.device-diagnostic-summary > div { min-width: 0; padding: 0.5rem 0.58rem; border: 1px solid #30394b; border-radius: 9px; background: #101620; display: grid; gap: 0.18rem; }\n.device-diagnostic-summary span { color: #8f9bb0; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; }\n.device-diagnostic-summary strong { color: #e4eaf5; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n'
          if marker not in text:
              raise SystemExit('header CSS marker not found')
          path.write_text(text.replace(marker, marker + css, 1), encoding='utf-8')

          path = Path('apps/web-client/tests/layout.test.mjs')
          text = path.read_text(encoding='utf-8')
          source_marker = 'const controllerSource = await readFile(resolve(root, "src/controller.ts"), "utf8");'
          if source_marker not in text:
              raise SystemExit('layout source marker missing')
          text = text.replace(source_marker, source_marker + '\nconst runningAppSource = await readFile(resolve(root, "src/running-app-controller.ts"), "utf8");', 1)
          pattern = re.compile(r'test\("running applications panel is native to the Apps drawer", \(\) => \{.*?\n\}\);', re.S)
          replacement = 'test("running applications are compact header controls with automatic relocation", () => {\n  const headerStart = html.indexOf(\'<header class="topbar">\');\n  const headerEnd = html.indexOf(\'</header>\', headerStart);\n  const header = html.slice(headerStart, headerEnd);\n  const fullscreen = header.indexOf(\'id="fullscreen"\');\n  const icon = header.indexOf(\'class="running-app-header-icon"\');\n  const select = header.indexOf(\'id="running-app-select"\');\n  const refresh = header.indexOf(\'id="running-app-refresh"\');\n  assert.ok(fullscreen >= 0 && icon > fullscreen && select > icon && refresh > select);\n  assert.match(header, /id="running-app-count">0<\\/span>/);\n  assert.equal(html.includes(\'data-group="apps"\'), false);\n  assert.equal(html.includes(\'data-slot="apps"\'), false);\n  assert.equal(html.includes(\'id="running-app-move"\'), false);\n  assert.match(runningAppSource, /select\\.addEventListener\\("change", \\(\\) => void this\\.moveSelected\\(\\)\\)/);\n  assert.match(runningAppSource, /count\\.textContent = String\\(this\\.#apps\\.length\\)/);\n  assert.match(css, /\\.running-app-header \\{ height: 2\\.12rem; min-height: 2\\.12rem;/);\n});'
          text, test_count = pattern.subn(replacement, text, count=1)
          if test_count != 1:
              raise SystemExit('old running apps layout test not found')
          path.write_text(text, encoding='utf-8')

          replace(
              'tests/release/test_drawer_icon_order.py',
              'EXPECTED_ORDER = "[\'display\',\'clipboard\',\'files\',\'apps\',\'audio\',\'access\',\'network\',\'diagnostics\',\'settings\']"',
              'EXPECTED_ORDER = "[\'display\',\'clipboard\',\'files\',\'audio\',\'access\',\'network\',\'diagnostics\',\'settings\']"',
              'release drawer order',
          )

          path = Path('tests/regression/automation/test_running_apps.py')
          text = path.read_text(encoding='utf-8')
          marker = '    async def list_running_gui_apps(self, serial: str) -> list[RunningGuiApp]:\n        return list(self.apps)\n'
          if marker not in text:
              raise SystemExit('running apps fake marker missing')
          text = text.replace(marker, marker + '\n    async def free_memory_bytes(self, serial: str) -> int | None:\n        return 3 * 1024 * 1024 * 1024\n', 1)
          marker = '        assert listed.json()["apps"][0]["taskId"] == 42\n'
          if marker not in text:
              raise SystemExit('running apps assertion marker missing')
          path.write_text(text.replace(marker, marker + '        assert listed.json()["freeMemoryBytes"] == 3 * 1024 * 1024 * 1024\n', 1), encoding='utf-8')
          PY

      - name: Add focused header regression
        run: |
          cat > apps/web-client/tests/running-app-header.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { fileURLToPath } from "node:url";
          import { dirname, resolve } from "node:path";

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const html = await readFile(resolve(root, "static/index.html"), "utf8");
          const source = await readFile(resolve(root, "src/running-app-controller.ts"), "utf8");
          const types = await readFile(resolve(root, "src/types.ts"), "utf8");

          test("Diagnostics expose active display and available Android RAM", () => {
            assert.match(html, /id="diagnostic-display">—<\/strong>/);
            assert.match(html, /id="diagnostic-ram">—<\/strong>/);
            assert.match(source, /diagnosticDisplay\.textContent/);
            assert.match(source, /diagnosticRam\.textContent/);
            assert.match(types, /readonly freeMemoryBytes: number \| null;/);
          });

          test("GUI task counter remains digits only", () => {
            assert.match(html, /id="running-app-count">0<\/span>/);
            assert.match(source, /count\.textContent = String\(this\.#apps\.length\)/);
          });
          EOF

      - name: Build protocol
        working-directory: packages/scrcpy-protocol
        run: npm ci && npm run build

      - name: Build and test web client
        working-directory: apps/web-client
        run: npm ci && npm test

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev

      - name: Run full release gate
        run: $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-header-running-app.json

      - name: Commit verified UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/header-running-app-ui-v2.yml
          git add -u
          git add apps/web-client/tests/running-app-header.test.mjs
          git add -f apps/web-client/dist
          git add apps/web-client/dist-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Move running app controls to header"
          git push origin HEAD:agent/connect-drawer
