name: Native DroidWebDisplay UI Migration

on:
  push:
    branches:
      - fix/native-droidwebdisplay-ui

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-droidwebdisplay-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Fix clipboard migration boundary and apply native UI migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/native_ui_migration.py')
          text = path.read_text(encoding='utf-8')
          old = '    clipboard = card(html, \'<div class="help-card clipboard-card">\', "</div>")\n'
          new = '''    clipboard_start = html.index('<div class="help-card clipboard-card">')\n    clipboard_end = html.index('<section class="help-card transfer-section">', clipboard_start)\n    clipboard = html[clipboard_start:clipboard_end].strip()\n'''
          if old not in text:
              raise SystemExit('clipboard migration anchor not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/native_ui_migration.py
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - name: Install protocol dependencies
        run: npm ci
        working-directory: packages/scrcpy-protocol
      - name: Build protocol
        run: npm run build
        working-directory: packages/scrcpy-protocol
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web-client
      - name: Build and test web client
        run: npm test
        working-directory: apps/web-client
      - name: Run branding and UI regression tests
        run: $HOME/.local/bin/uv run pytest -q tests/ux/test_droidwebdisplay_branding.py tests/security/test_connection_toolbar_layout.py
      - name: Verify generated web distribution
        run: |
          test -f apps/web-client/dist/index.html
          grep -q 'droidwebdisplay-native-single-drawer-v1' apps/web-client/dist/index.html
          grep -q 'id="clipboard-auto-sync"' apps/web-client/dist/index.html
          grep -q 'id="clipboard-max-kib"' apps/web-client/dist/index.html
          ! grep -Eqi 'GptBridge|GPT Bridge|Gpt-Bridge|gpt_bridge|gpt-bridge|gptBridge' apps/web-client/dist/index.html
          ! grep -q 'id="workspace-layout"' apps/web-client/dist/index.html
          ! grep -q '<aside class="sidepanel">' apps/web-client/dist/index.html
          ! grep -q '<aside class="transfer-panel"' apps/web-client/dist/index.html
      - name: Commit migrated source and generated dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/native_ui_migration.py .github/workflows/native-ui-migration.yml
          git add -A
          git commit -m 'Make DroidWebDisplay single drawer native'
          git push origin HEAD:fix/native-droidwebdisplay-ui
