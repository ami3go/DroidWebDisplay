name: Apply Resizable UI

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/apply-resizable-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare target branch and helper
        run: |
          cp .github/scripts/apply_resizable_ui.py /tmp/apply_resizable_ui.py
          git fetch origin agent/resizable-drawer-file-columns
          git checkout -B agent/resizable-drawer-file-columns origin/agent/resizable-drawer-file-columns
          test "$(git rev-parse HEAD)" = "893dba0c5446969fa20138f001db144537eedef8"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
      - name: Apply and verify resizable drawer
        run: |
          python /tmp/apply_resizable_ui.py drawer
          npm run build --prefix apps/web-client
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-resizable-drawer.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web-client
          git commit -m "Make drawer width resizable"
      - name: Apply and verify resizable Explorer columns
        run: |
          python /tmp/apply_resizable_ui.py columns
          npm run build --prefix apps/web-client
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-resizable-columns.json
          git add -A apps/web-client
          git commit -m "Make File Explorer columns resizable"
      - name: Publish verified commits
        run: git push origin HEAD:agent/resizable-drawer-file-columns
