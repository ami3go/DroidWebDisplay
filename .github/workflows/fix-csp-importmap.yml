name: Repair CSP import-map hash

on:
  push:
    branches:
      - fix/csp-importmap-auth-bootstrap

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix CSP import-map hash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csp-importmap-auth-bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair CSP and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('droid_web_display/api/app.py')
          app = app_path.read_text(encoding='utf-8')
          old = "sha256-4dO+HdOGICFC5JOvaEBsNT4DSnMORzt+qUR0T/Q3lng="
          new = "sha256-0u7HdijpKCtbMJSF/CxBDiwEw6/NSTMjgCYEMe9Byl0="
          if old not in app:
              raise SystemExit(f'Expected old CSP hash not found: {old}')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/release/test_csp_inline_scripts.py')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''from __future__ import annotations

import base64
import hashlib
from pathlib import Path
import re


ROOT = Path(__file__).resolve().parents[2]


def test_server_csp_allows_every_inline_web_script() -> None:
    html = (ROOT / "apps" / "web-client" / "dist" / "index.html").read_text(encoding="utf-8")
    app_source = (ROOT / "droid_web_display" / "api" / "app.py").read_text(encoding="utf-8")
    inline_scripts = re.findall(r"<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>", html, flags=re.DOTALL | re.IGNORECASE)
    assert inline_scripts, "Expected at least one inline script/import map in dist/index.html"
    for script in inline_scripts:
        digest = base64.b64encode(hashlib.sha256(script.encode("utf-8")).digest()).decode("ascii")
        assert f"sha256-{digest}" in app_source, f"CSP is missing hash for current inline script: sha256-{digest}"


def test_droidwebdisplay_import_map_hash_is_current() -> None:
    html = (ROOT / "apps" / "web-client" / "dist" / "index.html").read_text(encoding="utf-8")
    match = re.search(r"<script[^>]*type=[\\\"']importmap[\\\"'][^>]*>(.*?)</script>", html, flags=re.DOTALL | re.IGNORECASE)
    assert match is not None
    assert "@droid-web-display/scrcpy-protocol" in match.group(1)
    digest = base64.b64encode(hashlib.sha256(match.group(1).encode("utf-8")).digest()).decode("ascii")
    assert digest == "0u7HdijpKCtbMJSF/CxBDiwEw6/NSTMjgCYEMe9Byl0="
''', encoding='utf-8')
          PY
      - name: Verify repair
        shell: bash
        run: |
          python -m py_compile droid_web_display/api/app.py tests/release/test_csp_inline_scripts.py
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          import re

          html = Path('apps/web-client/dist/index.html').read_text(encoding='utf-8')
          app = Path('droid_web_display/api/app.py').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.DOTALL | re.IGNORECASE)
          assert scripts
          for script in scripts:
              digest = base64.b64encode(hashlib.sha256(script.encode('utf-8')).digest()).decode('ascii')
              assert f'sha256-{digest}' in app, digest
          print('CSP inline-script hashes match dist/index.html')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add droid_web_display/api/app.py tests/release/test_csp_inline_scripts.py
          git commit -m "Fix CSP import-map hash"
          git push origin HEAD:fix/csp-importmap-auth-bootstrap
