name: Simplify Running App Dropdown

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/simplify-running-app-dropdown.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch header wiring styles and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label} not found in {path_name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'apps/web-client/src/main.ts',
              '      refresh: required<HTMLButtonElement>("#running-app-refresh"),\n      count: required<HTMLElement>("#running-app-count"),',
              '      icon: required<HTMLElement>("#running-app-icon"),\n      count: required<HTMLElement>("#running-app-count"),',
              'running app main wiring',
          )

          replace(
              'apps/web-client/static/index.html',
              '''          <span class="running-app-header-icon" aria-hidden="true" title="Running application">\n            <svg viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>\n          </span>\n          <select id="running-app-select" aria-label="Running Android application" title="Selecting an application moves it to the active virtual display" disabled>\n            <option value="">No GUI apps</option>\n          </select>\n          <button id="running-app-refresh" type="button" class="secondary compact running-app-refresh" aria-label="Refresh running applications, 0 found" title="Refresh running applications (0 found)"><span aria-hidden="true">↻</span><span id="running-app-count">0</span></button>''',
              '''          <span id="running-app-icon" class="running-app-header-icon" aria-hidden="true" title="0 running GUI task(s)">\n            <svg viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>\n            <span id="running-app-count" class="running-app-count">0</span>\n          </span>\n          <select id="running-app-select" aria-label="Running Android application" title="Open to refresh running apps; selecting one moves it to the active virtual display" disabled>\n            <option value="">No GUI apps</option>\n          </select>''',
              'running app header block',
          )

          path = Path('apps/web-client/static/styles.css')
          text = path.read_text(encoding='utf-8')
          old = '.running-app-header-icon { width: 2.12rem; height: 2.12rem; flex: 0 0 2.12rem; display: grid; place-items: center; color: #9fb0c2; }\n.running-app-header-icon svg { width: 1.12rem; height: 1.12rem; fill: currentColor; }\n.connection-row .running-app-header select { width: clamp(10rem, 18vw, 16rem); min-width: 10rem; max-width: 16rem; height: 2.12rem; min-height: 2.12rem; flex: 0 1 16rem; padding: 0.42rem 1.8rem 0.42rem 0.58rem; border-radius: 8px; font-size: 0.76rem; }\n.connection-row .running-app-refresh { min-width: 3.05rem; width: auto; height: 2.12rem; min-height: 2.12rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; padding-inline: 0.52rem; }\n#running-app-count { min-width: 1ch; font-variant-numeric: tabular-nums; text-align: right; }'
          new = '.running-app-header-icon { position: relative; width: 2.12rem; height: 2.12rem; flex: 0 0 2.12rem; display: grid; place-items: center; color: #9fb0c2; }\n.running-app-header-icon svg { width: 1.12rem; height: 1.12rem; fill: currentColor; }\n.running-app-count { position: absolute; top: 0.05rem; right: 0.02rem; min-width: 0.9rem; height: 0.9rem; padding: 0 0.18rem; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #516078; border-radius: 999px; background: #202838; color: #eef3ff; font-size: 0.55rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; box-shadow: 0 1px 4px #0008; }\n.connection-row .running-app-header select { width: clamp(10rem, 18vw, 16rem); min-width: 10rem; max-width: 16rem; height: 2.12rem; min-height: 2.12rem; flex: 0 1 16rem; padding: 0.42rem 1.8rem 0.42rem 0.58rem; border-radius: 8px; font-size: 0.76rem; }'
          if old not in text:
              raise SystemExit('running app header CSS block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'apps/web-client/tests/layout.test.mjs',
              '''  const refresh = header.indexOf('id="running-app-refresh"');\n  assert.ok(fullscreen >= 0 && icon > fullscreen && select > icon && refresh > select);\n  assert.match(header, /id="running-app-count">0<\\/span>/);''',
              '''  assert.ok(fullscreen >= 0 && icon > fullscreen && select > icon);\n  assert.match(header, /id="running-app-count" class="running-app-count">0<\\/span>/);\n  assert.equal(header.includes('id="running-app-refresh"'), false);''',
              'layout refresh button assertions',
          )
          replace(
              'apps/web-client/tests/layout.test.mjs',
              '  assert.match(runningAppSource, /count\\.textContent = String\\(this\\.#apps\\.length\\)/);\n  assert.match(css, /\\.running-app-header \\{ height: 2\\.12rem; min-height: 2\\.12rem;/);',
              '  assert.match(runningAppSource, /select\\.addEventListener\\("pointerdown", \\(\\) => void this\\.refreshIfStale\\(\\)\\)/);\n  assert.match(runningAppSource, /select\\.addEventListener\\("focus", \\(\\) => void this\\.refreshIfStale\\(\\)\\)/);\n  assert.match(runningAppSource, /count\\.textContent = String\\(this\\.#apps\\.length\\)/);\n  assert.match(css, /\\.running-app-header \\{ height: 2\\.12rem; min-height: 2\\.12rem;/);\n  assert.match(css, /\\.running-app-count \\{ position: absolute;/);',
              'layout stale refresh assertions',
          )

          path = Path('apps/web-client/tests/running-app-header.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''test("GUI task counter remains digits only", () => {\n  assert.match(html, /id="running-app-count">0<\\/span>/);\n  assert.match(source, /count\\.textContent = String\\(this\\.#apps\\.length\\)/);\n});'''
          new = '''test("GUI task counter is a digits-only badge on the app icon", () => {\n  assert.match(html, /id="running-app-icon" class="running-app-header-icon"/);\n  assert.match(html, /id="running-app-count" class="running-app-count">0<\\/span>/);\n  assert.equal(html.includes('id="running-app-refresh"'), false);\n  assert.match(source, /count\\.textContent = String\\(this\\.#apps\\.length\\)/);\n});\n\ntest("opening the app dropdown refreshes stale GUI tasks", () => {\n  assert.match(source, /DROPDOWN_REFRESH_STALE_MS = 1500/);\n  assert.match(source, /select\\.addEventListener\\("pointerdown", \\(\\) => void this\\.refreshIfStale\\(\\)\\)/);\n  assert.match(source, /select\\.addEventListener\\("focus", \\(\\) => void this\\.refreshIfStale\\(\\)\\)/);\n  assert.match(source, /Date\\.now\\(\\) - this\\.#lastRefreshAt < DROPDOWN_REFRESH_STALE_MS/);\n});'''
          if old not in text:
              raise SystemExit('running app counter test not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Build and test web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm test

      - name: Install uv and run release gate
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output evidence/release/gate-app-dropdown.json

      - name: Commit verified dropdown UI and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simplify-running-app-dropdown.yml
          git add -u
          git add apps/web-client/tests/running-app-header.test.mjs
          git commit -m "Simplify running app dropdown refresh"
          git push origin HEAD:agent/connect-drawer
