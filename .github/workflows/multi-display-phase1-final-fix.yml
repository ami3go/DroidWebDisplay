name: Multi-display Phase 1 Final Fix

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore channel conflict import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('droid_web_display/scrcpy/session.py')
          text = path.read_text(encoding='utf-8')
          needle = '    MultipleDevicesError,\n'
          replacement = '    MultipleDevicesError,\n    SessionConflictError,\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one import anchor, found {text.count(needle)}')
          if '    SessionConflictError,\n' in text:
              raise SystemExit('SessionConflictError already imported')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          python -m compileall -q droid_web_display/scrcpy/session.py
      - name: Commit final fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add droid_web_display/scrcpy/session.py
          git commit -m "Restore channel attachment conflict handling"
          git push origin HEAD:multi-display-tabs
