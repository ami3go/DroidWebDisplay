name: Apply Files drawer layout fix

on:
  push:
    branches:
      - fix/files-drawer-layout

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix Files drawer layout density'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/files-drawer-layout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compact Files drawer CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-client/static/droidwebdisplay-main-drawer.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Files drawer compact explorer layout v1 */'
          patch = r'''
          /* Files drawer compact explorer layout v1 */
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .gb-accordion-content {
            display: grid;
            gap: .52rem;
            min-width: 0;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .gb-accordion-content > label,
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-options label {
            display: grid;
            gap: .28rem;
            min-width: 0;
            color: #9fb0c2;
            font-size: .76rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] select,
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] input:not([type="checkbox"]):not([type="file"]) {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            padding: .48rem .58rem;
            font-size: .76rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] input[type="file"] {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            font-size: .74rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] input[type="file"]::file-selector-button {
            margin-right: .48rem;
            padding: .38rem .55rem;
            border: 1px solid var(--dwd-border-strong);
            border-radius: 6px;
            color: #d8e5f2;
            background: #0d1828;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .two-button-row,
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .three-button-row {
            min-width: 0;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .two-button-row {
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .two-button-row button,
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .three-button-row button {
            min-width: 0;
            min-height: 2rem;
            padding: .42rem .5rem !important;
            font-size: .74rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-toolbar {
            gap: .3rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-icon-button {
            width: 1.9rem;
            min-width: 1.9rem;
            height: 1.9rem;
            min-height: 1.9rem;
            padding: 0 !important;
            border-radius: 6px !important;
            font-size: .88rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .storage-breadcrumbs {
            width: 100%;
            min-width: 0;
            min-height: 1.9rem;
            padding: .1rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .breadcrumb-button {
            min-height: 1.55rem;
            padding: .24rem .36rem !important;
            border: 0 !important;
            border-radius: 5px !important;
            color: #c8d7e6 !important;
            background: transparent !important;
            box-shadow: none !important;
            font-size: .69rem;
            font-weight: 600;
            transform: none !important;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .breadcrumb-button:hover:not(:disabled) {
            border: 0 !important;
            background: #142037 !important;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .storage-address {
            width: 100%;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-options,
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-frame {
            width: 100%;
            min-width: 0;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-header,
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-row {
            grid-template-columns: 26px minmax(80px, 1fr) 54px 78px 26px;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-header {
            min-height: 1.85rem;
            background: #0d1726;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-header-button {
            height: 1.85rem;
            min-height: 1.85rem;
            min-width: 0;
            padding: 0 .38rem !important;
            border: 0 !important;
            border-left: 1px solid var(--dwd-border) !important;
            border-radius: 0 !important;
            color: #91a4b7 !important;
            background: transparent !important;
            box-shadow: none !important;
            text-align: left;
            font-size: .68rem;
            font-weight: 650;
            transform: none !important;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-header-button:hover:not(:disabled),
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-header-button.active {
            border-color: var(--dwd-border) !important;
            color: #d8e5f2 !important;
            background: #142037 !important;
            transform: none !important;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .explorer-cell {
            padding: .3rem .34rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .select-cell {
            padding-inline: .2rem;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .context-menu button {
            width: 100%;
            min-height: 1.8rem;
            padding: .34rem .48rem !important;
            border: 0 !important;
            border-radius: 4px !important;
            color: #d8e5f2 !important;
            background: transparent !important;
            box-shadow: none !important;
            text-align: left;
            font-size: .72rem;
            transform: none !important;
          }
          #gb-single-drawer-root .gb-drawer-slot[data-slot="files"] .context-menu button:hover:not(:disabled) {
            border: 0 !important;
            background: #142037 !important;
          }
          '''.strip()

          if marker not in text:
              path.write_text(text.rstrip() + '\n\n' + patch + '\n', encoding='utf-8')
          PY
      - name: Rebuild and test web client
        shell: bash
        working-directory: apps/web-client
        run: |
          npm ci
          npm test
      - name: Commit generated UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/static/droidwebdisplay-main-drawer.css apps/web-client/dist/droidwebdisplay-main-drawer.css apps/web-client/dist-manifest.json
          git commit -m "Fix Files drawer layout density"
          git push origin HEAD:fix/files-drawer-layout
