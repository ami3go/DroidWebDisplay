name: Clipboard macOS Validation

on:
  push:
    branches: [agent/harden-clipboard-state]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clipboard-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Build protocol package
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm run build
      - name: Run web-client unit tests
        working-directory: apps/web-client
        run: node tools/run-tests.mjs
      - name: Install focused Python test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run clipboard regression tests
        run: python -m pytest -q tests/packaging/test_clipboard_sync_regression.py tests/regression/test_clipboard_copy_server_mode.py
