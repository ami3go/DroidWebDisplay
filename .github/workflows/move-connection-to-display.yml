name: Move Connection Controls To Display

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/move-connection-to-display.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move connection controls into Display
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('apps/web-client/static/droidwebdisplay-main-drawer.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('controller v1.2.1', 'controller v1.3.0')
          js = js.replace("const CONNECT_STYLE_ID = 'droidwebdisplay-connect-drawer-css';", "const CONNECTION_STYLE_ID = 'droidwebdisplay-connect-drawer-css';")
          js = js.replace("const GROUPS = ['connect','display','clipboard','files','apps','audio','access','network','diagnostics','settings'];", "const GROUPS = ['display','clipboard','files','apps','audio','access','network','diagnostics','settings'];")
          js = js.replace('function ensureConnectStyles() {', 'function ensureConnectionStyles() {')
          js = js.replace('document.getElementById(CONNECT_STYLE_ID)', 'document.getElementById(CONNECTION_STYLE_ID)')
          js = js.replace('link.id = CONNECT_STYLE_ID;', 'link.id = CONNECTION_STYLE_ID;')

          start = js.index('  function ensureConnectUi() {')
          end = js.index('  function applyRailOrder() {', start)
          replacement = '''  function ensureDisplayConnectionUi() {\n    const ui = root();\n    if (!ui) return;\n    const displaySlot = ui.querySelector('.gb-drawer-slot[data-slot="display"]');\n    if (!displaySlot) return;\n\n    const device = document.getElementById('device');\n    const refresh = document.getElementById('refresh');\n    const connect = document.getElementById('connect');\n    const disconnect = document.getElementById('disconnect');\n    if (!device || !refresh || !connect || !disconnect) return;\n\n    if (displaySlot.querySelector('.connect-card')) return;\n\n    const card = document.createElement('section');\n    card.className = 'help-card connect-card';\n    card.setAttribute('aria-label', 'Android device connection');\n\n    const deviceLabel = document.createElement('label');\n    deviceLabel.append(document.createTextNode('Android device'), device);\n\n    const actions = document.createElement('div');\n    actions.className = 'button-grid connect-actions';\n    actions.append(refresh, connect, disconnect);\n\n    card.append(deviceLabel, actions);\n    displaySlot.insertBefore(card, displaySlot.firstElementChild);\n  }\n'''
          js = js[:start] + replacement + js[end:]
          js = js.replace('    ensureConnectStyles();', '    ensureConnectionStyles();')
          js = js.replace('    ensureConnectUi();', '    ensureDisplayConnectionUi();')
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('apps/web-client/static/droidwebdisplay-connect-drawer.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Compact connection controls for the Connect drawer.', 'Compact connection controls at the top of the Display drawer.')
          css = css.replace('data-slot="connect"', 'data-slot="display"')
          css = re.sub(r'\n/\* Android-head icon for the Connect rail button, drawn in CSS\. \*/.*?(?=\n@media)', '\n', css, flags=re.S)
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('apps/web-client/tests/connect-drawer.test.mjs')
          test_path.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport { fileURLToPath } from "node:url";\nimport { dirname, resolve } from "node:path";\n\nconst root = resolve(dirname(fileURLToPath(import.meta.url)), "..");\nconst drawerSource = await readFile(resolve(root, "static/droidwebdisplay-main-drawer.js"), "utf8");\nconst connectCss = await readFile(resolve(root, "static/droidwebdisplay-connect-drawer.css"), "utf8");\nconst html = await readFile(resolve(root, "static/index.html"), "utf8");\n\ntest("Display is the first drawer group and owns connection controls", () => {\n  assert.match(drawerSource, /const GROUPS = \\['display','clipboard','files'/);\n  assert.doesNotMatch(drawerSource, /data-group=\\"connect\\"/);\n  assert.doesNotMatch(drawerSource, /dataset\\.group = 'connect'/);\n  assert.match(drawerSource, /data-slot=\\"display\\"/);\n  for (const id of ["device", "refresh", "connect", "disconnect"]) {\n    assert.match(drawerSource, new RegExp(`getElementById\\\\('${id}'\\\\)`));\n  }\n  assert.match(drawerSource, /actions\\.append\\(refresh, connect, disconnect\\)/);\n  assert.match(drawerSource, /displaySlot\\.insertBefore\\(card, displaySlot\\.firstElementChild\\)/);\n});\n\ntest("Display connection controls use a compact non-overlapping three-column layout", () => {\n  assert.match(drawerSource, /droidwebdisplay-connect-drawer\\.css/);\n  assert.match(connectCss, /data-slot=\\"display\\"/);\n  assert.doesNotMatch(connectCss, /data-slot=\\"connect\\"/);\n  assert.match(connectCss, /grid-template-columns: repeat\\(3, minmax\\(0, 1fr\\)\\) !important/);\n  assert.match(connectCss, /grid-column: auto !important/);\n  assert.match(connectCss, /min-height: 2rem !important/);\n  assert.match(connectCss, /#device[\\s\\S]*height: 2rem/);\n});\n\ntest("readiness indicator stays in header and Connect rail item is absent", () => {\n  const start = html.indexOf('<header class="topbar">');\n  const end = html.indexOf('</header>', start);\n  const header = html.slice(start, end);\n  assert.match(header, /id="connection-status"/);\n  assert.match(header, /id="status-icon"/);\n  assert.doesNotMatch(drawerSource, /label\\.textContent = 'Connect'/);\n});\n''', encoding='utf-8')
          PY
      - name: Build protocol
        working-directory: packages/scrcpy-protocol
        run: npm ci && npm run build
      - name: Build and test web client
        working-directory: apps/web-client
        run: npm ci && npm test
      - name: Commit source and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/static/droidwebdisplay-main-drawer.js \
                  apps/web-client/static/droidwebdisplay-connect-drawer.css \
                  apps/web-client/tests/connect-drawer.test.mjs \
                  apps/web-client/dist-manifest.json
          git add -u apps/web-client/dist
          git add -f apps/web-client/dist/droidwebdisplay-connect-drawer.css
          git diff --cached --quiet && exit 0
          git commit -m "Move connection controls into Display drawer"
          git push origin HEAD:agent/connect-drawer
