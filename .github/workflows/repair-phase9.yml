name: Repair Phase9 Regression

on:
  push:
    branches: [agent/connect-drawer]
    paths: [.github/workflows/repair-phase9.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - name: Restore test and remove Apps expectation
        run: |
          git checkout f7f7a4a4146d6c67f7b6ad9bc660fd3c87ff47ec -- tests/ux/test_phase9.py
          python -c "from pathlib import Path; p=Path('tests/ux/test_phase9.py'); s=p.read_text(); s=s.replace('(\"apps\", \"files\", \"clipboard\", \"display\", \"audio\", \"access\", \"network\", \"diagnostics\", \"settings\")','(\"display\", \"clipboard\", \"files\", \"audio\", \"access\", \"network\", \"diagnostics\", \"settings\")'); p.write_text(s)"
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-phase9.yml
          git add -u
          git commit -m "Restore phase9 regressions after Apps removal"
          git push origin HEAD:agent/connect-drawer
