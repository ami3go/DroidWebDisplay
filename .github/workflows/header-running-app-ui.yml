name: Running App Header Migration

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/header-running-app-ui.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply running-app header UI and diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1. Running app controller: header selector, auto-move, count, diagnostics.
          path = Path('apps/web-client/src/running-app-controller.ts')
          path.write_text(r'''import { BridgeApi } from "./api.js";
import type { RunningGuiAppDto, SessionDto } from "./types.js";

export interface RunningAppElements {
  readonly select: HTMLSelectElement;
  readonly refresh: HTMLButtonElement;
  readonly count: HTMLElement;
  readonly status: HTMLElement;
  readonly diagnosticDisplay: HTMLElement;
  readonly diagnosticRam: HTMLElement;
}

export class RunningAppController {
  #serial: string | null = null;
  #apps: RunningGuiAppDto[] = [];
  #activeSession: SessionDto | null = null;
  #virtualSession: SessionDto | null = null;
  #refreshTimer: number | null = null;
  #refreshing = false;
  #moving = false;

  public constructor(
    private readonly api: BridgeApi,
    private readonly elements: RunningAppElements,
  ) {
    this.elements.refresh.addEventListener("click", () => { void this.refresh(true); });
    this.elements.select.addEventListener("change", () => { void this.moveSelected(); });
    this.reset("Select a running application after starting a virtual display.");
    globalThis.addEventListener("droidwebdisplay-auth-required", () => this.pause());
  }

  public setSerial(serial: string | null): void {
    if (serial === this.#serial) return;
    this.#serial = serial;
    this.#apps = [];
    this.#activeSession = null;
    this.#virtualSession = null;
    if (!serial) {
      this.reset("Select an authorized device.");
      this.stopPolling();
      return;
    }
    this.reset("Start a virtual display to move running applications.");
    void this.refresh(false);
    this.startPolling();
  }

  public async refresh(manual = false): Promise<void> {
    if (!this.#serial || this.#refreshing) return;
    this.#refreshing = true;
    this.elements.refresh.disabled = true;
    if (manual) this.elements.status.textContent = "Refreshing running Android applications…";
    try {
      const [apps, sessions] = await Promise.all([
        this.api.runningApps(this.#serial),
        this.api.sessions(),
      ]);
      this.#apps = [...apps.apps];
      const runningSessions = sessions.sessions.filter(
        (session) => session.serial === this.#serial && session.state === "running",
      );
      this.#virtualSession = runningSessions.find(
        (session) =>
          session.displayMode === "virtual" &&
          typeof session.virtualDisplay.displayId === "number",
      ) ?? null;
      this.#activeSession = this.#virtualSession ?? runningSessions[0] ?? null;
      this.renderApps();
      this.renderDiagnostics(apps.freeMemoryBytes);
    } catch (error) {
      this.elements.status.textContent = error instanceof Error ? error.message : String(error);
      this.#apps = [];
      this.renderApps();
      this.renderDiagnostics(null);
    } finally {
      this.#refreshing = false;
      this.elements.refresh.disabled = false;
    }
  }

  public startPolling(): void {
    this.stopPolling();
    if (!this.#serial) return;
    this.#refreshTimer = window.setInterval(() => { void this.refresh(false); }, 4000);
  }

  public stopPolling(): void {
    if (this.#refreshTimer !== null) {
      window.clearInterval(this.#refreshTimer);
      this.#refreshTimer = null;
    }
  }

  public pause(): void {
    this.stopPolling();
  }

  private renderApps(): void {
    const previous = this.elements.select.value;
    this.elements.select.replaceChildren();
    this.elements.count.textContent = String(this.#apps.length);
    this.elements.refresh.title = `Refresh running applications (${this.#apps.length} found)`;
    this.elements.refresh.setAttribute("aria-label", `Refresh running applications, ${this.#apps.length} found`);

    if (this.#apps.length === 0) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "No GUI apps";
      this.elements.select.append(option);
      this.elements.select.disabled = true;
      this.elements.status.textContent = this.#virtualSession
        ? "No running GUI applications detected."
        : "Start a virtual display to move running applications.";
      return;
    }

    this.#apps.forEach((app) => {
      const option = document.createElement("option");
      option.value = String(app.taskId);
      const display = app.displayId === null ? "display ?" : `display ${app.displayId}`;
      option.textContent = `${app.label} · ${display}`;
      this.elements.select.append(option);
    });
    if (this.#apps.some((app) => String(app.taskId) === previous)) {
      this.elements.select.value = previous;
    }
    this.elements.select.disabled = false;
    this.updateSelectionStatus();
  }

  private updateSelectionStatus(): void {
    const selected = this.selectedApp();
    const targetDisplay = this.#virtualSession?.virtualDisplay.displayId ?? null;
    if (!selected || !this.#virtualSession || targetDisplay === null) {
      this.elements.status.textContent = "Start a virtual display to move running applications.";
      return;
    }
    if (selected.displayId === targetDisplay) {
      this.elements.status.textContent = `${selected.label} is already on virtual display ${targetDisplay}.`;
      return;
    }
    this.elements.status.textContent = `${selected.label} can be moved to virtual display ${targetDisplay}.`;
  }

  private selectedApp(): RunningGuiAppDto | null {
    const taskId = Number(this.elements.select.value);
    if (!Number.isInteger(taskId)) return null;
    return this.#apps.find((app) => app.taskId === taskId) ?? null;
  }

  private async moveSelected(): Promise<void> {
    if (this.#moving) return;
    const app = this.selectedApp();
    const session = this.#virtualSession;
    const targetDisplay = session?.virtualDisplay.displayId ?? null;
    if (!app || !session || targetDisplay === null) {
      this.updateSelectionStatus();
      return;
    }
    if (app.displayId === targetDisplay) {
      this.updateSelectionStatus();
      return;
    }

    this.#moving = true;
    this.elements.select.disabled = true;
    this.elements.refresh.disabled = true;
    this.elements.status.textContent = `Moving ${app.label} to virtual display ${targetDisplay}…`;
    try {
      const result = await this.api.moveRunningApp({
        sessionId: session.sessionId,
        taskId: app.taskId,
        componentName: app.componentName,
      });
      this.elements.status.textContent = result.status === "already-on-target"
        ? `${result.app.label} is already on display ${result.displayId}.`
        : result.verified
          ? `${result.app.label} moved to display ${result.displayId}.`
          : `${result.app.label}: launch sent to display ${result.displayId}; Android did not confirm the move yet.`;
      await this.refresh(false);
    } catch (error) {
      this.elements.status.textContent = error instanceof Error ? error.message : String(error);
    } finally {
      this.#moving = false;
      this.elements.select.disabled = this.#apps.length === 0;
      this.elements.refresh.disabled = false;
      this.updateSelectionStatus();
    }
  }

  private renderDiagnostics(freeMemoryBytes: number | null): void {
    const displayId = this.#virtualSession?.virtualDisplay.displayId
      ?? (this.#activeSession?.displayMode === "physical" ? 0 : null);
    this.elements.diagnosticDisplay.textContent = displayId === null ? "—" : String(displayId);
    this.elements.diagnosticRam.textContent = freeMemoryBytes === null ? "—" : formatBytes(freeMemoryBytes);
  }

  private reset(message: string): void {
    this.elements.select.replaceChildren();
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "No GUI apps";
    this.elements.select.append(option);
    this.elements.select.disabled = true;
    this.elements.count.textContent = "0";
    this.elements.refresh.title = "Refresh running applications (0 found)";
    this.elements.refresh.setAttribute("aria-label", "Refresh running applications, 0 found");
    this.elements.diagnosticDisplay.textContent = "—";
    this.elements.diagnosticRam.textContent = "—";
    this.elements.status.textContent = message;
  }
}

function formatBytes(value: number): string {
  const gib = value / (1024 ** 3);
  if (gib >= 1) return `${gib.toFixed(2)} GiB`;
  return `${(value / (1024 ** 2)).toFixed(0)} MiB`;
}
''', encoding='utf-8')

