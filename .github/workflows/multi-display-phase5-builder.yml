name: Multi-display Phase 5 Builder

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  build-phase5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json

      - name: Apply multi-display Phase 5 hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:160]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ------------------------------------------------------------------
          # Backend: configurable per-device session capacity, default 4 / max 8
          # ------------------------------------------------------------------
          config = Path('droid_web_display/config.py')
          replace_once(
              config,
              '    device_monitor_interval: float = 2.0\n    transfer_concurrency: int = 1\n',
              '    device_monitor_interval: float = 2.0\n    maximum_display_sessions: int = 4\n    transfer_concurrency: int = 1\n',
          )
          replace_once(
              config,
              '        if self.device_monitor_interval < 0.2:\n            raise ValueError("device_monitor_interval must be at least 0.2 seconds")\n        if not 1 <= self.transfer_concurrency <= 4:\n',
              '        if self.device_monitor_interval < 0.2:\n            raise ValueError("device_monitor_interval must be at least 0.2 seconds")\n        if not 1 <= self.maximum_display_sessions <= 8:\n            raise ValueError("maximum_display_sessions must be in range 1..8")\n        if not 1 <= self.transfer_concurrency <= 4:\n',
          )

          session = Path('droid_web_display/scrcpy/session.py')
          replace_once(
              session,
              '        connect_retry_interval: float = 0.1,\n        monitor_interval: float = 2.0,\n    ) -> None:\n',
              '        connect_retry_interval: float = 0.1,\n        monitor_interval: float = 2.0,\n        maximum_sessions_per_device: int = 4,\n    ) -> None:\n',
          )
          replace_once(
              session,
              '        self.connect_retry_interval = connect_retry_interval\n        self.monitor_interval = monitor_interval\n        self._sessions: dict[str, ScrcpySession] = {}\n',
              '        self.connect_retry_interval = connect_retry_interval\n        self.monitor_interval = monitor_interval\n        if not 1 <= maximum_sessions_per_device <= 8:\n            raise ValueError("maximum_sessions_per_device must be in range 1..8")\n        self.maximum_sessions_per_device = maximum_sessions_per_device\n        self._sessions: dict[str, ScrcpySession] = {}\n',
          )
          replace_once(
              session,
              '        async with self._lock:\n            session_id = self._allocate_session_id()\n',
              '''        async with self._lock:\n            # Reserve capacity before allocating any transport resources. Keeping\n            # this check under the manager lock makes concurrent Start requests\n            # deterministic and prevents two callers from both taking the final slot.\n            active_count = len(self._device_sessions.get(selected.serial, set()))\n            if active_count >= self.maximum_sessions_per_device:\n                raise SessionConflictError(\n                    f"Display session limit reached for device {selected.serial}",\n                    details={\n                        "scope": "device",\n                        "serial": selected.serial,\n                        "activeSessions": active_count,\n                        "maximumSessions": self.maximum_sessions_per_device,\n                        "availableSlots": 0,\n                    },\n                )\n            session_id = self._allocate_session_id()\n''',
          )
          replace_once(
              session,
              '    def _index_session(self, session: ScrcpySession) -> None:\n',
              '''    def session_capacity(self, serial: str) -> dict:\n        active_sessions = len(self._device_sessions.get(serial, set()))\n        return {\n            "serial": serial,\n            "activeSessions": active_sessions,\n            "maximumSessions": self.maximum_sessions_per_device,\n            "availableSlots": max(0, self.maximum_sessions_per_device - active_sessions),\n        }\n\n    def _index_session(self, session: ScrcpySession) -> None:\n''',
          )

          app = Path('droid_web_display/api/app.py')
          replace_once(app, 'import secrets\n', 'import secrets\nimport time\n')
          replace_once(
              app,
              '        monitor_interval=resolved_config.device_monitor_interval,\n    )\n',
              '        monitor_interval=resolved_config.device_monitor_interval,\n        maximum_sessions_per_device=resolved_config.maximum_display_sessions,\n    )\n',
          )
          replace_once(
              app,
              '''        return {\n            "serial": serial,\n            "activeSessionCount": len(values),\n            "sessions": [item.to_dict() for item in values],\n        }\n\n    @app.post("/api/v1/devices/{serial}/sessions", status_code=201)\n''',
              '''        capacity = container.manager.session_capacity(serial)\n        return {\n            "serial": serial,\n            "activeSessionCount": len(values),\n            "maximumSessions": capacity["maximumSessions"],\n            "availableSlots": capacity["availableSlots"],\n            "sessions": [item.to_dict() for item in values],\n        }\n\n    @app.get("/api/v1/devices/{serial}/display-diagnostics")\n    async def device_display_diagnostics(\n        serial: str,\n        container: Annotated[ServiceContainer, Depends(get_container)],\n    ) -> dict:\n        await container.manager.select_device(serial)\n        values = container.manager.list_sessions_for_device(serial)\n        capacity = container.manager.session_capacity(serial)\n        now = time.time()\n        displays = []\n        for session in values:\n            payload = session.to_dict()\n            started = session.started_at or session.created_at\n            displays.append({\n                "sessionId": session.session_id,\n                "state": session.state.value,\n                "display": payload["display"],\n                "createdAt": session.created_at,\n                "startedAt": session.started_at,\n                "ageSeconds": max(0.0, now - started),\n                "channelDiagnostics": payload["channelDiagnostics"],\n                "error": session.error,\n                "stopReason": session.stop_reason,\n                "virtualDisplay": payload["virtualDisplay"],\n            })\n        return {\n            "serial": serial,\n            "capacity": capacity,\n            "displays": displays,\n        }\n\n    @app.post("/api/v1/devices/{serial}/sessions", status_code=201)\n''',
          )

          # ------------------------------------------------------------------
          # Browser DTO/API capacity + diagnostics contracts
          # ------------------------------------------------------------------
          types = Path('apps/web-client/src/types.ts')
          replace_once(
              types,
              '  readonly firstChannelAttempts: number;\n  readonly channelDiagnostics?: Readonly<Record<string, ChannelDiagnosticDto>>;\n',
              '  readonly firstChannelAttempts: number;\n  readonly createdAt?: number;\n  readonly startedAt?: number | null;\n  readonly channelDiagnostics?: Readonly<Record<string, ChannelDiagnosticDto>>;\n',
          )
          replace_once(
              types,
              '''export interface DeviceSessionListResponse {\n  readonly serial: string;\n  readonly activeSessionCount: number;\n  readonly sessions: readonly SessionDto[];\n}\n\n''',
              '''export interface DisplaySessionCapacityDto {\n  readonly serial: string;\n  readonly activeSessions: number;\n  readonly maximumSessions: number;\n  readonly availableSlots: number;\n}\n\nexport interface DeviceSessionListResponse {\n  readonly serial: string;\n  readonly activeSessionCount: number;\n  readonly maximumSessions: number;\n  readonly availableSlots: number;\n  readonly sessions: readonly SessionDto[];\n}\n\nexport interface DisplayDiagnosticDto {\n  readonly sessionId: string;\n  readonly state: string;\n  readonly display: DisplayIdentityDto;\n  readonly createdAt: number;\n  readonly startedAt: number | null;\n  readonly ageSeconds: number;\n  readonly channelDiagnostics: Readonly<Record<string, ChannelDiagnosticDto>>;\n  readonly error: string | null;\n  readonly stopReason: string | null;\n  readonly virtualDisplay: VirtualDisplayDiagnosticDto;\n}\n\nexport interface DeviceDisplayDiagnosticsResponse {\n  readonly serial: string;\n  readonly capacity: DisplaySessionCapacityDto;\n  readonly displays: readonly DisplayDiagnosticDto[];\n}\n\n''',
          )

          api_ts = Path('apps/web-client/src/api.ts')
          replace_once(
              api_ts,
              '  DeviceListResponse,\n  DeviceSessionListResponse,\n',
              '  DeviceDisplayDiagnosticsResponse,\n  DeviceListResponse,\n  DeviceSessionListResponse,\n',
          )
          replace_once(
              api_ts,
              '''  public async deviceSessions(serial: string): Promise<DeviceSessionListResponse> {\n    return this.request<DeviceSessionListResponse>(`/api/v1/devices/${encodeURIComponent(serial)}/sessions`);\n  }\n\n''',
              '''  public async deviceSessions(serial: string): Promise<DeviceSessionListResponse> {\n    return this.request<DeviceSessionListResponse>(`/api/v1/devices/${encodeURIComponent(serial)}/sessions`);\n  }\n\n  public async displayDiagnostics(serial: string): Promise<DeviceDisplayDiagnosticsResponse> {\n    return this.request<DeviceDisplayDiagnosticsResponse>(`/api/v1/devices/${encodeURIComponent(serial)}/display-diagnostics`);\n  }\n\n''',
          )

          # ------------------------------------------------------------------
          # Browser UI: capacity indicator + per-display diagnostics
          # ------------------------------------------------------------------
          html = Path('apps/web-client/static/index.html')
          replace_once(
              html,
              '''          <button id="display-tab-add" type="button" class="display-tab-add" title="Create another display session">+ New display</button>\n''',
              '''          <span id="display-tab-capacity" class="display-tab-capacity" title="Active display sessions on the selected Android device">0 / 4 sessions</span>\n          <button id="display-tab-add" type="button" class="display-tab-add" title="Create another display session">+ New display</button>\n''',
          )
          replace_once(
              html,
              '''          <div class="gb-drawer-slot" data-slot="diagnostics"><section class="help-card statistics-card">\n          <h2>Mode statistic</h2>\n          <div id="statistics" class="statistics">No video statistics</div>\n        </section></div>\n''',
              '''          <div class="gb-drawer-slot" data-slot="diagnostics"><section class="help-card statistics-card">\n          <h2>Mode statistic</h2>\n          <div id="statistics" class="statistics">No video statistics</div>\n          <h2>Display sessions</h2>\n          <div id="display-diagnostics" class="display-diagnostics" aria-live="polite"><p class="empty-state">No active display sessions.</p></div>\n        </section></div>\n''',
          )

          styles = Path('apps/web-client/static/styles.css')
          styles.write_text(styles.read_text(encoding='utf-8') + '''\n\n/* Multi-display Phase 5 capacity and per-display diagnostics */\n.display-tab-capacity { flex: 0 0 auto; padding: 0.35rem 0.48rem; border: 1px solid #243244; border-radius: 7px; background: #0b1220; color: #8fa4b8; font-size: 0.68rem; font-weight: 700; white-space: nowrap; }\n.display-tab-capacity[data-full="true"] { border-color: #fb7185; color: #ffd6de; }\n.display-diagnostics { display: grid; gap: 0.45rem; }\n.display-diagnostic-row { padding: 0.5rem 0.55rem; border: 1px solid #243244; border-radius: 8px; background: #0b1220; }\n.display-diagnostic-row[data-active="true"] { border-color: #22d3ee; }\n.display-diagnostic-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }\n.display-diagnostic-heading strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e6edf7; }\n.display-diagnostic-heading span, .display-diagnostic-meta { color: #71869d; font-size: 0.68rem; }\n.display-diagnostic-meta { margin-top: 0.2rem; line-height: 1.35; }\n.display-switch-metric { margin: 0 0 0.45rem; color: #8fa4b8; font-size: 0.7rem; }\n''', encoding='utf-8')

          main = Path('apps/web-client/src/main.ts')
          replace_once(
              main,
              '      tabs: required<HTMLElement>("#display-tabs"),\n      tabAdd: required<HTMLButtonElement>("#display-tab-add"),\n',
              '      tabs: required<HTMLElement>("#display-tabs"),\n      tabCapacity: required<HTMLElement>("#display-tab-capacity"),\n      tabAdd: required<HTMLButtonElement>("#display-tab-add"),\n',
          )
          replace_once(
              main,
              '      statistics: required<HTMLElement>("#statistics"),\n',
              '      statistics: required<HTMLElement>("#statistics"),\n      displayDiagnostics: required<HTMLElement>("#display-diagnostics"),\n',
          )

          controller = Path('apps/web-client/src/controller.ts')
          replace_once(
              controller,
              'import type { AndroidDevice, SessionDto, VirtualDisplayCapabilities } from "./types.js";\n',
              'import type { AndroidDevice, SessionDto, VirtualDisplayCapabilities } from "./types.js";\n\nconst TAB_SWITCH_TARGET_MS = 50;\n',
          )
          replace_once(
              controller,
              '  readonly tabs: HTMLElement;\n  readonly tabAdd: HTMLButtonElement;\n',
              '  readonly tabs: HTMLElement;\n  readonly tabCapacity: HTMLElement;\n  readonly tabAdd: HTMLButtonElement;\n',
          )
          replace_once(
              controller,
              '  readonly statistics: HTMLElement;\n',
              '  readonly statistics: HTMLElement;\n  readonly displayDiagnostics: HTMLElement;\n',
          )
          replace_once(
              controller,
              '  #activeSessionId: string | null = null;\n  readonly #clipboardAcks = new Map<bigint, ClipboardAckWaiter>();\n',
              '''  #activeSessionId: string | null = null;\n  #maximumDisplaySessions = 4;\n  #availableDisplaySlots = 4;\n  #lastTabSwitchMs = 0;\n  #tabSwitchCount = 0;\n  #lastDiagnosticsRenderAt = 0;\n  readonly #clipboardAcks = new Map<bigint, ClipboardAckWaiter>();\n''',
          )
          replace_once(
              controller,
              '''    await this.refreshDevices();\n    await this.refreshVirtualCapabilities();\n    this.updateDisplayUi();\n''',
              '''    await this.refreshDevices();\n    await Promise.all([this.refreshVirtualCapabilities(), this.refreshSessionCapacity()]);\n    this.updateDisplayUi();\n''',
          )
          replace_once(
              controller,
              '''    const values = this.readDisplayValues();\n    const errors = validateDisplayForm(values);\n''',
              '''    if (this.#availableDisplaySlots <= 0) {\n      throw new Error(`Display session limit reached (${this.#maximumDisplaySessions} per Android device). Close a display tab before starting another.`);\n    }\n    const values = this.readDisplayValues();\n    const errors = validateDisplayForm(values);\n''',
          )
          replace_once(
              controller,
              '''      this.#runtimes.set(serverSession.sessionId, runtime);\n      this.renderTabs();\n\n      runtime.deviceMessageTask =''',
              '''      this.#runtimes.set(serverSession.sessionId, runtime);\n      this.#availableDisplaySlots = Math.max(0, this.#availableDisplaySlots - 1);\n      this.renderCapacity();\n      this.renderTabs();\n\n      runtime.deviceMessageTask =''',
          )
          replace_once(
              controller,
              '''      this.activateRuntime(serverSession.sessionId);\n      this.#reconnectCount = 0;\n      this.renderTabs();\n''',
              '''      this.activateRuntime(serverSession.sessionId);\n      this.#reconnectCount = 0;\n      this.renderTabs();\n      void this.refreshSessionCapacity().catch(() => undefined);\n''',
          )

          # renderTabs gets capacity/diagnostics updates without server I/O.
          replace_once(
              controller,
              '''  private renderTabs(): void {\n    this.elements.tabs.replaceChildren();\n''',
              '''  private renderTabs(): void {\n    this.elements.tabs.replaceChildren();\n    this.renderCapacity();\n''',
          )
          replace_once(
              controller,
              '''      this.elements.tabs.append(empty);\n      return;\n''',
              '''      this.elements.tabs.append(empty);\n      this.renderDisplayDiagnostics(true);\n      return;\n''',
          )
          replace_once(
              controller,
              '''      item.append(select, close);\n      this.elements.tabs.append(item);\n    }\n  }\n\n  private activateRuntime(sessionId: string): void {\n''',
              '''      item.append(select, close);\n      this.elements.tabs.append(item);\n    }\n    this.renderDisplayDiagnostics(true);\n  }\n\n  private activateRuntime(sessionId: string): void {\n''',
          )

          # Qualify instant tab switching: synchronous/browser-only and measured.
          replace_once(
              controller,
              '''  private activateRuntime(sessionId: string): void {\n    const runtime = this.#runtimes.get(sessionId);\n    if (!runtime) return;\n    this.stopFlexResize();\n''',
              '''  private activateRuntime(sessionId: string): void {\n    const runtime = this.#runtimes.get(sessionId);\n    if (!runtime) return;\n    const previousSessionId = this.#activeSessionId;\n    const switchStartedAt = performance.now();\n    this.stopFlexResize();\n''',
          )
          replace_once(
              controller,
              '''    runtime.canvas.focus();\n    globalThis.dispatchEvent(new CustomEvent("droidwebdisplay-active-session", { detail: { sessionId } }));\n  }\n\n  private clearActiveRuntime(): void {\n''',
              '''    runtime.canvas.focus();\n    globalThis.dispatchEvent(new CustomEvent("droidwebdisplay-active-session", { detail: { sessionId } }));\n    if (previousSessionId !== null && previousSessionId !== sessionId) {\n      this.#lastTabSwitchMs = performance.now() - switchStartedAt;\n      this.#tabSwitchCount += 1;\n      this.renderDisplayDiagnostics(true);\n    }\n  }\n\n  private clearActiveRuntime(): void {\n''',
          )

          # Add capacity and diagnostics helpers before clearActiveRuntime.
          replace_once(
              controller,
              '  private clearActiveRuntime(): void {\n',
              '''  private async refreshSessionCapacity(): Promise<void> {\n    const serial = this.elements.device.value;\n    if (!serial) {\n      this.#maximumDisplaySessions = 4;\n      this.#availableDisplaySlots = 4;\n      this.renderCapacity();\n      return;\n    }\n    const response = await this.#api.deviceSessions(serial);\n    this.#maximumDisplaySessions = response.maximumSessions;\n    this.#availableDisplaySlots = response.availableSlots;\n    this.renderCapacity();\n    this.updateConnectAvailability();\n  }\n\n  private renderCapacity(): void {\n    const active = Math.max(0, this.#maximumDisplaySessions - this.#availableDisplaySlots);\n    this.elements.tabCapacity.textContent = `${active} / ${this.#maximumDisplaySessions} sessions`;\n    this.elements.tabCapacity.dataset.full = String(this.#availableDisplaySlots <= 0);\n    this.elements.tabCapacity.title = this.#availableDisplaySlots <= 0\n      ? `Session limit reached. Close a display before creating another.`\n      : `${this.#availableDisplaySlots} display slot(s) available on the selected Android device.`;\n  }\n\n  private renderDisplayDiagnostics(force = false): void {\n    const now = performance.now();\n    if (!force && now - this.#lastDiagnosticsRenderAt < 500) return;\n    this.#lastDiagnosticsRenderAt = now;\n    this.elements.displayDiagnostics.replaceChildren();\n\n    const switchMetric = document.createElement("p");\n    switchMetric.className = "display-switch-metric";\n    switchMetric.textContent = this.#tabSwitchCount\n      ? `Last tab switch ${this.#lastTabSwitchMs.toFixed(2)} ms · target <${TAB_SWITCH_TARGET_MS} ms · switches ${this.#tabSwitchCount}`\n      : `Tab switch target <${TAB_SWITCH_TARGET_MS} ms · no completed tab switch yet.`;\n    this.elements.displayDiagnostics.append(switchMetric);\n\n    if (!this.#runtimes.size) {\n      const empty = document.createElement("p");\n      empty.className = "empty-state";\n      empty.textContent = "No active display sessions.";\n      this.elements.displayDiagnostics.append(empty);\n      return;\n    }\n\n    for (const [sessionId, runtime] of this.#runtimes) {\n      const row = document.createElement("div");\n      row.className = "display-diagnostic-row";\n      row.dataset.active = String(sessionId === this.#activeSessionId);\n      const heading = document.createElement("div");\n      heading.className = "display-diagnostic-heading";\n      const name = document.createElement("strong");\n      name.textContent = runtime.serverSession.display.name;\n      const state = document.createElement("span");\n      state.textContent = sessionId === this.#activeSessionId ? "ACTIVE" : "BACKGROUND";\n      heading.append(name, state);\n      const meta = document.createElement("div");\n      meta.className = "display-diagnostic-meta";\n      const video = runtime.latestStatistics;\n      const audio = runtime.latestAudioStatistics;\n      const displayId = runtime.serverSession.display.displayId ?? "…";\n      const videoText = video\n        ? `video ${video.width}×${video.height}, decoded ${video.framesDecoded}, dropped ${video.framesDropped}, queue ${video.decoderQueue}`\n        : "video waiting";\n      const audioText = audio ? `audio ${audio.codec}, ${audio.bufferedMilliseconds} ms buffered` : "audio off/unavailable";\n      meta.textContent = `${runtime.serverSession.display.kind} display ${displayId} · ${videoText} · ${audioText} · session ${sessionId.slice(0, 8)}`;\n      row.append(heading, meta);\n      this.elements.displayDiagnostics.append(row);\n    }\n  }\n\n  private clearActiveRuntime(): void {\n''',
          )

          replace_once(
              controller,
              '''    const disabled = !hasDevice || !selectedReady || !sameDevice || errors.length > 0 || unsupported;\n''',
              '''    const atCapacity = this.#availableDisplaySlots <= 0;\n    const disabled = !hasDevice || !selectedReady || !sameDevice || atCapacity || errors.length > 0 || unsupported;\n''',
          )
          replace_once(
              controller,
              '''    this.elements.refresh.addEventListener("click", () => void this.runUiAction(async () => {\n      await this.refreshDevices();\n      await this.refreshVirtualCapabilities();\n    }));\n    this.elements.device.addEventListener("change", () => void this.runUiAction(() => this.refreshVirtualCapabilities()));\n''',
              '''    this.elements.refresh.addEventListener("click", () => void this.runUiAction(async () => {\n      await this.refreshDevices();\n      await Promise.all([this.refreshVirtualCapabilities(), this.refreshSessionCapacity()]);\n    }));\n    this.elements.device.addEventListener("change", () => void this.runUiAction(async () => {\n      await Promise.all([this.refreshVirtualCapabilities(), this.refreshSessionCapacity()]);\n    }));\n''',
          )

          # On cleanup, release the local capacity slot immediately; reconcile with server asynchronously.
          replace_once(
              controller,
              '''    this.releaseRuntimeCanvas(runtime.canvas);\n\n    if (wasActive) {\n''',
              '''    this.releaseRuntimeCanvas(runtime.canvas);\n    this.#availableDisplaySlots = Math.min(this.#maximumDisplaySessions, this.#availableDisplaySlots + 1);\n    this.renderCapacity();\n    void this.refreshSessionCapacity().catch(() => undefined);\n\n    if (wasActive) {\n''',
          )

          # Update diagnostics at a bounded cadence from per-runtime media stats.
          replace_once(
              controller,
              '''    runtime.latestStatistics = stats;\n    if (sessionId !== this.#activeSessionId) return;\n''',
              '''    runtime.latestStatistics = stats;\n    this.renderDisplayDiagnostics();\n    if (sessionId !== this.#activeSessionId) return;\n''',
          )
          replace_once(
              controller,
              '''    runtime.latestAudioStatistics = stats;\n    if (sessionId !== this.#activeSessionId) return;\n''',
              '''    runtime.latestAudioStatistics = stats;\n    this.renderDisplayDiagnostics();\n    if (sessionId !== this.#activeSessionId) return;\n''',
          )

          # Running Apps must not generate ADB/API work on a tab switch.
          running = Path('apps/web-client/src/running-app-controller.ts')
          replace_once(
              running,
              '  #virtualSession: SessionDto | null = null;\n',
              '  #virtualSession: SessionDto | null = null;\n  #virtualSessions: readonly SessionDto[] = [];\n',
          )
          replace_once(
              running,
              '''    globalThis.addEventListener("droidwebdisplay-active-session", (event) => {\n      const detail = (event as CustomEvent<{ sessionId: string | null }>).detail;\n      this.#activeSessionId = detail?.sessionId ?? null;\n      void this.refresh(true);\n    });\n''',
              '''    globalThis.addEventListener("droidwebdisplay-active-session", (event) => {\n      const detail = (event as CustomEvent<{ sessionId: string | null }>).detail;\n      this.#activeSessionId = detail?.sessionId ?? null;\n      // Tab switching is intentionally browser-local. Use the most recent\n      // session snapshot here; the 4-second/manual refresh owns ADB/API work.\n      this.selectActiveVirtualSession();\n      this.updateTargetStatus();\n      this.updateControls();\n    });\n''',
          )
          replace_once(
              running,
              '''      this.#apps = [];\n      this.#virtualSession = null;\n      this.render();\n''',
              '''      this.#apps = [];\n      this.#virtualSessions = [];\n      this.#virtualSession = null;\n      this.render();\n''',
          )
          replace_once(
              running,
              '''      const virtualSessions = sessions.sessions.filter((session) =>\n        session.state === "running"\n        && session.displayMode === "virtual"\n        && typeof session.virtualDisplay.displayId === "number"\n      );\n      this.#virtualSession = virtualSessions.find((session) => session.sessionId === this.#activeSessionId)\n        ?? (this.#activeSessionId === null ? virtualSessions[0] ?? null : null);\n      this.render();\n      const displayId = this.#virtualSession?.virtualDisplay.displayId;\n      this.#elements.status.textContent = displayId === null || displayId === undefined\n        ? `${this.#apps.length} GUI task(s) found. Start a virtual display to move one.`\n        : `${this.#apps.length} GUI task(s) found · target display ${displayId}.`;\n''',
              '''      this.#virtualSessions = sessions.sessions.filter((session) =>\n        session.state === "running"\n        && session.displayMode === "virtual"\n        && typeof session.virtualDisplay.displayId === "number"\n      );\n      this.selectActiveVirtualSession();\n      this.render();\n      this.updateTargetStatus();\n''',
          )
          replace_once(
              running,
              '''  private selectedApp(): RunningGuiAppDto | null {\n''',
              '''  private selectActiveVirtualSession(): void {\n    this.#virtualSession = this.#virtualSessions.find((session) => session.sessionId === this.#activeSessionId)\n      ?? (this.#activeSessionId === null ? this.#virtualSessions[0] ?? null : null);\n  }\n\n  private updateTargetStatus(): void {\n    const displayId = this.#virtualSession?.virtualDisplay.displayId;\n    this.#elements.status.textContent = displayId === null || displayId === undefined\n      ? `${this.#apps.length} GUI task(s) found. Start or select a virtual display to move one.`\n      : `${this.#apps.length} GUI task(s) found · target display ${displayId}.`;\n  }\n\n  private selectedApp(): RunningGuiAppDto | null {\n''',
