          api_test.write_text(api_test.read_text(encoding='utf-8') + '''\n\ndef test_device_session_limit_returns_409_and_diagnostics_report_capacity(tmp_path: Path) -> None:\n    adb = FakeAdb([AndroidDevice("PHONE", "device", model="Test")])\n    manager = SessionManager(\n        adb,\n        artifact(tmp_path),\n        connect_timeout=2.0,\n        monitor_interval=10,\n        maximum_sessions_per_device=2,\n    )\n    config = BridgeConfig(repo_root=tmp_path, authentication_required=False, maximum_display_sessions=2)\n    app = create_app(config=config, manager=manager, adb=adb)  # type: ignore[arg-type]\n    with TestClient(app) as client:\n        first = client.post("/api/v1/devices/PHONE/sessions", json={"audio": False, "displayName": "Phone"})\n        second = client.post("/api/v1/devices/PHONE/sessions", json={"audio": False, "displayName": "Work"})\n        assert first.status_code == second.status_code == 201\n\n        rejected = client.post("/api/v1/devices/PHONE/sessions", json={"audio": False, "displayName": "Overflow"})\n        assert rejected.status_code == 409\n        error = rejected.json()["error"]\n        assert error["code"] == "session_conflict"\n        assert error["details"]["maximumSessions"] == 2\n        assert error["details"]["availableSlots"] == 0\n\n        diagnostics = client.get("/api/v1/devices/PHONE/display-diagnostics")\n        assert diagnostics.status_code == 200\n        payload = diagnostics.json()\n        assert payload["capacity"]["activeSessions"] == 2\n        assert payload["capacity"]["maximumSessions"] == 2\n        assert payload["capacity"]["availableSlots"] == 0\n        assert {item["display"]["name"] for item in payload["displays"]} == {"Phone", "Work"}\n        assert all("channelDiagnostics" in item for item in payload["displays"])\n''', encoding='utf-8')

          config_test = Path('tests/release/test_multi_display_phase5_release.py')
          config_test.write_text('''from pathlib import Path\n\nimport pytest\n\nfrom droid_web_display.config import BridgeConfig\n\n\ndef test_phase5_session_capacity_defaults_and_validation(tmp_path: Path) -> None:\n    config = BridgeConfig(repo_root=tmp_path)\n    assert config.maximum_display_sessions == 4\n    config.validate()\n    for value in (1, 8):\n        BridgeConfig(repo_root=tmp_path, maximum_display_sessions=value).validate()\n    for value in (0, 9):\n        with pytest.raises(ValueError, match="maximum_display_sessions"):\n            BridgeConfig(repo_root=tmp_path, maximum_display_sessions=value).validate()\n\n\ndef test_phase5_backend_contract_is_present() -> None:\n    root = Path(__file__).resolve().parents[2]\n    session = (root / "droid_web_display/scrcpy/session.py").read_text(encoding="utf-8")\n    api = (root / "droid_web_display/api/app.py").read_text(encoding="utf-8")\n    assert "maximum_sessions_per_device: int = 4" in session\n    assert "Display session limit reached for device" in session\n    assert "def session_capacity" in session\n    assert "/api/v1/devices/{serial}/display-diagnostics" in api\n    assert '"maximumSessions"' in api\n    assert '"availableSlots"' in api\n\n\ndef test_phase5_tab_switch_contract_is_browser_only_and_50ms_target() -> None:\n    root = Path(__file__).resolve().parents[2]\n    controller = (root / "apps/web-client/src/controller.ts").read_text(encoding="utf-8")\n    running_apps = (root / "apps/web-client/src/running-app-controller.ts").read_text(encoding="utf-8")\n    assert "const TAB_SWITCH_TARGET_MS = 50" in controller\n    start = controller.index("private activateRuntime")\n    end = controller.index("private async refreshSessionCapacity", start)\n    switch_body = controller[start:end]\n    assert "await " not in switch_body\n    assert "#api" not in switch_body\n    assert "startDeviceSession" not in switch_body\n    assert "recordApplicationLaunch" not in switch_body\n    event_start = running_apps.index('globalThis.addEventListener("droidwebdisplay-active-session"')\n    event_end = running_apps.index("  }", event_start) + 3\n    event_body = running_apps[event_start:event_end]\n    assert "refresh(" not in event_body\n    assert "#api" not in event_body\n\n\ndef test_phase5_browser_exposes_capacity_and_per_display_diagnostics() -> None:\n    root = Path(__file__).resolve().parents[2]\n    html = (root / "apps/web-client/static/index.html").read_text(encoding="utf-8")\n    controller = (root / "apps/web-client/src/controller.ts").read_text(encoding="utf-8")\n    assert 'id="display-tab-capacity"' in html\n    assert 'id="display-diagnostics"' in html\n    assert "renderDisplayDiagnostics" in controller\n    assert "Last tab switch" in controller\n''', encoding='utf-8')

          # Browser source-contract tests.
          layout = Path('apps/web-client/tests/layout.test.mjs')
          layout.write_text(layout.read_text(encoding='utf-8') + '''\n\ntest("Phase 5 enforces visible display capacity and per-display diagnostics", () => {\n  assert.match(html, /id="display-tab-capacity"/);\n  assert.match(html, /id="display-diagnostics"/);\n  assert.match(mainSource, /tabCapacity: required<HTMLElement>\\("#display-tab-capacity"\\)/);\n  assert.match(mainSource, /displayDiagnostics: required<HTMLElement>\\("#display-diagnostics"\\)/);\n  assert.match(controllerSource, /#maximumDisplaySessions = 4/);\n  assert.match(controllerSource, /#availableDisplaySlots = 4/);\n  assert.match(controllerSource, /atCapacity = this\\.#availableDisplaySlots <= 0/);\n  assert.match(controllerSource, /renderDisplayDiagnostics/);\n});\n\ntest("Phase 5 tab switching stays synchronous and browser-only with a 50 ms target", () => {\n  assert.match(controllerSource, /const TAB_SWITCH_TARGET_MS = 50/);\n  const start = controllerSource.indexOf("private activateRuntime");\n  const end = controllerSource.indexOf("private async refreshSessionCapacity", start);\n  assert.ok(start >= 0 && end > start);\n  const body = controllerSource.slice(start, end);\n  assert.doesNotMatch(body, /await\\s/);\n  assert.doesNotMatch(body, /#api/);\n  assert.doesNotMatch(body, /startDeviceSession|recordApplicationLaunch|refreshDevices/);\n  assert.match(body, /performance\\.now\\(\\)/);\n  assert.match(body, /audioPlayer\\.setMuted/);\n});\n\ntest("active-session event does not query ADB or REST during tab switch", () => {\n  const start = runningAppSource.indexOf('globalThis.addEventListener("droidwebdisplay-active-session"');\n  const end = runningAppSource.indexOf("  });", start);\n  assert.ok(start >= 0 && end > start);\n  const body = runningAppSource.slice(start, end);\n  assert.doesNotMatch(body, /refresh\\(/);\n  assert.doesNotMatch(body, /#api/);\n  assert.match(body, /selectActiveVirtualSession/);\n});\n''', encoding='utf-8')

          api_browser_test = Path('apps/web-client/tests/api.test.mjs')
          api_browser_test.write_text(api_browser_test.read_text(encoding='utf-8') + '''\n\ntest("Phase 5 display diagnostics use the device-scoped endpoint", async () => {\n  const calls = [];\n  const api = new BridgeApi("", async (url) => {\n    calls.push(String(url));\n    return new Response(JSON.stringify({\n      serial: "PHONE",\n      capacity: { serial: "PHONE", activeSessions: 2, maximumSessions: 4, availableSlots: 2 },\n      displays: [],\n    }), { status: 200, headers: { "content-type": "application/json" } });\n  });\n  const result = await api.displayDiagnostics("PHONE");\n  assert.equal(result.capacity.maximumSessions, 4);\n  assert.equal(result.capacity.availableSlots, 2);\n  assert.deepEqual(calls, ["/api/v1/devices/PHONE/display-diagnostics"]);\n});\n''', encoding='utf-8')

          # Document the qualification boundary and HIL checks.
          docs = Path('docs/MULTI_DISPLAY_PHASE5.md')
          docs.write_text('''# Multi-display Phase 5 — Hardening and Qualification\n\nPhase 5 hardens the Phase 1–4 multi-display implementation without changing the scrcpy v4.1 media/control protocol.\n\n## Runtime limits\n\n- Default maximum simultaneous display sessions per Android device: **4**.\n- Configurable range: **1..8** through `BridgeConfig.maximum_display_sessions`.\n- Capacity is reserved atomically before a new scrcpy transport is allocated.\n- Capacity is independent per Android serial.\n- Stopping or failing one display releases only that display's slot.\n\nThe device-scoped sessions API reports `maximumSessions` and `availableSlots`. The browser disables Connect / New display when no slot remains.\n\n## Instant tab switching\n\nThe tab-switch path is browser-local and has a qualification target of **less than 50 ms**. Switching a live tab changes the active runtime/canvas and input/audio routing only. It does not start a session, query ADB, recreate a virtual display, launch an application, or restart scrcpy.\n\nThe Diagnostics drawer reports the most recent browser tab-switch duration and per-display video/audio state. Server-side display diagnostics are available at:\n\n```text\nGET /api/v1/devices/{serial}/display-diagnostics\n```\n\n## Automated qualification\n\nThe normal release gate covers:\n\n- default/range capacity validation;\n- fifth-session rejection at the default limit;\n- capacity release after normal stop and isolated server failure;\n- independent capacity across Android devices;\n- HTTP 409 conflict response when capacity is exhausted;\n- per-display diagnostic response;\n- browser-only tab-switch source contract;\n- visible browser capacity and per-display diagnostics;\n- all pre-existing session, browser, protocol, transfer, auth and packaging regressions.\n\n## Hardware qualification\n\nBefore merging, exercise the feature on the target Android device:\n\n1. Run four simultaneous displays (physical/virtual mix supported by the device).\n2. Switch repeatedly between every tab and confirm immediate video/input focus changes.\n3. Confirm only the active tab produces audible audio.\n4. Close each tab in a different order and verify the other sessions continue.\n5. Force one session failure (USB/server interruption where practical) and verify sibling lifecycle isolation.\n6. Start a replacement display after a slot is released.\n7. Keep file transfer active while switching tabs and confirm screen control remains responsive.\n8. Record Diagnostics output and the observed tab-switch responsiveness.\n\nHardware-specific latency cannot be certified by GitHub Actions; the automated gate qualifies the architecture and deterministic lifecycle behavior.\n''', encoding='utf-8')
          PY

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: packages/scrcpy-protocol
      - run: npm ci
        working-directory: apps/web-client

      - name: Run Phase 5 Python tests
        run: |
          $HOME/.local/bin/uv run ruff check droid_web_display/config.py droid_web_display/scrcpy/session.py droid_web_display/api/app.py tests/regression/session/test_multi_session.py tests/regression/session/test_device_session_api.py tests/release/test_multi_display_phase5_release.py --select E9,F63,F7,F82
          $HOME/.local/bin/uv run pytest -q tests/regression/session/test_multi_session.py tests/regression/session/test_device_session_api.py tests/release/test_multi_display_phase5_release.py

      - name: Build protocol package
        run: npm run build
        working-directory: packages/scrcpy-protocol
      - name: Build web client
        run: node tools/build.mjs
        working-directory: apps/web-client
      - name: Run web client tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Regenerate OpenAPI
        run: $HOME/.local/bin/uv run python tools/generate_openapi.py
      - name: Verify bundled static client
        run: |
          $HOME/.local/bin/uv run python - <<'PY'
          from pathlib import Path
          from droid_web_display.release_checks import verify_static_client
          result = verify_static_client(Path.cwd())
          print(result)
          if result.get("status") != "PASS":
              raise SystemExit(1)
          PY

      - name: Commit Phase 5 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            droid_web_display/config.py \
            droid_web_display/scrcpy/session.py \
            droid_web_display/api/app.py \
            apps/web-client/src \
            apps/web-client/static \
            apps/web-client/tests \
            apps/web-client/dist-manifest.json \
            packages/bridge-api/openapi/openapi-v1.json \
            tests/regression/session \
            tests/release/test_multi_display_phase5_release.py \
            docs/MULTI_DISPLAY_PHASE5.md
          git add -f apps/web-client/dist
          if git diff --cached --quiet; then
            echo "No Phase 5 changes to commit"
            exit 0
          fi
          git commit -m "Implement multi-display Phase 5 hardening"
          git push origin HEAD:multi-display-tabs
