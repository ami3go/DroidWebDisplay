name: Finalize connection profiles

on:
  push:
    branches: [connection-profiles]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[profile-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connection-profiles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json
      - name: Apply final lifecycle review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-client/src/connection-profile-controller.ts')
          text = path.read_text(encoding='utf-8')

          # Patch only inside selectProfile(), and assert the insertion point is unique.
          select_start = text.index('  private selectProfile(): void {')
          select_end = text.index('\n  private selectedProfile()', select_start)
          select_block = text[select_start:select_end]
          select_needle = '    const value = element<HTMLSelectElement>("connection-profile-select").value;\n'
          if select_block.count(select_needle) != 1:
              raise SystemExit('Unexpected selectProfile structure; refusing unsafe patch')
          if 'Waiting cancelled because another connection profile was selected.' not in select_block:
              select_block = select_block.replace(
                  select_needle,
                  select_needle
                  + '    if (this.#waitingProfileId && value !== this.#waitingProfileId) {\n'
                  + '      this.cancelWaiting(false);\n'
                  + '      this.setStatus("Waiting cancelled because another connection profile was selected.");\n'
                  + '    }\n',
                  1,
              )
              text = text[:select_start] + select_block + text[select_end:]

          # Patch only inside pollWaitingProfile(). The exact three statements below are
          # the lifecycle behavior under review, so every replacement is count-checked.
          wait_start = text.index('  private async pollWaitingProfile(')
          wait_end = text.index('\n  private cancelWaiting(', wait_start)
          wait_block = text[wait_start:wait_end]
          expected = {
              'this.cancelWaiting(false); this.#applying = true;': 1,
              'await this.selectExactDevice(profile); await this.finishProfileConnection(profile);': 1,
              '} finally { this.#applying = false; }': 1,
          }
          for needle, count in expected.items():
              if wait_block.count(needle) != count:
                  raise SystemExit(f'Unexpected waiting lifecycle structure for {needle!r}; refusing unsafe patch')
          wait_block = wait_block.replace(
              'this.cancelWaiting(false); this.#applying = true;',
              'this.cancelWaiting(false);',
              1,
          )
          wait_block = wait_block.replace(
              'await this.selectExactDevice(profile); await this.finishProfileConnection(profile);',
              '// Re-enter the complete profile load path. This safely disconnects any\n'
              '          // session the user may have opened while waiting before selecting the\n'
              '          // exact saved serial and restoring the profile.\n'
              '          await this.loadAndConnectProfile(profile, false);',
              1,
          )
          wait_block = wait_block.replace('} finally { this.#applying = false; }', '}', 1)
          text = text[:wait_start] + wait_block + text[wait_end:]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: apps/web-client
      - run: npm run build
        working-directory: apps/web-client
      - name: Run web profile tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Refresh OpenAPI
        run: $HOME/.local/bin/uv run python tools/generate_openapi.py
      - name: Commit reviewed source and generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/connection-profile-controller.ts
          git add -f apps/web-client/dist apps/web-client/dist-manifest.json packages/bridge-api/openapi/openapi-v1.json
          if git diff --cached --quiet; then
            echo "Source and generated runtime already current."
            exit 0
          fi
          git commit -m "Finalize connection profiles and rebuild runtime [profile-finalized]"
          git push origin HEAD:connection-profiles
