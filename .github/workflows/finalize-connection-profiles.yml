name: Finalize connection profiles

on:
  push:
    branches: [connection-profiles]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[profile-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connection-profiles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json
      - name: Apply final lifecycle review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-client/src/connection-profile-controller.ts')
          text = path.read_text(encoding='utf-8')

          old_select = '''  private selectProfile(): void {
              const value = element<HTMLSelectElement>("connection-profile-select").value;
              this.#selectedProfileId = value || null;
              this.#dirty = false;
              this.renderSelectionState();
            }
          '''
          new_select = '''  private selectProfile(): void {
              const value = element<HTMLSelectElement>("connection-profile-select").value;
              if (this.#waitingProfileId && value !== this.#waitingProfileId) {
                this.cancelWaiting(false);
                this.setStatus("Waiting cancelled because another connection profile was selected.");
              }
              this.#selectedProfileId = value || null;
              this.#dirty = false;
              this.renderSelectionState();
            }
          '''
          if old_select not in text:
              raise SystemExit('Expected selectProfile source pattern not found; refusing unsafe patch')
          text = text.replace(old_select, new_select, 1)

          old_wait = '''      if (saved) {
                this.cancelWaiting(false); this.#applying = true;
                try {
                  await this.selectExactDevice(profile); await this.finishProfileConnection(profile);
                } catch (error) {
                  this.setMainStatus("Profile connection failed", `${profile.name} · ${errorMessage(error)}`);
                  this.setStatus(`Saved device appeared, but the profile connection failed: ${errorMessage(error)}`, true);
                } finally { this.#applying = false; }
                return;
              }
          '''
          new_wait = '''      if (saved) {
                this.cancelWaiting(false);
                try {
                  // Re-enter the complete profile load path. This safely disconnects any
                  // session the user may have opened while waiting before selecting the
                  // exact saved serial and restoring the profile.
                  await this.loadAndConnectProfile(profile, false);
                } catch (error) {
                  this.setMainStatus("Profile connection failed", `${profile.name} · ${errorMessage(error)}`);
                  this.setStatus(`Saved device appeared, but the profile connection failed: ${errorMessage(error)}`, true);
                }
                return;
              }
          '''
          if old_wait not in text:
              raise SystemExit('Expected waiting lifecycle source pattern not found; refusing unsafe patch')
          path.write_text(text.replace(old_wait, new_wait, 1), encoding='utf-8')
          PY
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync locked Python environment
        run: $HOME/.local/bin/uv sync --locked --extra dev
      - run: npm ci
        working-directory: apps/web-client
      - run: npm run build
        working-directory: apps/web-client
      - name: Run web profile tests
        run: node tools/run-tests.mjs
        working-directory: apps/web-client
      - name: Refresh OpenAPI
        run: $HOME/.local/bin/uv run python tools/generate_openapi.py
      - name: Commit reviewed source and generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/connection-profile-controller.ts
          git add -f apps/web-client/dist apps/web-client/dist-manifest.json packages/bridge-api/openapi/openapi-v1.json
          if git diff --cached --quiet; then
            echo "Source and generated runtime already current."
            exit 0
          fi
          git commit -m "Finalize connection profiles and rebuild runtime [profile-finalized]"
          git push origin HEAD:connection-profiles
