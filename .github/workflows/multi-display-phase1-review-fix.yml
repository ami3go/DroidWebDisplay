name: Multi-display Phase 1 Review Fix

on:
  push:
    branches:
      - multi-display-tabs

permissions:
  contents: write

jobs:
  fix-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lifecycle review correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('droid_web_display/scrcpy/session.py')
          text = path.read_text(encoding='utf-8')

          old_watch = '''        session.process = await self.adb.spawn_server(session.serial, args)\n        session.log_task = asyncio.create_task(self._collect_process_log(session))\n        session.process_watch_task = asyncio.create_task(\n            self._watch_server_process(session),\n            name=f"droidwebdisplay-server-watch-{session.session_id}",\n        )\n\n        deadline = asyncio.get_running_loop().time() + self.connect_timeout\n'''
          new_watch = '''        session.process = await self.adb.spawn_server(session.serial, args)\n        session.log_task = asyncio.create_task(self._collect_process_log(session))\n\n        deadline = asyncio.get_running_loop().time() + self.connect_timeout\n'''
          if text.count(old_watch) != 1:
              raise SystemExit(f'watcher placement: expected 1 match, found {text.count(old_watch)}')
          text = text.replace(old_watch, new_watch, 1)

          old_success = '''        try:\n            await self._start_session_resources(session, artifact)\n        except Exception as exc:\n'''
          new_success = '''        try:\n            await self._start_session_resources(session, artifact)\n            process = session.process\n            if process and process.returncode is not None:\n                await self._drain_process_log(session, timeout=1.0)\n                raise SessionError(\n                    "scrcpy server exited during session startup",\n                    details={\n                        "sessionId": session.session_id,\n                        "serial": session.serial,\n                        "returncode": process.returncode,\n                        "serverLog": list(session.server_log),\n                    },\n                )\n        except Exception as exc:\n'''
          if text.count(old_success) != 1:
              raise SystemExit(f'startup success guard: expected 1 match, found {text.count(old_success)}')
          text = text.replace(old_success, new_success, 1)

          old_running = '''        session.state = SessionState.RUNNING\n        session.started_at = time.time()\n        await self.start_monitor()\n        return session\n'''
          new_running = '''        session.state = SessionState.RUNNING\n        session.started_at = time.time()\n        if session.process:\n            session.process_watch_task = asyncio.create_task(\n                self._watch_server_process(session),\n                name=f"droidwebdisplay-server-watch-{session.session_id}",\n            )\n        await self.start_monitor()\n        return session\n'''
          if text.count(old_running) != 1:
              raise SystemExit(f'running watcher: expected 1 match, found {text.count(old_running)}')
          text = text.replace(old_running, new_running, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/regression/session/test_multi_session.py')
          test = test_path.read_text(encoding='utf-8')
          append = '''\n\n@pytest.mark.asyncio\nasync def test_server_exit_during_startup_cleans_only_new_session(tmp_path: Path) -> None:\n    class ExitOnSpawnAdb(FakeAdb):\n        async def spawn_server(self, serial, server_args):\n            process = await super().spawn_server(serial, server_args)\n            process.exit(23)\n            return process\n\n    adb = ExitOnSpawnAdb([AndroidDevice("PHONE", "device")])\n    manager = SessionManager(\n        adb,\n        artifact(tmp_path),\n        connect_timeout=0.2,\n        connect_retry_interval=0.01,\n        monitor_interval=10,\n    )\n\n    with pytest.raises(Exception):\n        await manager.start_session(serial="PHONE", options=SessionOptions(audio=False))\n\n    assert "PHONE" not in manager._device_sessions\n    assert not adb.forward_servers\n    failed = manager.list_sessions()[-1]\n    assert failed.state == SessionState.FAILED\n    assert failed.stop_reason == "start_failed"\n    await manager.close()\n'''
          marker = 'async def test_server_exit_during_startup_cleans_only_new_session'
          if marker in test:
              raise SystemExit('startup failure test already exists')
          test_path.write_text(test + append, encoding='utf-8')
          PY

      - name: Compile corrected modules
        run: python -m compileall -q droid_web_display/scrcpy/session.py tests/regression/session/test_multi_session.py

      - name: Commit review correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add droid_web_display/scrcpy/session.py tests/regression/session/test_multi_session.py
          git commit -m "Fix multi-session startup lifecycle race"
          git push origin HEAD:multi-display-tabs
