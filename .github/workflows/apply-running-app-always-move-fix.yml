name: Apply running app always-move fix

on:
  push:
    branches: [agent/fix-running-app-always-move]
    paths:
      - .github/workflows/apply-running-app-always-move-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-running-app-always-move
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          controller = 'apps/web-client/src/running-app-controller.ts'
          replace_once(controller, '  readonly icon: HTMLElement;\n', '  readonly icon: HTMLButtonElement;\n')
          replace_once(
              controller,
              '    this.#elements = elements;\n    this.#api = api;\n',
              '    this.#elements = elements;\n    this.#api = api;\n    elements.icon.addEventListener("click", () => {\n      this.#dropdownActive = false;\n      this.#refreshAfterDropdown = false;\n      void this.refresh();\n    });\n',
          )
          replace_once(
              controller,
              '    this.#elements.icon.title = `${this.#apps.length} running GUI task(s)`;\n',
              '    this.#elements.icon.title = `Refresh running applications · ${this.#apps.length} GUI task(s)`;\n    this.#elements.icon.setAttribute("aria-label", `Refresh running applications · ${this.#apps.length} GUI task(s)`);\n',
          )
          replace_once(
              controller,
              '    if (app.displayId === displayId) {\n      this.updateSelectionStatus();\n      return;\n    }\n\n',
              '',
          )

          replace_once(
              'apps/web-client/src/main.ts',
              '      icon: required<HTMLElement>("#running-app-icon"),\n',
              '      icon: required<HTMLButtonElement>("#running-app-icon"),\n',
          )

          replace_once(
              'apps/web-client/static/index.html',
              '''          <span id="running-app-icon" class="running-app-header-icon" aria-hidden="true" title="0 running GUI task(s)">\n            <svg viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>\n            <span id="running-app-count" class="running-app-count">0</span>\n          </span>\n''',
              '''          <button id="running-app-icon" class="running-app-header-icon" type="button" aria-label="Refresh running applications · 0 GUI task(s)" title="Refresh running applications · 0 GUI task(s)">\n            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>\n            <span id="running-app-count" class="running-app-count">0</span>\n          </button>\n''',
          )

          replace_once(
              'apps/web-client/static/styles.css',
              '.running-app-header-icon { position: relative; width: 2.12rem; height: 2.12rem; flex: 0 0 2.12rem; display: grid; place-items: center; color: #9fb0c2; }\n',
              '.running-app-header-icon { position: relative; width: 2.12rem; min-width: 2.12rem; height: 2.12rem; min-height: 2.12rem; flex: 0 0 2.12rem; display: grid; place-items: center; padding: 0; border: 1px solid #343d50; border-radius: 8px; background: #202838; color: #9fb0c2; }\n.running-app-header-icon:focus-visible { outline: 2px solid #82a6ff; outline-offset: 2px; }\n',
          )

          header_test = Path('apps/web-client/tests/running-app-header.test.mjs')
          text = header_test.read_text(encoding='utf-8')
          text = text.replace(
              '  assert.match(html, /id="running-app-icon" class="running-app-header-icon"/);\n',
              '  assert.match(html, /<button id="running-app-icon" class="running-app-header-icon"/);\n',
              1,
          )
          text += '''\n\ntest("app icon explicitly refreshes the running GUI task list", () => {\n  assert.match(source, /elements\\.icon\\.addEventListener\\("click"/);\n  assert.match(source, /void this\\.refresh\\(\\)/);\n  assert.match(source, /Refresh running applications/);\n});\n\ntest("every application selection calls the move API", () => {\n  assert.doesNotMatch(source, /if \\(app\\.displayId === displayId\\)/);\n  assert.match(source, /await this\\.#api\\.moveRunningApp\\(\\{/);\n});\n'''
          header_test.write_text(text, encoding='utf-8')

          app_path = Path('droid_web_display/api/app.py')
          app = app_path.read_text(encoding='utf-8')
          start_marker = '        if selected.display_id == session.display_id:\n'
          start = app.find(start_marker)
          if start < 0:
              raise SystemExit('backend already-on-target guard not found')
          end = app.find('        try:\n', start)
          if end < 0:
              raise SystemExit('backend move try block not found')
          app_path.write_text(app[:start] + app[end:], encoding='utf-8')

          regression = Path('tests/regression/test_running_app_always_move.py')
          regression.write_text('''from pathlib import Path\n\n\ndef test_running_app_endpoint_always_attempts_relocation() -> None:\n    root = Path(__file__).resolve().parents[2]\n    source = (root / "droid_web_display" / "api" / "app.py").read_text(encoding="utf-8")\n    start = source.index('@app.post("/api/v1/sessions/{session_id}/virtual-display/move-running-app")')\n    end = source.find("\\n    @app.", start + 1)\n    route = source[start:] if end < 0 else source[start:end]\n    assert "if selected.display_id == session.display_id" not in route\n    assert "move_running_app_to_display(" in route\n''', encoding='utf-8')
          PY
      - name: Install dependencies and rebuild generated client
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --locked --extra dev
          npm ci --prefix packages/scrcpy-protocol
          npm run build --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client
          npm run build --prefix apps/web-client
      - name: Verify focused and full regression gates
        run: |
          npm test --prefix apps/web-client
          $HOME/.local/bin/uv run pytest -q tests/regression/test_running_app_always_move.py
          $HOME/.local/bin/uv run python tools/release_gate.py --require-web-client-build --output /tmp/gate-running-app-always-move.json
      - name: Commit verified product changes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web-client droid_web_display/api/app.py tests/regression/test_running_app_always_move.py
          git rm .github/workflows/apply-running-app-always-move-fix.yml
          git commit -m "Always relocate selected app and refresh from app icon"
          git push origin HEAD:agent/fix-running-app-always-move
