name: Apply check for updates

on:
  push:
    branches:
      - agent/check-for-updates-builder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Add update checker and desktop UI
        shell: bash
        run: |
          cat > droid_web_display/desktop/update_check.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          import json
          import re
          from urllib.request import Request, urlopen

          RELEASES_URL = "https://api.github.com/repos/ami3go/DroidWebDisplay/releases?per_page=30"
          _VERSION_RE = re.compile(
              r"(?<!\d)(\d+)\.(\d+)\.(\d+)(?:[-._]?(alpha|a|beta|b|rc)[.-]?(\d+))?",
              re.IGNORECASE,
          )
          _PRERELEASE_RANK = {"a": 0, "alpha": 0, "b": 1, "beta": 1, "rc": 2}


          @dataclass(frozen=True)
          class ReleaseInfo:
              tag: str
              name: str
              url: str
              prerelease: bool
              version: str


          def _version_parts(value: str) -> tuple[tuple[int, int, int, int, int], str]:
              match = _VERSION_RE.search(value)
              if match is None:
                  raise ValueError(f"Could not parse version from {value!r}")
              major, minor, patch = (int(match.group(index)) for index in (1, 2, 3))
              prerelease = (match.group(4) or "").casefold()
              prerelease_number = int(match.group(5) or 0)
              if prerelease:
                  rank = _PRERELEASE_RANK[prerelease]
                  canonical = "a" if prerelease in {"a", "alpha"} else "b" if prerelease in {"b", "beta"} else "rc"
                  normalized = f"{major}.{minor}.{patch}{canonical}{prerelease_number}"
              else:
                  rank = 3
                  prerelease_number = 0
                  normalized = f"{major}.{minor}.{patch}"
              return (major, minor, patch, rank, prerelease_number), normalized


          def normalize_release_version(value: str) -> str:
              return _version_parts(value)[1]


          def is_newer_release(current_version: str, release_tag: str) -> bool:
              current_key, _current = _version_parts(current_version)
              release_key, _release = _version_parts(release_tag)
              return release_key > current_key


          def check_latest_release(channel: str, *, timeout: float = 5.0) -> ReleaseInfo:
              normalized_channel = channel.casefold()
              if normalized_channel not in {"stable", "pre-release"}:
                  raise ValueError(f"Unsupported release channel: {channel}")

              request = Request(
                  RELEASES_URL,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "DroidWebDisplay",
                  },
              )
              with urlopen(request, timeout=timeout) as response:  # nosec B310 - fixed HTTPS GitHub endpoint
                  payload = json.loads(response.read().decode("utf-8"))
              if not isinstance(payload, list):
                  raise RuntimeError("GitHub returned an unexpected release response")

              candidates: list[tuple[tuple[int, int, int, int, int], ReleaseInfo]] = []
              include_prerelease = normalized_channel == "pre-release"
              for item in payload:
                  if not isinstance(item, dict) or item.get("draft"):
                      continue
                  prerelease = bool(item.get("prerelease"))
                  if prerelease and not include_prerelease:
                      continue
                  tag = str(item.get("tag_name") or "").strip()
                  url = str(item.get("html_url") or "").strip()
                  if not tag or not url:
                      continue
                  try:
                      version_key, version = _version_parts(tag)
                  except ValueError:
                      continue
                  candidates.append(
                      (
                          version_key,
                          ReleaseInfo(
                              tag=tag,
                              name=str(item.get("name") or tag),
                              url=url,
                              prerelease=prerelease,
                              version=version,
                          ),
                      )
                  )

              if not candidates:
                  raise RuntimeError(f"No {channel} release was found")
              return max(candidates, key=lambda candidate: candidate[0])[1]
          PY

          cat > tests/desktop/test_update_check.py <<'PY'
          from __future__ import annotations

          import json

          from droid_web_display.desktop import update_check


          class _Response:
              def __init__(self, payload: object) -> None:
                  self.payload = payload

              def __enter__(self) -> "_Response":
                  return self

              def __exit__(self, *_args: object) -> None:
                  return None

              def read(self) -> bytes:
                  return json.dumps(self.payload).encode("utf-8")


          def test_normalizes_project_release_tags() -> None:
              assert update_check.normalize_release_version("v0.11.2") == "0.11.2"
              assert update_check.normalize_release_version("stable-v0.11.3-rc.4") == "0.11.3rc4"


          def test_release_order_handles_rc_and_final_versions() -> None:
              assert update_check.is_newer_release("0.11.2", "v0.11.3-rc.1")
              assert not update_check.is_newer_release("0.11.2", "stable-v0.11.2-rc.3")
              assert update_check.is_newer_release("0.11.2-rc.2", "v0.11.2")


          def test_stable_channel_skips_prereleases(monkeypatch) -> None:  # type: ignore[no-untyped-def]
              payload = [
                  {
                      "tag_name": "stable-v0.12.0-rc.1",
                      "name": "0.12.0 RC1",
                      "html_url": "https://example.invalid/rc",
                      "prerelease": True,
                      "draft": False,
                  },
                  {
                      "tag_name": "v0.11.3",
                      "name": "0.11.3",
                      "html_url": "https://example.invalid/stable",
                      "prerelease": False,
                      "draft": False,
                  },
              ]
              monkeypatch.setattr(update_check, "urlopen", lambda *_args, **_kwargs: _Response(payload))
              result = update_check.check_latest_release("Stable")
              assert result.tag == "v0.11.3"
              assert not result.prerelease


          def test_prerelease_channel_uses_highest_version(monkeypatch) -> None:  # type: ignore[no-untyped-def]
              payload = [
                  {
                      "tag_name": "v0.11.3",
                      "html_url": "https://example.invalid/stable",
                      "prerelease": False,
                      "draft": False,
                  },
                  {
                      "tag_name": "stable-v0.12.0-rc.2",
                      "html_url": "https://example.invalid/rc",
                      "prerelease": True,
                      "draft": False,
                  },
              ]
              monkeypatch.setattr(update_check, "urlopen", lambda *_args, **_kwargs: _Response(payload))
              result = update_check.check_latest_release("Pre-release")
              assert result.tag == "stable-v0.12.0-rc.2"
              assert result.version == "0.12.0rc2"
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("droid_web_display/desktop/gui.py")
          gui = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global gui
              count = gui.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              gui = gui.replace(old, new, 1)

          replace_once(
              "from PySide6.QtCore import QObject, QRunnable, QSettings, QThreadPool, QTimer, Qt, Signal",
              "from PySide6.QtCore import QObject, QRunnable, QSettings, QThreadPool, QTimer, Qt, QUrl, Signal",
              "QtCore import",
          )
          replace_once(
              "from PySide6.QtGui import QAction, QCloseEvent, QIcon",
              "from PySide6.QtGui import QAction, QCloseEvent, QDesktopServices, QIcon",
              "QtGui import",
          )
          replace_once(
              "from droid_web_display.desktop.controller import ServerController, ServerSnapshot, ServerState\n",
              "from droid_web_display.desktop.controller import ServerController, ServerSnapshot, ServerState\n"
              "from droid_web_display.desktop.update_check import (\n"
              "    ReleaseInfo,\n"
              "    check_latest_release,\n"
              "    is_newer_release,\n"
              ")\n",
              "update checker import",
          )
          replace_once(
              "        self._last_log_signature: tuple[object, ...] | None = None\n",
              "        self._last_log_signature: tuple[object, ...] | None = None\n"
              "        self._latest_release_url = \"\"\n",
              "release URL state",
          )

          settings_tail = '''        logging_layout.addWidget(open_logs, alignment=Qt.AlignLeft)\n\n        layout.addWidget(startup_card)\n        layout.addWidget(logging_card)\n        layout.addStretch(1)\n        return page\n'''
          settings_replacement = '''        logging_layout.addWidget(open_logs, alignment=Qt.AlignLeft)\n\n        update_card, update_layout = _make_card(\n            "Updates",\n            "Checks GitHub releases only; it does not install or replace the current build.",\n        )\n        update_form = QFormLayout()\n        update_form.setContentsMargins(0, 0, 0, 0)\n        update_form.setHorizontalSpacing(28)\n        update_form.setVerticalSpacing(8)\n        update_form.addRow(_field_label("Current version"), _field_value(__version__))\n        self._update_channel = QComboBox()\n        self._update_channel.addItems(["Stable", "Pre-release"])\n        saved_channel = str(self._settings.value("updateChannel", "Stable"))\n        self._update_channel.setCurrentText(\n            saved_channel if saved_channel in {"Stable", "Pre-release"} else "Stable"\n        )\n        self._update_channel.currentTextChanged.connect(\n            lambda value: self._settings.setValue("updateChannel", value)\n        )\n        update_form.addRow(_field_label("Release channel"), self._update_channel)\n        update_layout.addLayout(update_form)\n\n        update_actions = QHBoxLayout()\n        update_actions.setContentsMargins(0, 0, 0, 0)\n        update_actions.setSpacing(8)\n        self._check_updates_button = QPushButton("Check for updates")\n        self._check_updates_button.clicked.connect(self._check_for_updates)\n        self._open_release_button = QPushButton("Open release page")\n        self._open_release_button.setEnabled(False)\n        self._open_release_button.clicked.connect(self._open_latest_release)\n        update_actions.addWidget(self._check_updates_button)\n        update_actions.addWidget(self._open_release_button)\n        update_actions.addStretch(1)\n        update_layout.addLayout(update_actions)\n\n        self._update_status = QLabel("")\n        self._update_status.setObjectName("sectionHint")\n        self._update_status.setWordWrap(True)\n        update_layout.addWidget(self._update_status)\n\n        layout.addWidget(startup_card)\n        layout.addWidget(logging_card)\n        layout.addWidget(update_card)\n        layout.addStretch(1)\n        return page\n'''
          replace_once(settings_tail, settings_replacement, "settings updates card")

          property_anchor = '''    @property\n    def open_browser_on_start(self) -> bool:\n'''
          methods = '''    def _check_for_updates(self) -> None:\n        channel = self._update_channel.currentText()\n        self._check_updates_button.setEnabled(False)\n        self._open_release_button.setEnabled(False)\n        self._update_status.setText(f"Checking {channel.lower()} releases…")\n\n        def completed(result: object) -> None:\n            self._check_updates_button.setEnabled(True)\n            if not isinstance(result, ReleaseInfo):\n                self._update_status.setText("GitHub returned an unexpected release result.")\n                return\n            self._latest_release_url = result.url\n            self._open_release_button.setEnabled(True)\n            try:\n                update_available = is_newer_release(__version__, result.tag)\n            except ValueError as exc:\n                self._update_status.setText(f"Could not compare release versions: {exc}")\n                return\n            if update_available:\n                self._update_status.setText(\n                    f"Update available: {result.tag} · current version {__version__}"\n                )\n            else:\n                self._update_status.setText(\n                    f"Up to date: {__version__} · latest {channel.lower()} release {result.tag}"\n                )\n\n        def failed(message: str) -> None:\n            self._check_updates_button.setEnabled(True)\n            self._update_status.setText(f"Update check failed: {message}")\n\n        self._start_support_task(\n            lambda: check_latest_release(channel),\n            on_ready=completed,\n            on_failed=failed,\n        )\n\n    def _open_latest_release(self) -> None:\n        if self._latest_release_url:\n            QDesktopServices.openUrl(QUrl(self._latest_release_url))\n\n'''
          replace_once(property_anchor, methods + property_anchor, "update methods")
          path.write_text(gui, encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path("tests/desktop/test_layout_regression.py")
          text = path.read_text(encoding="utf-8")
          addition = '''\n\ndef test_settings_include_only_minimal_update_checker() -> None:\n    gui = (ROOT / "droid_web_display/desktop/gui.py").read_text(encoding="utf-8")\n    assert '_make_card("Updates"' in gui or '"Updates",' in gui\n    assert 'QPushButton("Check for updates")' in gui\n    assert 'QPushButton("Open release page")' in gui\n    assert 'self._update_channel.addItems(["Stable", "Pre-release"])' in gui\n    assert 'Configuration backup' not in gui\n    assert 'Tray notifications' not in gui\n    assert 'Live event timeline' not in gui\n'''
          if "test_settings_include_only_minimal_update_checker" not in text:
              path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Remove implementation helper
        run: rm .github/workflows/agent-check-for-updates.yml

      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json

      - name: Install verified uv
        run: |
          python tools/fetch_verified_artifact.py uv-linux-x86_64 .tools/uv.tar.gz
          mkdir -p .tools/uv
          tar -xzf .tools/uv.tar.gz -C .tools/uv --strip-components=1

      - name: Sync locked Python environment
        run: .tools/uv/uv sync --locked --extra dev

      - name: Install web dependencies
        run: |
          npm ci --prefix packages/scrcpy-protocol
          npm ci --prefix apps/web-client

      - name: Run targeted desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .tools/uv/uv run pytest -q tests/desktop/test_update_check.py tests/desktop/test_gui.py tests/desktop/test_layout_regression.py

      - name: Run full release gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: .tools/uv/uv run python tools/release_gate.py --require-web-client-build --output /tmp/check-for-updates-release-gate.json

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add desktop update checker"
          git push origin HEAD:agent/check-for-updates-builder
