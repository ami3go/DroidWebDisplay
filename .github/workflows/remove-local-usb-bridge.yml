name: Remove Legacy Header Subtitle

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/remove-local-usb-bridge.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web-client/package-lock.json
            packages/scrcpy-protocol/package-lock.json
      - name: Remove legacy subtitle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-client/static/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<span class="eyebrow">LOCAL USB BRIDGE</span>'
          assert old in text
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Build protocol
        working-directory: packages/scrcpy-protocol
        run: |
          npm ci
          npm run build
      - name: Build and test web client
        working-directory: apps/web-client
        run: |
          npm ci
          npm test
      - name: Commit markup and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-local-usb-bridge.yml
          git add apps/web-client/static/index.html apps/web-client/dist-manifest.json
          git add -u apps/web-client/dist
          git commit -m "Remove legacy local USB bridge subtitle"
          git push origin HEAD:agent/connect-drawer
