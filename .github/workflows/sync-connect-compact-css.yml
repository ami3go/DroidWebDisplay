name: Sync Connect Compact CSS

on:
  push:
    branches:
      - agent/connect-drawer
    paths:
      - .github/workflows/sync-connect-compact-css.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-drawer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build protocol
        working-directory: packages/scrcpy-protocol
        run: npm ci && npm run build
      - name: Build and test web client
        working-directory: apps/web-client
        run: npm ci && npm test
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/dist-manifest.json
          git add -u apps/web-client/dist
          git add -f apps/web-client/dist/droidwebdisplay-connect-drawer.css
          git diff --cached --quiet && exit 0
          git commit -m "Sync compact Connect drawer assets"
          git push origin HEAD:agent/connect-drawer
