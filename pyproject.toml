[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-bridge-scrcpy"
version = "0.11.2"
description = "Browser Android bridge with PC-local PIN authentication and trusted sessions"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
  "websockets==16.0",
  "python-multipart==0.0.29",
  "cryptography==46.0.4",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["gpt_bridge*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
